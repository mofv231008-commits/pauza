<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Дровосек</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>

</style>
</head>
<body>
<div class="stage" id="stage">
<canvas id="game" aria-label="Дровосек. Нажимай слева или справа от дерева"></canvas>
</div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['удар', 'удара', 'ударов'];
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var segs = [], side = 1, score = 0, life = 1, chopT = 0, flying = [], dead = false, S = 1, fx = [];
  var shell = P.shell({
    id: 'lumber', title: 'Дровосек', tagline: 'Руби быстро, но смотри наверх.',
    rulesHtml: '<p>Нажимай слева или справа от дерева — дровосек встаёт туда и рубит. Ветка над головой с твоей стороны — смерть. Время тает, каждый удар его добавляет. Чем дальше, тем быстрее.</p>',
    startLabel: 'Рубить', countdown: false, overEyebrow: 'Бац!',
    unit: function (n) { return P.plural(n, U); }, kbdHint: 'На компьютере: стрелки ← →', onReset: reset
  });
  var view = P.canvas(canvas, stage, function () { S = P.clamp(view.W / 390, 0.8, 1.3); });
  function gen(prev) { if (prev !== 0 || Math.random() < 0.35) return 0; return Math.random() < 0.5 ? -1 : 1; }
  function reset() { segs = [0, 0, 0]; while (segs.length < 9) segs.push(gen(segs[segs.length - 1])); side = 1; score = 0; life = 1; dead = false; flying = []; fx = []; shell.setScore('0'); }
  function chop(s) {
    if (!shell.running || dead) return;
    side = s;
    if (segs[0] === s) { die(); return; }
    flying.push({ x: view.W / 2, y: base() - segH() / 2, vx: -s * 380 * S, vy: -160 * S, rot: 0, br: segs[0] });
    segs.shift(); segs.push(gen(segs[segs.length - 1]));
    score++; shell.setScore(String(score)); life = Math.min(1, life + 0.055); chopT = 0.1; P.haptic('tap');
    if (segs[0] === s) die();
  }
  function die() { dead = true; P.haptic('crash'); for (var i = 0; i < 24; i++) { var a = Math.random() * 6.28, sp = 60 + Math.random() * 200; fx.push({ x: view.W / 2 + side * 60 * S, y: base() - 40 * S, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.7 }); } shell.end({ score: score, delay: 700, phrase: 'В «Дровосеке» я нарубил ' + score + ' ' + P.plural(score, U) + '. Нарубишь больше?' }); }
  function base() { return view.H - 70 * S; }
  function segH() { return 74 * S; }
  P.loop(function (dt) {
    if (shell.running && !dead) {
      life -= dt * (0.11 + Math.min(0.3, score * 0.0028));
      if (life <= 0) { life = 0; dead = true; P.haptic('crash'); shell.end({ score: score, delay: 500, eyebrow: 'Время вышло', phrase: 'В «Дровосеке» я нарубил ' + score + ' ' + P.plural(score, U) + '. Нарубишь больше?' }); }
      shell.setSide('<span style="display:inline-block;width:70px;height:8px;border-radius:4px;background:rgba(185,168,240,.3);overflow:hidden"><i style="display:block;height:100%;width:' + Math.round(life * 100) + '%;background:' + (life < 0.3 ? '#FF6B4A' : '#3DF5B0') + '"></i></span>', life < 0.3);
    }
    chopT = Math.max(0, chopT - dt);
    flying.forEach(function (f) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 900 * S * dt; f.rot += f.vx > 0 ? 8 * dt : -8 * dt; }); flying = flying.filter(function (f) { return f.y < view.H + 100; });
    fx.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }); fx = fx.filter(function (p) { return p.life > 0; });
    draw();
  });
  function trunk(c, x, y, w, h, br) {
    c.fillStyle = '#9C5A3C'; c.fillRect(x - w / 2, y - h, w, h + 1); c.fillStyle = '#7A4430'; c.fillRect(x - w / 2, y - h, w, 3 * S); c.fillRect(x - w * 0.15, y - h * 0.6, 3 * S, h * 0.4);
    if (br) {
      var bx = br < 0 ? x - w / 2 - 92 * S : x + w / 2, by = y - h * 0.62;
      c.fillStyle = '#7A4430'; c.fillRect(bx, by, 92 * S, 14 * S);
      c.fillStyle = '#1FA67A'; c.beginPath(); c.arc(br < 0 ? bx + 8 * S : bx + 84 * S, by + 2 * S, 16 * S, 0, 7); c.fill(); c.fillStyle = '#3DF5B0'; c.beginPath(); c.arc(br < 0 ? bx + 22 * S : bx + 70 * S, by - 4 * S, 11 * S, 0, 7); c.fill();
    }
  }
  function draw() {
    var c = view.ctx, W = view.W, H = view.H, b = base(), h = segH(), tw = 70 * S;
    var sky = c.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#5B3FD0'); sky.addColorStop(1, '#6FD3FF'); c.fillStyle = sky; c.fillRect(0, 0, W, H);
    c.fillStyle = '#1FA67A'; c.fillRect(0, b, W, H - b); c.fillStyle = '#3DF5B0'; c.fillRect(0, b, W, 8 * S);
    c.fillStyle = '#7A4430'; c.fillRect(W / 2 - tw * 0.6, b - 8 * S, tw * 1.2, 12 * S);
    for (var i = 0; i < segs.length; i++) trunk(c, W / 2, b - i * h, tw, h, segs[i]);
    flying.forEach(function (f) { c.save(); c.translate(f.x, f.y); c.rotate(f.rot); trunk(c, 0, h / 2, tw, h, 0); c.restore(); });
    if (!dead) {
      var px = W / 2 + side * (tw / 2 + 44 * S), py = b;
      c.save(); c.translate(px, py); c.scale(side, 1);
      c.fillStyle = '#3B1E8C'; c.fillRect(-12 * S, -26 * S, 9 * S, 26 * S); c.fillRect(3 * S, -26 * S, 9 * S, 26 * S);
      c.fillStyle = P.gold() ? '#FFD84D' : '#FF6B4A'; c.fillRect(-16 * S, -62 * S, 32 * S, 38 * S);
      c.fillStyle = '#FFD3B0'; c.beginPath(); c.arc(0, -74 * S, 13 * S, 0, 7); c.fill();
      c.fillStyle = '#120630'; c.fillRect(-14 * S, -88 * S, 28 * S, 8 * S);
      c.save(); c.translate(-14 * S, -48 * S); c.rotate(chopT > 0 ? -1.4 : -0.4); c.fillStyle = '#7A4430'; c.fillRect(-4 * S, -40 * S, 6 * S, 40 * S); c.fillStyle = '#B9A8F0'; c.fillRect(-14 * S, -42 * S, 14 * S, 12 * S); c.restore();
      c.restore();
    }
    fx.forEach(function (p) { c.globalAlpha = Math.min(1, p.life * 2); c.fillStyle = '#FF6B4A'; c.fillRect(p.x - 3, p.y - 3, 6, 6); }); c.globalAlpha = 1;
  }
  canvas.addEventListener('pointerdown', function (e) { var r = canvas.getBoundingClientRect(); chop(e.clientX - r.left < r.width / 2 ? -1 : 1); });
  window.addEventListener('keydown', function (e) { if (e.code === 'ArrowLeft') { e.preventDefault(); chop(-1); } if (e.code === 'ArrowRight') { e.preventDefault(); chop(1); } });
  reset();
})();
</script>
</body>
</html>
