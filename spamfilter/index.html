<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Спам или нет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>

</style>
</head>
<body>
<div class="stage" id="stage">
<script src="../shared/quiz.js?v=1"></script>
</div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var SPAM = [
    ['+7 951 ••• 22 18', 'Мама, я разбил телефон, это мой новый номер. Скинь 5000 до вечера, потом объясню'],
    ['Служба безопасности банка', 'Зафиксирована попытка входа в ваш кабинет. Назовите код из СМС, чтобы отменить операцию'],
    ['Розыгрыш', 'Поздравляем! Вы выиграли смартфон. Оплатите только доставку 299 ₽ по ссылке'],
    ['Работа мечты', 'Заработок от 100 000 ₽ в неделю без опыта! Нужен только телефон. Пиши «ДА»'],
    ['Почта', 'Ваша посылка задержана на таможне. Оплатите пошлину в течение часа по ссылке, иначе её вернут'],
    ['Крипто-инвест', 'Удвоим ваши деньги за сутки. Уже 10 000 довольных клиентов. Минимальный взнос 1000 ₽'],
    ['Неизвестный', 'Привет! Это ты на фото? 😳 смотри по ссылке'],
    ['Подруга Оля', 'Привет! Проголосуй, пожалуйста, за мою племянницу в конкурсе — там надо войти через аккаунт и ввести код'],
    ['Штрафы онлайн', 'У вас неоплаченный штраф. Оплатите со скидкой 50% по ссылке в течение 30 минут'],
    ['Поддержка мессенджера', 'Ваш аккаунт будет удалён через 24 часа. Подтвердите пароль, перейдя по ссылке'],
    ['Бонусы', 'Вам начислено 5000 бонусов! Для получения введите номер карты и срок действия'],
    ['Казино «Удача»', 'Только сегодня: 300% к депозиту и 100 бесплатных вращений!'],
    ['+7 900 ••• 00 01', 'Я ошибся номером и случайно перевёл вам 3000 ₽. Верните, пожалуйста, на эту карту'],
    ['Лотерея', 'Ваш номер выиграл 1 000 000 ₽! Для получения выигрыша оплатите налог 2000 ₽'],
    ['Магазин', 'Скидка 95% на всё! Только 2 часа! Успей купить по ссылке'],
    ['Начальник (новый номер)', 'Это твой руководитель, пишу с нового номера. Сейчас позвонят из «органов», делай всё, что скажут'],
    ['Госвыплаты', 'Вам положена компенсация 18 000 ₽. Чтобы получить, заполните анкету с данными карты'],
    ['Неизвестный', 'Я взломал твою камеру. Переведи деньги, иначе отправлю видео всем контактам'],
    ['Друг Саша', 'Срочно займи 10 тысяч, телефон сел, пишу с чужого. Скинь на эту карту'],
    ['Оператор связи', 'Срок действия вашей сим-карты истекает. Продлите, назвав код из СМС']
  ];
  var OK = [
    ['Мама', 'Купи хлеба по дороге домой, пожалуйста'], ['Одногруппники', 'Кто-нибудь записал домашку по истории?'], ['Катя', 'Во сколько встречаемся у кино?'],
    ['Староста', 'Пары завтра не будет, преподаватель заболел'], ['Бабушка', 'С днём рождения, внучек! Приезжай на пирожки 🥧'], ['Друг Саша', 'Я опоздаю минут на десять, займи место'],
    ['Папа', 'Ты дома? Я ключи забыл'], ['Друзья', 'Посмотрел фильм, который ты советовал, — огонь!'], ['Мама', 'Позвони, как освободишься'],
    ['Лёша', 'Пойдём в субботу в кино?'], ['Сестра', 'Спасибо, что помог с переездом!'], ['Друзья', 'Что подарим Кате на день рождения?'],
    ['Мама', 'Не забудь зонт, обещают дождь'], ['Друг', 'Как прошёл экзамен?'], ['Катя', 'Скинь фотки с поездки 📸'], ['Работа', 'Встречу перенесли на четверг, в 15:00'],
    ['Бабушка', 'Приходи на ужин в семь'], ['Коллега', 'Я взял тебе кофе, он на столе'], ['Сосед', 'У вас посылка у меня, заберите вечером'], ['Тренер', 'Тренировка сегодня в зале номер 2']
  ];
  var all = [];
  SPAM.forEach(function (s) { all.push([s[0], s[1], 1]); }); OK.forEach(function (s) { all.push([s[0], s[1], 0]); });
  var order = [], pos = 0;
  PauzaQuiz({
    id: 'spamfilter', title: 'Спам или нет', tagline: 'Научись узнавать мошенников с одного взгляда.',
    rules: '<p>Приходит сообщение. Свайпни влево или нажми «Спам», если это мошенники или реклама. Вправо — если нормальное. Ошибка — минус 3 секунды и подсказка, что выдало обман.</p>',
    swipe: true,
    onReset: function () { order = P.shuffle(all.map(function (_, i) { return i; })); pos = 0; },
    next: function () {
      if (!order.length || pos >= order.length) { order = P.shuffle(all.map(function (_, i) { return i; })); pos = 0; }
      var m = all[order[pos++]];
      return { sub: 'от: ' + m[0], q: m[1], opts: ['👈 Спам', 'Норм 👉'], right: m[2] ? 0 : 1, cls: 'long',
        explain: m[2] ? 'Это обман: просят деньги, код, данные карты или торопят.' : 'Это обычное сообщение от знакомых.' };
    },
    phrase: function (s) { return 'В «Спам или нет» я распознал ' + s + ' сообщений за минуту. Тебя не обманут?'; }
  });
})();
</script>
</body>
</html>
