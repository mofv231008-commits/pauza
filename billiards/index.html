<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Бильярд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>.stage{background:#140734}</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="game" aria-label="Бильярд. Потяни назад от биты и отпусти"></canvas></div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['шар', 'шара', 'шаров'], TOP = 70, SUB = 6;
  var COLS = ['#FFD84D', '#FF6B4A', '#3DF5B0', '#6FD3FF', '#FF8AD8', '#B9A8F0', '#FF9A6B', '#FFD84D', '#3DF5B0', '#FF6B4A'];
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var T = null, br = 8, pr = 15, pockets = [], balls = [], cue = null, aim = null, potted = 0, shots = 0, scratch = false, msg = null, moving = false;

  var shell = P.shell({
    id: 'billiards', title: 'Бильярд', tagline: 'Забей как можно больше шаров за минуту.',
    rulesHtml: '<p>Потяни пальцем назад от белого шара, как рогатку, и отпусти: чем дальше тянешь, тем сильнее удар. Забивай цветные шары в лузы. Белый в лузе — минус 5 секунд. Очистишь стол — плюс 10 секунд и новая пирамида.</p>',
    startLabel: 'Разбить', countdown: false, overEyebrow: 'Время вышло',
    unit: function (n) { return P.plural(n, U); },
    onReset: reset
  });
  var timer = P.timeLimit(shell, 60, finish);
  var view = P.canvas(canvas, stage, layout);
  function layout() {
    var W = view.W, H = view.H, ah = H - TOP - 30, w = Math.min(W - 40, ah * 0.56), h = w / 0.56, oT = T;
    T = { x: (W - w) / 2, y: TOP + 10 + (ah - h) / 2, w: w, h: h };
    br = w * 0.036; pr = br * 1.9;
    pockets = [[0, 0], [1, 0], [0, 0.5], [1, 0.5], [0, 1], [1, 1]].map(function (p) { return { x: T.x + p[0] * T.w, y: T.y + p[1] * T.h }; });
    if (oT && balls.length) {
      var k = T.w / oT.w;
      balls.forEach(function (b) { b.x = T.x + (b.x - oT.x) * k; b.y = T.y + (b.y - oT.y) * k; b.vx *= k; b.vy *= k; });
    } else rack(true);
  }
  function rack(withCue) {
    var cx = T.x + T.w / 2, ay = T.y + T.h * 0.34, list = [], n = 0;
    for (var r = 0; r < 4; r++) for (var i = 0; i <= r; i++) list.push({ x: cx + (i - r / 2) * br * 2.04, y: ay - r * br * 1.78, vx: 0, vy: 0, col: COLS[n++], cue: false, in: false });
    if (withCue || !cue) { cue = { x: cx, y: T.y + T.h * 0.76, vx: 0, vy: 0, col: '#F4F1FF', cue: true, in: false }; }
    balls = [cue].concat(list);
  }
  function reset() { potted = 0; shots = 0; scratch = false; msg = null; aim = null; moving = false; if (T) rack(true); shell.setScore('0'); timer.reset(); }
  function finish() { aim = null; shell.end({ score: potted, delay: 300, stats: 'ударов: ' + shots, phrase: 'В «Бильярде» я забиваю ' + potted + ' ' + P.plural(potted, U) + ' за минуту. Сможешь больше?' }); }
  function free(x, y) { return balls.every(function (b) { return b === cue || b.in || Math.hypot(b.x - x, b.y - y) > br * 2.2; }); }
  function respot() {
    var x = T.x + T.w / 2, y = T.y + T.h * 0.76, tries = 0;
    while (!free(x, y) && tries++ < 40) { x = T.x + br * 2 + Math.random() * (T.w - br * 4); y = T.y + T.h * (0.6 + Math.random() * 0.3); }
    cue.x = x; cue.y = y; cue.vx = cue.vy = 0; cue.in = false;
  }
  function physics(h) {
    var live = balls.filter(function (b) { return !b.in; });
    live.forEach(function (b) { b.x += b.vx * h; b.y += b.vy * h; });
    for (var i = 0; i < live.length; i++) for (var j = i + 1; j < live.length; j++) {
      var a = live[i], b = live[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d < br * 2 && d > 1e-6) {
        var nx = dx / d, ny = dy / d, o = (br * 2 - d) / 2;
        a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
        var vr = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (vr > 0) { var imp = vr * 0.97; a.vx -= imp * nx; a.vy -= imp * ny; b.vx += imp * nx; b.vy += imp * ny; }
      }
    }
    live.forEach(function (b) {
      for (var k = 0; k < pockets.length; k++) if (Math.hypot(b.x - pockets[k].x, b.y - pockets[k].y) < pr) { sink(b); return; }
      var nearP = pockets.some(function (p) { return Math.hypot(b.x - p.x, b.y - p.y) < pr * 1.5; });
      if (!nearP) {
        if (b.x < T.x + br) { b.x = T.x + br; b.vx = Math.abs(b.vx) * 0.78; }
        if (b.x > T.x + T.w - br) { b.x = T.x + T.w - br; b.vx = -Math.abs(b.vx) * 0.78; }
        if (b.y < T.y + br) { b.y = T.y + br; b.vy = Math.abs(b.vy) * 0.78; }
        if (b.y > T.y + T.h - br) { b.y = T.y + T.h - br; b.vy = -Math.abs(b.vy) * 0.78; }
      } else if (b.x < T.x - br || b.x > T.x + T.w + br || b.y < T.y - br || b.y > T.y + T.h + br) sink(b);
    });
  }
  function sink(b) {
    b.in = true; b.vx = b.vy = 0;
    if (b.cue) { scratch = true; P.haptic('crash'); }
    else { potted++; shell.setScore(String(potted)); P.haptic('coin'); }
  }
  P.loop(function (dt) {
    if (!T) return;
    if (shell.running) {
      for (var s = 0; s < SUB; s++) physics(dt / SUB);
      var any = false;
      balls.forEach(function (b) {
        if (b.in) return;
        var sp = Math.hypot(b.vx, b.vy);
        if (sp > 0) {
          var ns = Math.max(0, sp * Math.pow(0.55, dt) - T.w * 0.12 * dt);
          if (ns < T.w * 0.015) ns = 0;
          b.vx *= ns / sp; b.vy *= ns / sp;
          if (ns > 0) any = true;
        }
      });
      if (moving && !any) {
        moving = false;
        if (scratch) { scratch = false; respot(); timer.add(-5); msg = { text: 'Белый в лузе: −5 с', life: 1.4 }; }
        if (shell.running && balls.every(function (b) { return b.cue || b.in; })) { rack(false); timer.add(10); msg = { text: 'Стол чист! +10 с', life: 1.4 }; }
      }
    }
    if (msg) { msg.life -= dt; if (msg.life <= 0) msg = null; }
    draw();
  });
  function draw() {
    var ctx = view.ctx, W = view.W, H = view.H;
    ctx.fillStyle = '#140734'; ctx.fillRect(0, 0, W, H);
    if (!T) return;
    var rim = br * 1.3;
    ctx.fillStyle = '#5A2E1A'; ctx.beginPath(); ctx.roundRect(T.x - rim, T.y - rim, T.w + rim * 2, T.h + rim * 2, rim); ctx.fill();
    ctx.fillStyle = '#138A5E'; ctx.fillRect(T.x, T.y, T.w, T.h);
    ctx.strokeStyle = 'rgba(244,241,255,.12)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(T.x, T.y + T.h * 0.76); ctx.lineTo(T.x + T.w, T.y + T.h * 0.76); ctx.stroke();
    ctx.fillStyle = '#0E0526'; pockets.forEach(function (p) { ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, Math.PI * 2); ctx.fill(); });
    if (aim && !moving && !cue.in) {
      var dx = aim.sx - aim.x, dy = aim.sy - aim.y, len = Math.min(Math.hypot(dx, dy), T.w * 0.5), a = Math.atan2(dy, dx), k = len / (T.w * 0.5);
      if (len > 6) {
        ctx.strokeStyle = 'rgba(244,241,255,.7)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cue.x, cue.y); ctx.lineTo(cue.x + Math.cos(a) * T.h, cue.y + Math.sin(a) * T.h); ctx.stroke(); ctx.setLineDash([]);
        ctx.strokeStyle = '#E9C38A'; ctx.lineWidth = br * 0.5; ctx.beginPath();
        ctx.moveTo(cue.x - Math.cos(a) * (br * 1.6 + len * 0.4), cue.y - Math.sin(a) * (br * 1.6 + len * 0.4)); ctx.lineTo(cue.x - Math.cos(a) * (br * 1.6 + len * 0.4 + T.w * 0.7), cue.y - Math.sin(a) * (br * 1.6 + len * 0.4 + T.w * 0.7)); ctx.stroke();
        ctx.fillStyle = 'rgba(244,241,255,.15)'; ctx.fillRect(T.x, T.y + T.h + rim + 8, T.w, 6);
        ctx.fillStyle = k > 0.75 ? '#FF6B4A' : k > 0.4 ? '#FFD84D' : '#3DF5B0'; ctx.fillRect(T.x, T.y + T.h + rim + 8, T.w * k, 6);
      }
    }
    balls.forEach(function (b) {
      if (b.in) return;
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(b.x + br * 0.15, b.y + br * 0.2, br, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = b.cue && P.gold() ? '#FFF3C4' : b.col; ctx.beginPath(); ctx.arc(b.x, b.y, br, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(b.x - br * 0.35, b.y - br * 0.35, br * 0.28, 0, Math.PI * 2); ctx.fill();
    });
    if (msg) { ctx.globalAlpha = Math.min(1, msg.life * 2); ctx.fillStyle = '#FFD84D'; ctx.font = '800 18px Unbounded, "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.fillText(msg.text, W / 2, T.y + T.h / 2); ctx.globalAlpha = 1; }
  }
  function pos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointerdown', function (e) { if (!shell.running || moving) return; var p = pos(e); aim = { sx: p.x, sy: p.y, x: p.x, y: p.y }; });
  canvas.addEventListener('pointermove', function (e) { if (!aim) return; var p = pos(e); aim.x = p.x; aim.y = p.y; });
  canvas.addEventListener('pointerup', function () {
    if (!aim) return;
    var dx = aim.sx - aim.x, dy = aim.sy - aim.y, len = Math.min(Math.hypot(dx, dy), T.w * 0.5);
    aim = null;
    if (len < 12 || !shell.running || moving) return;
    var a = Math.atan2(dy, dx), sp = (0.15 + 0.85 * len / (T.w * 0.5)) * T.w * 4.2;
    cue.vx = Math.cos(a) * sp; cue.vy = Math.sin(a) * sp; moving = true; shots++; P.haptic('tap');
  });
  canvas.addEventListener('pointercancel', function () { aim = null; });
})();
</script>
</body>
</html>
