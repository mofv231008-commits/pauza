<script>
(function () {
  'use strict';
  var P = window.Pauza;
  /* [утверждение, правда?, пояснение] */
  var F = [
    ['У осьминога три сердца.', 1, 'Да: два качают кровь к жабрам, одно — по телу.'], ['Кровь у осьминога голубая.', 1, 'Да: в ней медь, а не железо.'],
    ['Бананы с точки зрения ботаники — ягоды.', 1, 'Да, это ягоды.'], ['Клубника с точки зрения ботаники — настоящая ягода.', 0, 'Нет, это «ложная ягода».'],
    ['Помидор с точки зрения ботаники — ягода.', 1, 'Да, это ягода.'], ['Арахис — это орех.', 0, 'Нет, это бобовое растение, родня гороху.'],
    ['Мёд может храниться тысячи лет.', 1, 'Да, съедобный мёд находили в древних гробницах.'], ['Акулы появились на Земле раньше деревьев.', 1, 'Да, акулы старше деревьев на десятки миллионов лет.'],
    ['Свет от Солнца идёт до Земли около 8 минут.', 1, 'Да, примерно 8 минут 20 секунд.'], ['Звук распространяется в вакууме.', 0, 'Нет, звуку нужна среда — воздух, вода.'],
    ['В космосе можно услышать взрыв.', 0, 'Нет, там вакуум — звук не идёт.'], ['Венера горячее Меркурия, хотя дальше от Солнца.', 1, 'Да, из-за плотной атмосферы.'],
    ['Венера вращается в обратную сторону по сравнению с большинством планет.', 1, 'Да, у неё обратное вращение.'], ['Сатурн — единственная планета с кольцами.', 0, 'Нет, кольца есть и у Юпитера, Урана, Нептуна.'],
    ['Нептун ближе к Солнцу, чем Уран.', 0, 'Нет, Нептун — самая дальняя планета.'], ['Солнце — это звезда.', 1, 'Да.'],
    ['Земля ближе всего к Солнцу в январе.', 1, 'Да, перигелий — в начале января.'], ['Великую Китайскую стену видно с Луны невооружённым глазом.', 0, 'Нет, это миф.'],
    ['Эверест — самая высокая гора над уровнем моря.', 1, 'Да, 8848 метров.'], ['Байкал — самое глубокое озеро в мире.', 1, 'Да, больше 1600 метров.'],
    ['Байкал — самое большое по площади озеро мира.', 0, 'Нет, по площади больше Каспий.'], ['Россия граничит с Северной Кореей.', 1, 'Да, есть короткая граница.'],
    ['Санкт-Петербург — самый северный город-миллионник мира.', 1, 'Да.'], ['Москва старше Санкт-Петербурга.', 1, 'Да, Москва впервые упоминается в 1147 году.'],
    ['Пётр I основал Москву.', 0, 'Нет, он основал Петербург.'], ['Африка — самый большой материк.', 0, 'Нет, самый большой — Евразия.'],
    ['Австралия — самый большой остров в мире.', 0, 'Нет, Австралия — материк, самый большой остров — Гренландия.'], ['Пингвины живут на Северном полюсе.', 0, 'Нет, почти все пингвины — в Южном полушарии.'],
    ['Пауки — это насекомые.', 0, 'Нет, пауки — паукообразные: у них восемь ног.'], ['Киты — это рыбы.', 0, 'Нет, киты — млекопитающие.'],
    ['Летучие мыши — млекопитающие.', 1, 'Да.'], ['Летучие мыши слепые.', 0, 'Нет, они видят, а ещё ориентируются эхом.'],
    ['Верблюды хранят воду в горбах.', 0, 'Нет, в горбах — жир.'], ['Страусы прячут голову в песок от страха.', 0, 'Нет, это миф.'],
    ['Быков злит красный цвет.', 0, 'Нет, быки плохо различают красный — их злит движение.'], ['Золотая рыбка помнит только 3 секунды.', 0, 'Нет, рыбы помнят месяцами.'],
    ['Хамелеон меняет цвет, только чтобы слиться с фоном.', 0, 'Нет, чаще от настроения и температуры.'], ['Лев — самая крупная кошка.', 0, 'Нет, самая крупная — тигр.'],
    ['У улитки могут быть тысячи зубов.', 1, 'Да, на её «тёрке» тысячи крошечных зубчиков.'], ['Шоколад полезен собакам.', 0, 'Нет, он для собак ядовит.'],
    ['Человек использует только 10% мозга.', 0, 'Нет, это миф: работает весь мозг.'], ['Мозг тратит около пятой части энергии тела.', 1, 'Да, около 20%.'],
    ['Кровь в венах синяя.', 0, 'Нет, она тёмно-красная, синими вены кажутся через кожу.'], ['Волосы и ногти растут после смерти.', 0, 'Нет, просто кожа подсыхает.'],
    ['Молния никогда не бьёт в одно место дважды.', 0, 'Нет, бьёт, особенно в высокие здания.'], ['Высоко в горах вода закипает при меньшей температуре.', 1, 'Да, давление ниже.'],
    ['Чистая вода хорошо проводит ток.', 0, 'Нет, ток проводят примеси в воде.'], ['Алмаз и графит состоят из углерода.', 1, 'Да.'],
    ['Шахматы придумали в Индии.', 1, 'Да, от древней игры чатуранга.'], ['Самая короткая война в истории длилась меньше часа.', 1, 'Да, англо-занзибарская — около 40 минут.'],
    ['Гагарин полетел в космос в 1965 году.', 0, 'Нет, в 1961-м.'], ['Пушкин написал «Войну и мир».', 0, 'Нет, Лев Толстой.'],
    ['Наполеон был очень маленького роста.', 0, 'Нет, около 169 см — обычный рост для того времени.'], ['В году 52 недели и ещё один-два дня.', 1, 'Да.']
  ];
  var order = [], pos = 0;
  PauzaQuiz({
    id: 'truefalse', title: 'Правда или ложь', tagline: 'Факты и мифы вперемешку.',
    rules: '<p>Читай утверждение и решай: правда или ложь. Свайпни карточку влево — ложь, вправо — правда. Или нажми кнопку. Ошибка — минус 3 секунды и пояснение.</p>',
    swipe: true, big: true,
    onReset: function () { order = P.shuffle(F.map(function (_, i) { return i; })); pos = 0; },
    next: function () {
      if (!order.length || pos >= order.length) { order = P.shuffle(F.map(function (_, i) { return i; })); pos = 0; }
      var f = F[order[pos++]];
      return { q: f[0], opts: ['👈 Ложь', 'Правда 👉'], right: f[1] ? 1 : 0, cls: 'long', explain: f[2] };
    }
  });
})();
</script>
