<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Стены</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>.stage{background:#140734}</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="game" aria-label="Стены. Нажимай, чтобы перепрыгнуть на другую стену"></canvas></div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['метр', 'метра', 'метров'], TOP = 70, JUMP = 0.28;
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var ww = 24, sz = 26, Y0 = 0, side = 0, jump = null, spikes = [], saws = [], dist = 0, t = 0, lastSide = 1, dead = false, parts = [];

  var shell = P.shell({
    id: 'walls', title: 'Стены', tagline: 'Прыгай со стены на стену мимо шипов.',
    rulesHtml: '<p>Ты карабкаешься вверх между двумя стенами. Сверху на стенах появляются шипы — нажми, и ты перепрыгнешь на другую стену. Позже в проходе между стенами закружатся пилы: в прыжке их надо пропускать. Забирайся как можно выше.</p>',
    startLabel: 'Лезть', countdown: true, overEyebrow: 'Сорвался',
    unit: function (n) { return P.plural(n, U); },
    kbdHint: 'На компьютере: пробел или стрелки, P — пауза',
    pauseKeys: ['KeyP', 'Escape'],
    onReset: reset
  });
  var view = P.canvas(canvas, stage, function () { ww = Math.max(18, view.W * 0.07); sz = Math.min(view.W, view.H) * 0.075; Y0 = TOP + (view.H - TOP) * 0.72; });
  function PH() { return view.H - TOP; }
  function xOf(s) { return s === 0 ? ww + sz / 2 : view.W - ww - sz / 2; }
  function speed() { return PH() * (0.42 + Math.min(0.45, t * 0.008)); }
  function reset() { side = 0; jump = null; spikes = []; saws = []; dist = 0; t = 0; lastSide = 1; dead = false; parts = []; shell.setScore('0'); }
  function meters() { return Math.floor(dist / (PH() * 0.06)); }
  function spawn() {
    var top = spikes.length ? Math.min.apply(null, spikes.map(function (s) { return s.y; })) : TOP + PH() * 0.3;
    var withSaw = t > 12 && Math.random() < Math.min(0.5, 0.15 + t * 0.006);
    var gap = speed() * (JUMP + 0.35 + (withSaw ? JUMP * 2.5 : 0)) + Math.random() * PH() * 0.25;
    if (top - gap < TOP - 10) return;
    var s = Math.random() < 0.65 ? 1 - lastSide : lastSide, h = PH() * (0.12 + Math.random() * 0.22);
    lastSide = s;
    spikes.push({ side: s, y: top - gap - h, h: h });
    if (withSaw) saws.push({ x: view.W / 2 + (Math.random() - 0.5) * (view.W - 2 * ww - sz * 3), y: top - gap / 2, r: sz * 0.45, a: 0 });
  }
  function px() { if (!jump) return { x: xOf(side), y: Y0 }; var k = jump.t / JUMP; return { x: xOf(jump.from) + (xOf(jump.to) - xOf(jump.from)) * k, y: Y0 - Math.sin(k * Math.PI) * sz * 1.4 }; }
  function hop() { if (!shell.running || dead || jump) return; jump = { from: side, to: 1 - side, t: 0 }; P.haptic('tap'); }
  function die() {
    dead = true; P.haptic('crash');
    var p = px(); for (var i = 0; i < 20; i++) { var a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160; parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.8 }); }
    var m = meters();
    shell.end({ score: m, delay: 800, phrase: 'В «Стенах» я забираюсь на ' + m + ' ' + P.plural(m, U) + '. Выше сможешь?' });
  }
  P.loop(function (dt) {
    if (!Y0) return;
    if (shell.running && !dead) {
      t += dt;
      var v = speed(); dist += v * dt;
      spikes.forEach(function (s) { s.y += v * dt; }); saws.forEach(function (s) { s.y += v * dt; s.a += dt * 8; });
      spikes = spikes.filter(function (s) { return s.y < view.H + 10; }); saws = saws.filter(function (s) { return s.y - s.r < view.H; });
      spawn();
      if (jump) { jump.t += dt; if (jump.t >= JUMP) { side = jump.to; jump = null; } }
      var p = px(), half = sz * 0.42;
      if (!jump || jump.t < 0.04 || jump.t > JUMP - 0.04) {
        var s0 = jump ? (jump.t < 0.04 ? jump.from : jump.to) : side;
        spikes.forEach(function (s) { if (!dead && s.side === s0 && s.y < p.y + half && s.y + s.h > p.y - half) die(); });
      }
      saws.forEach(function (s) { if (!dead && Math.hypot(s.x - p.x, s.y - p.y) < s.r + half * 0.9) die(); });
      shell.setScore(String(meters()));
    }
    parts.forEach(function (q) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 300 * dt; q.life -= dt; });
    parts = parts.filter(function (q) { return q.life > 0; });
    draw();
  });
  function draw() {
    var ctx = view.ctx, W = view.W, H = view.H;
    ctx.fillStyle = '#140734'; ctx.fillRect(0, 0, W, H);
    if (!Y0) return;
    var bh = 22, off = dist % (bh * 2);
    [0, W - ww].forEach(function (x0) {
      ctx.fillStyle = '#3B1E8C'; ctx.fillRect(x0, 0, ww, H);
      ctx.fillStyle = '#2E177A';
      for (var y = -bh * 2 + off; y < H; y += bh) { ctx.fillRect(x0, y, ww, 2); var mid = (Math.round((y - off) / bh) % 2) ? ww / 2 : ww / 4; ctx.fillRect(x0 + mid, y, 2, bh); }
    });
    spikes.forEach(function (s) {
      var x0 = s.side === 0 ? ww : W - ww, dir = s.side === 0 ? 1 : -1, n = Math.max(2, Math.round(s.h / 14)), step = s.h / n;
      ctx.fillStyle = '#FF6B4A'; ctx.beginPath();
      for (var i = 0; i < n; i++) { ctx.moveTo(x0, s.y + i * step); ctx.lineTo(x0 + dir * sz * 0.55, s.y + (i + 0.5) * step); ctx.lineTo(x0, s.y + (i + 1) * step); }
      ctx.fill();
    });
    saws.forEach(function (s) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a); ctx.fillStyle = '#B9A8F0'; ctx.beginPath();
      for (var i = 0; i < 16; i++) { var a = i * Math.PI / 8, r = i % 2 ? s.r * 0.75 : s.r; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill(); ctx.fillStyle = '#22105A'; ctx.beginPath(); ctx.arc(0, 0, s.r * 0.25, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    });
    if (!dead) {
      var p = px(), r = sz / 2, face = jump ? (jump.to === 0 ? -1 : 1) : (side === 0 ? 1 : -1);
      ctx.fillStyle = P.gold() ? '#FFD84D' : '#3DF5B0'; ctx.beginPath(); ctx.roundRect(p.x - r, p.y - r, sz, sz, sz * 0.25); ctx.fill();
      ctx.fillStyle = '#120630'; ctx.fillRect(p.x - r, p.y - r * 0.35, sz, r * 0.5);
      ctx.fillStyle = '#F4F1FF'; ctx.fillRect(p.x + face * r * 0.15 - 3, p.y - r * 0.25, 6, 6); ctx.fillRect(p.x + face * r * 0.55 - 3, p.y - r * 0.25, 6, 6);
      ctx.fillStyle = '#FF6B4A'; ctx.fillRect(p.x - face * r - (face > 0 ? 8 : -2), p.y - r * 0.3, 8, 4);
    }
    parts.forEach(function (q) { ctx.globalAlpha = Math.min(1, q.life * 2); ctx.fillStyle = '#3DF5B0'; ctx.fillRect(q.x - 2, q.y - 2, 4, 4); });
    ctx.globalAlpha = 1;
  }
  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); hop(); });
  window.addEventListener('keydown', function (e) { if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'Enter'].indexOf(e.code) !== -1) { e.preventDefault(); if (!e.repeat) hop(); } });
})();
</script>
</body>
</html>
