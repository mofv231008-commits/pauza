<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Спам-атака</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>
.stage{background:#0E0526}
.sa-layer{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;gap:12px;padding:76px 16px 20px;overflow-y:auto;background:linear-gradient(180deg,rgba(14,5,38,.9),rgba(14,5,38,.98));touch-action:pan-y}
.sa-layer[hidden],.sa-talk[hidden],.sa-ban[hidden]{display:none}
.sa-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sa-h{margin:0;font-family:var(--font-display);font-weight:800;font-size:22px}
.sa-h3{margin:8px 0 0;font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--lilac);letter-spacing:.04em}
.sa-likes{font-family:var(--font-display);font-weight:600;font-size:15px;background:rgba(61,245,176,.12);color:var(--mint);padding:7px 12px;border-radius:999px;white-space:nowrap}
.sa-ch{display:grid;gap:8px}
.sa-ch button,.sa-up button{appearance:none;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid rgba(185,168,240,.22);background:var(--shoulder);color:var(--paper);border-radius:16px;padding:11px 13px;font:inherit;cursor:pointer;touch-action:manipulation}
.sa-ch button.next{border-color:var(--mint);box-shadow:inset 0 0 0 1px var(--mint)}
.sa-ch button:disabled{opacity:.42;cursor:default}
.sa-num{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;background:var(--road);flex:none}
.next .sa-num{background:var(--mint);color:var(--ink)}
.sa-t{font-family:var(--font-display);font-weight:600;font-size:15px}
.sa-d{font-size:12.5px;color:var(--lilac);line-height:1.3}
.sa-st{margin-left:auto;color:var(--sun);letter-spacing:1px;flex:none;font-size:15px}
.sa-endless .sa-num{background:linear-gradient(135deg,#FF8AD8,#6FD3FF);color:var(--ink)}
.sa-up{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sa-up button{flex-direction:column;align-items:flex-start;gap:3px;padding:10px 12px}
.sa-up button:disabled{opacity:.55;cursor:default}
.sa-up b{font-family:var(--font-display);font-weight:600;font-size:13px}
.sa-dots{display:flex;gap:4px}.sa-dots i{width:14px;height:5px;border-radius:3px;background:rgba(185,168,240,.25)}.sa-dots i.on{background:var(--mint)}
.sa-cost{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--sun);margin-top:2px}
.sa-talk{position:absolute;left:10px;right:10px;bottom:14px;z-index:4;display:flex;gap:12px;align-items:flex-start;padding:14px 14px 12px;border-radius:20px;background:rgba(20,7,52,.95);border:1px solid rgba(185,168,240,.3);box-shadow:0 12px 40px rgba(0,0,0,.55);cursor:pointer;touch-action:manipulation}
.sa-ava{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:27px;font-family:var(--font-display);font-weight:800;flex:none}
.sa-ava i{display:block;width:8px;height:24px;border-radius:4px;background:var(--ink)}
.sa-name{font-family:var(--font-display);font-weight:600;font-size:12.5px;letter-spacing:.04em;margin-bottom:3px}
.sa-text{font-size:16px;line-height:1.38;min-height:44px}
.sa-next{font-size:12px;color:var(--lilac);margin-top:5px}
.sa-skip{position:absolute;top:-40px;right:2px;appearance:none;border:1px solid rgba(185,168,240,.3);background:rgba(20,7,52,.85);color:var(--lilac);border-radius:12px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.sa-ban{position:absolute;right:16px;bottom:22px;z-index:4;width:70px;height:70px;border-radius:50%;border:0;padding:5px;cursor:pointer;touch-action:manipulation;background:rgba(255,255,255,.12)}
.sa-ban span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#1A0C44;color:var(--lilac);font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:.04em}
.sa-ban.ready span{background:var(--sun);color:var(--ink)}
.sa-ban.ready{animation:saPulse .8s ease-in-out infinite alternate}
@keyframes saPulse{to{transform:scale(1.08)}}
.stage[data-state="paused"] .sa-ban,.stage[data-state="over"] .sa-ban,.stage[data-state="start"] .sa-ban{display:none}
@media (prefers-reduced-motion:reduce){.sa-ban.ready{animation:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
<canvas id="game" aria-label="Спам-атака. Веди пальцем — дрон летит за ним и стреляет сам"></canvas>
<div class="sa-layer" id="menu" hidden></div>
<div class="sa-talk" id="talk" hidden><button class="sa-skip" type="button" id="skip">Пропустить ›</button><div class="sa-ava"></div><div><div class="sa-name"></div><div class="sa-text"></div><div class="sa-next">нажми, чтобы продолжить</div></div></div>
<button class="sa-ban" id="ban" type="button" hidden aria-label="Бан-хаммер"><span>БАН</span></button>
</div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['очко', 'очка', 'очков'], SAVE = 'pz_spam_save';
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');

  var TAU = Math.PI * 2;

  /* ---------- Кто говорит ---------- */
  var WHO = {
    mint: { n: 'Мята · модератор', c: '#3DF5B0', a: 'М', bg: 'linear-gradient(135deg,#3DF5B0,#1FA67A)', fg: '#120630' },

    katya: { n: 'Катя', c: '#FF8AD8', a: 'К', bg: 'linear-gradient(135deg,#FF9A6B,#FF8AD8)', fg: '#fff' },
    casino: { n: 'Казино-бот', c: '#FFD84D', a: '🎰', bg: '#3B1E8C' },
    mass: { n: 'Рассылка', c: '#FF9A6B', a: '📢', bg: '#3B1E8C' },
    troll: { n: 'Тролль', c: '#9BE15D', a: '🤪', bg: '#3B1E8C' },
    popup: { n: 'Всплывашка', c: '#FF6B4A', a: '🎁', bg: '#3B1E8C' },
    ignor: { n: 'Игнор', c: '#C9C3D9', a: '👁️', bg: '#2A2638' }
  };

  /* ---------- Главы ---------- */
  var CH = [null,
    { n: 'Входящие', d: 'Спам-письма и кликбейт', boss: 'casino', bg: ['#170A3E', '#2A1170'], bub: '#3B1E8C', len: 64, mid: 32,
      waves: [[1, 'mail', 'row', 5], [5, 'mail', 'left', 6], [9, 'mail', 'right', 6], [13, 'click', 'row', 3], [18, 'mail', 'vee', 7], [23, 'click', 'rand', 4],
        [27, 'mail', 'left', 7], [27.6, 'mail', 'right', 7], [33, 'click', 'row', 4], [38, 'mail', 'rand', 10], [44, 'click', 'vee', 5], [49, 'mail', 'row', 6],
        [50, 'click', 'pair', 2], [54, 'mail', 'left', 8], [57, 'mail', 'right', 8], [59, 'click', 'row', 5]] },
    { n: 'Групповой чат', d: 'Стикеры, голосовые и флуд', boss: 'mass', bg: ['#0B1A4A', '#14347A'], bub: '#1F3F8C', len: 66, mid: 34,
      waves: [[1, 'sticker', 'rand', 4], [5, 'flood', 'left', 10], [8, 'flood', 'right', 10], [12, 'voice', 'pair', 2], [17, 'sticker', 'rand', 6], [21, 'mail', 'vee', 7],
        [25, 'voice', 'row', 3], [30, 'flood', 'left', 12], [30.5, 'flood', 'right', 12], [36, 'sticker', 'rand', 7], [41, 'voice', 'pair', 2], [42, 'click', 'row', 3],
        [47, 'flood', 'left', 14], [52, 'sticker', 'rand', 8], [56, 'voice', 'row', 3], [58, 'flood', 'right', 14]] },
    { n: 'Комментарии', d: 'Тролли и КАПСЛОК', boss: 'troll', bg: ['#2A0B3E', '#4A1260'], bub: '#5A1E7C', len: 66, mid: 33,
      waves: [[1, 'troll', 'pair', 2], [5, 'caps', 'rand', 3], [9, 'troll', 'row', 3], [13, 'flood', 'left', 10], [16, 'caps', 'row', 3], [20, 'troll', 'rand', 4],
        [25, 'sticker', 'rand', 5], [28, 'caps', 'pair', 2], [32, 'troll', 'row', 4], [37, 'flood', 'right', 12], [40, 'caps', 'rand', 4], [44, 'troll', 'vee', 5],
        [49, 'click', 'row', 4], [52, 'caps', 'row', 3], [55, 'troll', 'rand', 5], [59, 'flood', 'left', 12]] },
    { n: 'Ночной режим', d: 'Уведомления в темноте', boss: 'popup', bg: ['#06030F', '#100728'], bub: '#1A1236', night: true, len: 66, mid: 33,
      waves: [[1, 'bell', 'rand', 4], [5, 'mail', 'row', 6], [9, 'banner', 'pair', 2], [14, 'bell', 'rand', 6], [18, 'flood', 'left', 10], [22, 'banner', 'row', 3],
        [27, 'bell', 'sides', 7], [31, 'voice', 'pair', 2], [35, 'bell', 'rand', 8], [40, 'banner', 'pair', 2], [41, 'flood', 'right', 12], [46, 'bell', 'sides', 8],
        [50, 'caps', 'rand', 3], [53, 'banner', 'row', 3], [57, 'bell', 'rand', 9]] },
    { n: 'Игнор', d: 'Финал. Прочитано без ответа', boss: 'ignor', bg: ['#1C1B22', '#2C2A35'], bub: '#3A3846', grey: true, len: 66, mid: 33,
      waves: [[1, 'seen', 'row', 5], [5, 'ghost', 'rand', 4], [9, 'seen', 'vee', 7], [13, 'ghost', 'rand', 5], [17, 'seen', 'left', 8], [17.5, 'seen', 'right', 8],
        [23, 'bell', 'rand', 5], [27, 'ghost', 'row', 4], [31, 'seen', 'row', 6], [35, 'troll', 'pair', 2], [38, 'ghost', 'rand', 6], [42, 'seen', 'vee', 9],
        [47, 'banner', 'pair', 2], [50, 'ghost', 'rand', 7], [54, 'seen', 'left', 10], [56, 'seen', 'right', 10]] }
  ];

  /* ---------- Диалоги ---------- */
  var TALK = {
    1: { intro: [['mint', 'Тревога! В «Паузу» лезут спам-боты. Входящие забиты под завязку.'], ['pix', 'Антиспам-дрон Пиксель на связи. Наведу порядок!'],
      ['mint', 'Веди пальцем по экрану — ты летишь за ним и стреляешь сам.'], ['mint', 'Сбитые боты роняют лайки 👍. На них прокачаешься в мастерской.'],
      ['mint', 'Когда зарядится Бан-хаммер — жми жёлтую кнопку справа внизу. Банит всех на экране.']],
      mid: [['mint', 'Странно. Спам летит строем, будто им кто-то командует…']],
      boss: [['casino', 'ПОЗДРАВЛЯЕМ! Вы выиграли… ПОРАЖЕНИЕ! 🎰'], ['casino', 'Крутим барабан! Три семёрки — и тебе конец!'], ['mint', 'Следи за полосами на экране: загорятся — уходи в сторону.']],
      win: [['casino', 'Ставки… сделаны… дзынь.'], ['mint', 'Джекпот наш! Но сигнал спама идёт дальше — из группового чата.'], ['pix', 'Лечу!']] },
    2: { intro: [['mint', 'Групповой чат «Одногруппники». 999+ непрочитанных.'], ['pix', 'Кто-то записал голосовое на семь минут…'], ['mint', 'Голосовые бьют кольцами. Ищи щель между пулями.']],
      mid: [['pix', 'Флуд! Их тут сотни!']],
      boss: [['mass', 'ПЕРЕШЛИ ЭТО ДЕСЯТИ ДРУЗЬЯМ, ИНАЧЕ…'], ['pix', 'Иначе что?'], ['mass', 'ИНАЧЕ Я ПЕРЕШЛЮ СЕБЯ САМА!']],
      split: [['mass', 'Нас стало больше! Перешлите нас!']],
      win: [['mass', 'Рассылка… отменена…'], ['mint', 'В рассылке была подпись: «по заданию И.». Кто такой этот «И»?']] },
    3: { intro: [['mint', 'Комментарии под постом. Здесь живут тролли.'], ['pix', 'Главное правило — не кормить.'], ['mint', 'КАПСЛОК крепкий. Обходи или бань.']],
      mid: [['mint', 'Тролли уворачиваются. Стреляй на опережение!']],
      boss: [['troll', 'Ты вообще кто такой? 😂'], ['troll', 'Попади сначала. Спорим, не попадёшь?'], ['mint', 'Когда он светится зелёным — уйди в сторону: он отражает пули обратно!']],
      win: [['troll', 'Ладно-ладно… Игнор обещал мне бесконечный онлайн…'], ['mint', 'Игнор. Вот кто за всем этим стоит.'], ['pix', 'Где его найти?'],
        ['mint', 'Там, где сообщения читают и не отвечают. Сначала — через ночной режим.']] },
    4: { intro: [['mint', 'Три часа ночи. Уведомления не спят.'], ['mint', 'Включаю фонарь — видно только рядом с тобой.'], ['pix', 'Как-то жутковато…']],
      mid: [['pix', 'Опять реклама! Кто вообще жмёт на эти баннеры?']],
      boss: [['popup', 'ВЫ ВЫИГРАЛИ ПРИЗ! 🎁'], ['popup', 'Закройте окно… если найдёте крестик!'], ['mint', 'Пока открыты окна, она под защитой. Закрывай их по одному!']],
      win: [['popup', 'Вы… отписались… от рассылки…'], ['mint', 'Окна закрыты. Сигнал Игнора идёт из чата Кати.'], ['pix', 'Той самой, что написала «щас, 5 сек» и пропала?']] },
    5: { intro: [['katya', '…'], ['mint', 'Игнор заморозил её чат. Пока он жив, все сообщения — «прочитано» без ответа.'], ['ignor', 'Прочитано. Без ответа. Навсегда.'], ['pix', 'Не сегодня.']],
      mid: [['ignor', 'Был(а) недавно…']],
      boss: [['ignor', 'Ты думал, тебе ответят?'], ['ignor', 'Я — тишина после «ау». Я — две серые галочки.'], ['mint', 'Сначала сбей «прочитано» вокруг него. Потом бей в глаз!']],
      phase2: [['ignor', 'Ты меня не видишь… но я печатаю…'], ['mint', 'Бей, когда появляется «печатает…»!']],
      phase3: [['ignor', 'НЕ ИГНОРИРУЙ МЕНЯ!']],

        ['pix', 'Пока ждёшь ответ — ставь рекорд!'], ['mint', 'Конец истории. Но спам бесконечен: режим «Бесконечный спам» ждёт тебя на карте.']] }
  };

  /* ---------- Прокачка ---------- */
  var UPS = [
    { id: 'fire', n: 'Скорострельность', d: 'Стреляешь чаще', cost: [20, 45, 80, 130, 200] },
    { id: 'spread', n: 'Веер', d: 'Больше потоков', cost: [40, 100, 180] },
    { id: 'shield', n: 'Броня', d: '+1 жизнь', cost: [30, 80, 150] },
    { id: 'ban', n: 'Бан-хаммер', d: 'Быстрее заряд, сильнее удар', cost: [30, 70, 130] },
    { id: 'magnet', n: 'Магнит', d: 'Лайки летят к тебе', cost: [15, 40] }
  ];
  var sv = fix(P.store.get(SAVE, null));
  function fix(s) {
    s = s || {};
    var up = { fire: 0, spread: 0, shield: 0, ban: 0, magnet: 0 };
    if (s.up) for (var k in up) up[k] = s.up[k] | 0;
    return { unlocked: s.unlocked || 1, stars: s.stars || {}, best: s.best || {}, likes: s.likes | 0, up: up, done: !!s.done, ts: s.ts || 0 };
  }
  function save() {
    sv.ts = Date.now(); P.store.set(SAVE, sv);
    try { P.cloud.set('spam', JSON.stringify(sv)).catch(function () {}); } catch (e) {}
  }
  try {
    P.cloud.get(['spam']).then(function (r) {
      var raw = r && (r.spam || (r.values && r.values.spam));
      var c = raw ? JSON.parse(raw) : null;
      if (c && (c.ts || 0) > sv.ts) { sv = fix(c); P.store.set(SAVE, sv); if (mode === 'menu') renderMenu(); }

  } catch (e) {}

  /* ---------- Состояние ---------- */
  var S = 1, W = 390, H = 760, t = 0;
  var mode = 'off', ch = 1, C = null, ct = 0, wi = 0, titleT = 0, modeT = 0, hpMul = 1, nextMini = 70, spawnT = 0;
  var pl = { x: 0, y: 0, tx: 0, ty: 0, hp: 3, inv: 0, fireT: 0, power: 0 }, drag = null, keys = {};

  var shell = P.shell({

    unit: function (n) { return P.plural(n, U); },
    kbdHint: 'На компьютере: стрелки — полёт, пробел — Бан-хаммер, Enter — дальше, P — пауза',
    pauseKeys: ['KeyP', 'Escape'],
    onReset: showMenu
  });
  Array.prototype.forEach.call(stage.querySelectorAll('.overlay .btn-primary'), function (b) { if (b.textContent === 'Ещё раз') b.textContent = 'К карте'; });
  var view = P.canvas(canvas, stage, layout);
  var ctx = view.ctx;
  function layout() {
    W = view.W; H = view.H; S = P.clamp(W / 390, 0.78, 1.25);
    if (!pl.x) { pl.x = W / 2; pl.y = H * 0.8; }
    pl.x = P.clamp(pl.x, 16, W - 16); pl.y = P.clamp(pl.y, 90, H - 30); pl.tx = pl.x; pl.ty = pl.y;

  }
  function newBub(y) { var left = Math.random() < 0.5; return { y: y, w: (60 + Math.random() * 130) * S, h: (18 + Math.random() * 16) * S, left: left, l: 1 + (Math.random() * 2 | 0) }; }

  /* ---------- Меню: карта чатов и мастерская ---------- */
  function stars(n) { var s = ''; for (var i = 0; i < 3; i++) s += i < n ? '★' : '☆'; return s; }
  function showMenu() {
    mode = 'menu'; clearWorld(); banBtn.hidden = true; talkEl.hidden = true; menuEl.hidden = false; menuEl.scrollTop = 0;

  }
  function renderMenu() {
    var nextCh = Math.min(5, sv.unlocked), h = '';

    for (var n = 1; n <= 5; n++) {
      var locked = n > sv.unlocked;
      h += '<button type="button" data-ch="' + n + '"' + (locked ? ' disabled' : '') + ' class="' + (n === nextCh && !sv.done ? 'next' : '') + '"><span class="sa-num">' + (locked ? '🔒' : n) + '</span><span><span class="sa-t">' + CH[n].n +
        '</span><br><span class="sa-d">' + (locked ? 'Сначала пройди главу ' + (n - 1) : CH[n].d + (sv.best[n] ? ' · рекорд ' + P.fmt(sv.best[n]) : '')) + '</span></span><span class="sa-st">' + (locked ? '' : stars(sv.stars[n] || 0)) + '</span></button>';
