<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Ханойская башня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>.stage{background:#140734}</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="game" aria-label="Ханойская башня. Нажми на стержень, чтобы взять диск, и на другой, чтобы положить"></canvas></div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['башня', 'башни', 'башен'], TOP = 70;
  var DC = ['#FF6B4A', '#FF9A6B', '#FFD84D', '#3DF5B0', '#6FD3FF', '#B9A8F0', '#FF8AD8'];
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var pegs = [[], [], []], n = 3, held = -1, moves = 0, solved = 0, total = 0, optimal = 0, phase = 'play', phaseT = 0, shake = 0, lift = 0;

  var shell = P.shell({
    id: 'hanoi', title: 'Ханойская башня', tagline: 'Перенеси башню, не кладя большой диск на маленький.',
    rulesHtml: '<p>Перенеси всю башню с левого стержня на любой другой. Нажми на стержень — возьмёшь верхний диск, нажми на другой — положишь. Класть больший диск на меньший нельзя. С каждой башней дисков больше. Две минуты.</p>',
    startLabel: 'Начать', countdown: false, overEyebrow: 'Время вышло',
    unit: function (n) { return P.plural(n, U); },
    kbdHint: 'На компьютере: клавиши 1, 2, 3',
    onReset: reset
  });
  var timer = P.timeLimit(shell, 120, finish);
  var view = P.canvas(canvas, stage, function () {});
  function setup() { n = Math.min(7, 3 + solved); pegs = [[], [], []]; for (var i = n; i >= 1; i--) pegs[0].push(i); held = -1; moves = 0; optimal = Math.pow(2, n) - 1; phase = 'play'; }
  function reset() { solved = 0; total = 0; setup(); shell.setScore('0'); timer.reset(); }
  function finish() { phase = 'over'; shell.end({ score: solved, delay: 300, stats: 'ходов всего: ' + (total + moves), phrase: 'В «Ханойской башне» я переношу ' + solved + ' ' + P.plural(solved, U) + ' за две минуты.' }); }
  function pick(k) {
    if (!shell.running || phase !== 'play') return;
    if (held === -1) { if (pegs[k].length) { held = k; lift = 0; P.haptic('tap'); } return; }
    if (held === k) { held = -1; return; }
    var d = pegs[held][pegs[held].length - 1], top = pegs[k][pegs[k].length - 1];
    if (top && top < d) { shake = 0.3; P.haptic('crash'); held = -1; return; }
    pegs[k].push(pegs[held].pop()); held = -1; moves++; P.haptic('tap');
    if (pegs[1].length === n || pegs[2].length === n) { solved++; total += moves; shell.setScore(String(solved)); P.haptic('win'); phase = 'won'; phaseT = 1.2; }
  }
  P.loop(function (dt) {
    if (shake > 0) shake -= dt;
    lift = Math.min(1, lift + dt * 10);
    if (phase === 'won' && shell.running) { phaseT -= dt; if (phaseT <= 0) setup(); }
    draw();
  });
  function geo() {
    var W = view.W, H = view.H, base = H - Math.max(60, H * 0.14), colW = W / 3, maxW = colW * 0.92, dh = Math.min(28, (base - TOP - 140) / 8);
    return { base: base, colW: colW, maxW: maxW, dh: dh };
  }
  function draw() {
    var ctx = view.ctx, W = view.W, H = view.H, g = geo();
    ctx.fillStyle = '#140734'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#3B1E8C'; ctx.beginPath(); ctx.roundRect(8, g.base, W - 16, 14, 7); ctx.fill();
    var poleH = g.dh * (n + 1.5);
    for (var k = 0; k < 3; k++) {
      var cx = g.colW * (k + 0.5) + (shake > 0 && held === -1 ? Math.sin(shake * 60) * 3 : 0);
      ctx.fillStyle = k === 0 ? '#5A3FB0' : '#7B5CD6'; ctx.beginPath(); ctx.roundRect(cx - 4, g.base - poleH, 8, poleH, 4); ctx.fill();
      pegs[k].forEach(function (d, j) {
        var isHeld = held === k && j === pegs[k].length - 1, w = g.maxW * (0.3 + 0.7 * d / n), y = g.base - (j + 1) * g.dh;
        if (isHeld) y = y + (g.base - poleH - g.dh * 1.6 - y) * lift;
        ctx.fillStyle = DC[(d - 1) % DC.length]; ctx.beginPath(); ctx.roundRect(cx - w / 2, y + 1, w, g.dh - 2, (g.dh - 2) / 2); ctx.fill();
        if (isHeld) { ctx.strokeStyle = '#F4F1FF'; ctx.lineWidth = 2; ctx.stroke(); }
      });
      ctx.fillStyle = 'rgba(244,241,255,.5)'; ctx.font = '600 13px Onest, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(String(k + 1), cx, g.base + 34);
    }
    ctx.fillStyle = 'rgba(244,241,255,.75)'; ctx.font = '600 14px Onest, system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(phase === 'won' ? 'Башня перенесена!' : 'Дисков: ' + n + ' · ходов ' + moves + ' · минимум ' + optimal, W / 2, TOP + 28);
  }
  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); var r = canvas.getBoundingClientRect(); pick(P.clamp(Math.floor((e.clientX - r.left) / (r.width / 3)), 0, 2)); });
  window.addEventListener('keydown', function (e) { var m = /^(?:Digit|Numpad)([1-3])$/.exec(e.code); if (m) pick(Number(m[1]) - 1); });
  setup();
})();
</script>
</body>
</html>
