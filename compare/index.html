<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Больше-меньше</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=4">
<style>
.stage{background:var(--shoulder)}
.play{gap:18px}
.sub{margin:0;color:var(--lilac);font-size:15px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;width:min(100%,380px)}
.pair button{min-height:120px;border:0;border-radius:20px;background:var(--road);color:var(--paper);font-family:var(--font-display);font-weight:800;font-size:clamp(20px,6vw,28px);cursor:pointer;touch-action:manipulation;padding:8px}
.pair .eq{min-height:64px;min-width:56px;font-size:24px;background:#2E177A;color:var(--lilac)}
.pair button.right{background:var(--mint);color:var(--ink)}
.pair button.wrong{background:var(--coral);color:var(--ink)}
.res{margin:0;min-height:1.4em;color:var(--lilac);font-size:15px}
.stage[data-state="paused"] .pair,.stage[data-state="countdown"] .pair{visibility:hidden}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="play">
    <div class="timebar" id="timebar"><i></i></div>
    <p class="sub">Что больше? Если поровну — жми «=»</p>
    <div class="pair"><button type="button" id="a">7 + 8</button><button type="button" class="eq" id="eq">=</button><button type="button" id="b">3 × 5</button></div>
    <p class="res" id="res"></p>
  </div>
</div>
<script src="../shared/pauza.js?v=4"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['ответ', 'ответа', 'ответов'];
  var A = document.getElementById('a'), B = document.getElementById('b'), EQ = document.getElementById('eq'), res = document.getElementById('res');
  var cur, score, wrong, busy;

  var shell = P.shell({
    id: 'compare', title: 'Больше-меньше', tagline: 'Посчитай в уме и выбери большее.',
    rulesHtml: '<p>Два примера — нажми на тот, чей ответ больше. Если ответы равны, жми «=» посередине. Ошибка отнимает 3 секунды. Примеры постепенно усложняются. Минута.</p>',
    startLabel: 'Считать', countdown: true, overEyebrow: 'Время вышло',
    unit: function (n) { return P.plural(n, U); },
    kbdHint: 'На компьютере: стрелки влево и вправо, вниз — «=»',
    onReset: reset
  });
  var timer = P.timeLimit(shell, 60, finish, document.getElementById('timebar'));
  function r(a, b) { return a + P.rand(b - a + 1); }
  function expr() {
    var lv = Math.min(4, Math.floor(score / 5)), k = P.rand(lv >= 2 ? 4 : lv >= 1 ? 3 : 2), a, b;
    if (k === 0) { a = r(2, 20 + lv * 15); b = r(2, 20 + lv * 15); return { t: a + ' + ' + b, v: a + b }; }
    if (k === 1) { a = r(10, 30 + lv * 15); b = r(2, a - 1); return { t: a + ' − ' + b, v: a - b }; }
    if (k === 2) { a = r(2, 9 + lv); b = r(2, 9); return { t: a + ' × ' + b, v: a * b }; }
    b = r(2, 9); a = b * r(2, 9 + lv); return { t: a + ' : ' + b, v: a / b };
  }
  function next() {
    var e1 = expr(), e2, tries = 0, eq = Math.random() < 0.15, span = Math.max(2, 8 - Math.floor(score / 4));
    do { e2 = expr(); tries++; } while (tries < 300 && (e2.t === e1.t || (eq ? e2.v !== e1.v : (e2.v === e1.v || Math.abs(e2.v - e1.v) > span))));
    cur = Math.random() < 0.5 ? [e1, e2] : [e2, e1];
    A.textContent = cur[0].t; B.textContent = cur[1].t; [A, B, EQ].forEach(function (x) { x.className = x === EQ ? 'eq' : ''; });
    busy = false;
  }
  function pick(w) {
    if (!shell.running || busy) return;
    busy = true;
    var d = cur[0].v - cur[1].v, ok = w === 0 ? d > 0 : w === 1 ? d < 0 : d === 0, el = [A, B, EQ][w], good = d > 0 ? A : d < 0 ? B : EQ;
    res.textContent = cur[0].t + ' = ' + cur[0].v + ', ' + cur[1].t + ' = ' + cur[1].v;
    if (ok) { score++; shell.setScore(String(score)); P.haptic('coin'); el.classList.add('right'); }
    else { wrong++; timer.add(-3); P.haptic('crash'); el.classList.add('wrong'); good.classList.add('right'); }
    setTimeout(function () { if (shell.running) next(); }, ok ? 220 : 650);
  }
  function reset() { score = 0; wrong = 0; res.textContent = ''; shell.setScore('0'); timer.reset(); next(); }
  function finish() { busy = true; shell.end({ score: score, delay: 300, stats: 'ошибок: ' + wrong, phrase: 'В «Больше-меньше» у меня ' + score + ' ' + P.plural(score, U) + ' за минуту. Посчитаешь быстрее?' }); }
  A.addEventListener('click', function () { pick(0); }); B.addEventListener('click', function () { pick(1); }); EQ.addEventListener('click', function () { pick(2); });
  P.arrows(function (d) { if (d === 'left') pick(0); if (d === 'right') pick(1); if (d === 'down') pick(2); });
  score = 0; next(); timer.show();
})();
</script>
</body>
</html>
