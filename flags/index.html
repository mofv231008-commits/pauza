<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Флаги</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=4">
<style>
.stage{background:var(--shoulder)}
.play{gap:18px}
.sub{margin:0;color:var(--lilac);font-size:15px;text-align:center;max-width:340px}
.q{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(24px,7.5vw,34px);text-align:center;line-height:1.2;max-width:360px}
.opts{display:grid;gap:10px;width:min(100%,360px)}
.opts.two{grid-template-columns:1fr 1fr}
.opts button{min-height:56px;border:0;border-radius:16px;background:var(--road);color:var(--paper);font-family:var(--font-display);font-weight:600;font-size:17px;cursor:pointer;touch-action:manipulation;padding:8px 12px;line-height:1.25}
.opts button.right{background:var(--mint);color:var(--ink)}
.opts button.wrong{background:var(--coral);color:var(--ink)}
.note{margin:0;min-height:1.3em;color:var(--sun);font-size:14px;text-align:center;max-width:340px}
.stage[data-state="paused"] .opts,.stage[data-state="countdown"] .opts,.stage[data-state="paused"] .q,.stage[data-state="countdown"] .q{visibility:hidden}
.q svg{display:block;width:min(70vw,32vh,260px);height:auto;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="play">
    <div class="timebar" id="timebar"><i></i></div>
    <p class="sub" id="sub">Чей это флаг?</p>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <p class="note" id="note"></p>
  </div>
</div>
<script src="../shared/pauza.js?v=4"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ["флаг", "флага", "флагов"];
  var qEl = document.getElementById('q'), opts = document.getElementById('opts'), note = document.getElementById('note'), sub = document.getElementById('sub');
  var cur, score, wrong, busy, btns = [], recent = [];
  var FL = [["Россия", "h", ["#FFFFFF", "#0039A6", "#D52B1E"]], ["Германия", "h", ["#000000", "#DD0000", "#FFCE00"]], ["Нидерланды", "h", ["#AE1C28", "#FFFFFF", "#21468B"]], ["Австрия", "h", ["#ED2939", "#FFFFFF", "#ED2939"]], ["Венгрия", "h", ["#CD2A3E", "#FFFFFF", "#436F4D"]], ["Болгария", "h", ["#FFFFFF", "#00966E", "#D62612"]], ["Эстония", "h", ["#0072CE", "#000000", "#FFFFFF"]], ["Литва", "h", ["#FDB913", "#006A44", "#C1272D"]], ["Украина", "h", ["#0057B7", "#FFD700"]], ["Польша", "h", ["#FFFFFF", "#DC143C"]], ["Индонезия", "h", ["#FF0000", "#FFFFFF"]], ["Армения", "h", ["#D90012", "#0033A0", "#F2A800"]], ["Люксембург", "h", ["#ED2939", "#FFFFFF", "#00A1DE"]], ["Колумбия", "h", ["#FCD116", "#003893", "#CE1126"], [2, 1, 1]], ["Йемен", "h", ["#CE1126", "#FFFFFF", "#000000"]], ["Сьерра-Леоне", "h", ["#1EB53A", "#FFFFFF", "#0072C6"]], ["Габон", "h", ["#009E60", "#FCD116", "#3A75C4"]], ["Латвия", "h", ["#9E3039", "#FFFFFF", "#9E3039"], [2, 1, 2]], ["Таиланд", "h", ["#A51931", "#F4F5F8", "#2D2A4A", "#F4F5F8", "#A51931"], [1, 1, 2, 1, 1]], ["Франция", "v", ["#0055A4", "#FFFFFF", "#EF4135"]], ["Италия", "v", ["#009246", "#FFFFFF", "#CE2B37"]], ["Ирландия", "v", ["#169B62", "#FFFFFF", "#FF883E"]], ["Бельгия", "v", ["#000000", "#FAE042", "#ED2939"]], ["Румыния", "v", ["#002B7F", "#FCD116", "#CE1126"]], ["Мали", "v", ["#14B53A", "#FCD116", "#CE1126"]], ["Гвинея", "v", ["#CE1126", "#FCD116", "#009460"]], ["Нигерия", "v", ["#008751", "#FFFFFF", "#008751"]], ["Перу", "v", ["#D91023", "#FFFFFF", "#D91023"]], ["Кот-д’Ивуар", "v", ["#F77F00", "#FFFFFF", "#009E60"]], ["Швеция", "n", ["#006AA7", "#FECC02"]], ["Дания", "n", ["#C8102E", "#FFFFFF"]], ["Финляндия", "n", ["#FFFFFF", "#003580"]], ["Норвегия", "n2", ["#BA0C2F", "#FFFFFF", "#00205B"]], ["Исландия", "n2", ["#02529C", "#FFFFFF", "#DC1E35"]], ["Япония", "c", ["#FFFFFF", "#BC002D"], [15]], ["Бангладеш", "c", ["#006A4E", "#F42A41"], [13.5]], ["Палау", "c", ["#4AADD6", "#FFDE00"], [13]], ["Швейцария", "sw", ["#DA291C", "#FFFFFF"]], ["Чехия", "cz", ["#FFFFFF", "#D7141A", "#11457E"]], ["Греция", "gr", ["#0D5EAF", "#FFFFFF"]], ["Грузия", "ge", ["#FFFFFF", "#FF0000"]], ["Вьетнам", "st", ["#DA251D", "#FFFF00"], [6]], ["Сомали", "st", ["#4189DD", "#FFFFFF"], [4.2]]];
  function rect(x, y, w, h, c) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + c + '"/>'; }
  function star(cx, cy, r, c) { var p = []; for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.382 : r; p.push((cx + Math.cos(a) * rr).toFixed(2) + ',' + (cy + Math.sin(a) * rr).toFixed(2)); } return '<polygon points="' + p.join(' ') + '" fill="' + c + '"/>'; }
  function flag(f) {
    var t = f[1], c = f[2], x = f[3], W = 30, H = 20, s = '';
    if (t === 'h') { var w = x || c.map(function () { return 1; }), tot = w.reduce(function (a, b) { return a + b; }, 0), y = 0; c.forEach(function (col, i) { var hh = H * w[i] / tot; s += rect(0, y.toFixed(3), W, (hh + 0.05).toFixed(3), col); y += hh; }); }
    else if (t === 'v') c.forEach(function (col, i) { s += rect(i * 10, 0, 10.05, H, col); });
    else if (t === 'n') s = rect(0, 0, W, H, c[0]) + rect(9, 0, 4, H, c[1]) + rect(0, 8, W, 4, c[1]);
    else if (t === 'n2') s = rect(0, 0, W, H, c[0]) + rect(8, 0, 6, H, c[1]) + rect(0, 7, W, 6, c[1]) + rect(9.5, 0, 3, H, c[2]) + rect(0, 8.5, W, 3, c[2]);
    else if (t === 'c') s = rect(0, 0, W, H, c[0]) + '<circle cx="' + x[0] + '" cy="10" r="6" fill="' + c[1] + '"/>';
    else if (t === 'sw') { W = 20; s = rect(0, 0, 20, 20, c[0]) + rect(8, 4, 4, 12, c[1]) + rect(4, 8, 12, 4, c[1]); }
    else if (t === 'cz') s = rect(0, 0, W, 10, c[0]) + rect(0, 10, W, 10, c[1]) + '<polygon points="0,0 15,10 0,20" fill="' + c[2] + '"/>';
    else if (t === 'gr') { var u = H / 9; for (var i = 0; i < 9; i++) s += rect(0, (i * u).toFixed(3), W, (u + 0.05).toFixed(3), i % 2 ? c[1] : c[0]); s += rect(0, 0, 5 * u, 5 * u, c[0]) + rect(2 * u, 0, u, 5 * u, c[1]) + rect(0, 2 * u, 5 * u, u, c[1]); }
    else if (t === 'ge') { s = rect(0, 0, W, H, c[0]) + rect(13, 0, 4, H, c[1]) + rect(0, 8, W, 4, c[1]); [[6.5, 4], [23.5, 4], [6.5, 16], [23.5, 16]].forEach(function (p) { s += rect(p[0] - 0.6, p[1] - 1.8, 1.2, 3.6, c[1]) + rect(p[0] - 1.8, p[1] - 0.6, 3.6, 1.2, c[1]); }); }
    else if (t === 'st') s = rect(0, 0, W, H, c[0]) + star(15, 10, x[0], c[1]);
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-label="Флаг">' + s + '</svg>';
  }
  function make() {
    var f = fresh(FL, function (x) { return x[0]; }), same = P.shuffle(FL.filter(function (x) { return x !== f && x[1] === f[1]; })), rest = P.shuffle(FL.filter(function (x) { return x !== f && x[1] !== f[1]; }));
    var ds = same.slice(0, 2).concat(rest).slice(0, 3);
    return { q: flag(f), opts: [f[0]].concat(ds.map(function (x) { return x[0]; })), info: '' };
  }
  var shell = P.shell({
    id: 'flags', title: 'Флаги', tagline: 'Угадай страну по флагу.',
    rulesHtml: '<p>Покажут флаг — выбери страну. Неправильные варианты часто похожи: полосы тех же цветов или такой же крест. Ошибка отнимает 3 секунды. Минута.</p>',
    startLabel: 'Угадывать', countdown: true, overEyebrow: 'Время вышло',
    unit: function (n) { return P.plural(n, U); },
    kbdHint: 'На компьютере: клавиши 1–4',
    onReset: reset
  });
  var timer = P.timeLimit(shell, 60, finish, document.getElementById('timebar'));
  for (var i = 0; i < 4; i++) { var b = document.createElement('button'); b.type = 'button'; b.dataset.i = i; opts.appendChild(b); btns.push(b); }
  opts.addEventListener('click', function (e) { var t = e.target.closest('button'); if (t) pick(Number(t.dataset.i)); });
  function fresh(list, key) { var pool = list.filter(function (x) { return recent.indexOf(key(x)) === -1; }); var x = P.pick(pool.length ? pool : list); recent.push(key(x)); if (recent.length > Math.min(30, list.length - 4)) recent.shift(); return x; }
  function next() {
    cur = make();
    qEl.innerHTML = cur.q; if (cur.sub) sub.textContent = cur.sub; note.textContent = '';
    var set = P.shuffle(cur.opts.slice()); cur.ans = set.indexOf(cur.opts[0]);
    btns.forEach(function (bt, i) { bt.textContent = set[i]; bt.className = ''; });
    busy = false;
  }
  function pick(i) {
    if (!shell.running || busy) return;
    busy = true;
    if (i === cur.ans) { score++; shell.setScore(String(score)); P.haptic('coin'); btns[i].className = 'right'; }
    else { wrong++; timer.add(-3); P.haptic('crash'); btns[i].className = 'wrong'; btns[cur.ans].className = 'right'; note.textContent = cur.info || ''; }
    setTimeout(function () { if (shell.running) next(); }, i === cur.ans ? 300 : 900);
  }
  function reset() { score = 0; wrong = 0; recent = []; note.textContent = ''; shell.setScore('0'); timer.reset(); next(); }
  function finish() { busy = true; shell.end({ score: score, delay: 300, stats: 'ошибок: ' + wrong, phrase: 'В «Флагах» я узнаю ' + score + ' ' + P.plural(score, U) + ' за минуту. А ты отличишь Румынию от Мали?' }); }
  window.addEventListener('keydown', function (e) { var m = /^(?:Digit|Numpad)([1-4])$/.exec(e.code); if (m) pick(Number(m[1]) - 1); });
  score = 0; next(); timer.show();
})();
</script>
</body>
</html>
