<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Лабиринт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=4">
<style>.stage{background:#140734}</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="game" aria-label="Лабиринт. Свайп катит шарик до развилки"></canvas></div>
<script src="../shared/pauza.js?v=4"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['лабиринт', 'лабиринта', 'лабиринтов'];
  var D = { up: [0, -1, 1, 4], right: [1, 0, 2, 8], down: [0, 1, 4, 1], left: [-1, 0, 8, 2] };
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var cols, rows, cells, ball, path, solved, level, cs, ox, oy, trail, queue;

  var shell = P.shell({
    id: 'maze', title: 'Лабиринт', tagline: 'Выведи шарик к выходу. Минута на всё.',
    rulesHtml: '<p>Свайп катит шарик в эту сторону до стены или до развилки. Доберись до зелёного выхода в правом нижнем углу. Каждый пройденный лабиринт даёт ещё 5 секунд, а следующий будет больше.</p>',
    overEyebrow: 'Время вышло', countdown: true,
    unit: function (n) { return P.plural(n, U); },
    onReset: reset
  });
  var timer = P.timeLimit(shell, 60, finish);
  var view = P.canvas(canvas, stage, function () { fit(); });
  function generate(c, r) {
    var g = new Array(c * r).fill(0), seen = new Array(c * r).fill(false), stack = [0];
    seen[0] = true;
    while (stack.length) {
      var cur = stack[stack.length - 1], x = cur % c, y = Math.floor(cur / c);
      var opts = Object.keys(D).filter(function (k) { var nx = x + D[k][0], ny = y + D[k][1]; return nx >= 0 && ny >= 0 && nx < c && ny < r && !seen[ny * c + nx]; });
      if (!opts.length) { stack.pop(); continue; }
      var k = P.pick(opts), n = (y + D[k][1]) * c + x + D[k][0];
      g[cur] |= D[k][2]; g[n] |= D[k][3]; seen[n] = true; stack.push(n);
    }
    return g;
  }
  function setLevel(l) {
    level = l; cols = Math.min(12, 6 + l); rows = Math.min(17, 8 + Math.floor(l * 1.5));
    cells = generate(cols, rows); ball = { c: 0, x: 0, y: 0 }; path = []; trail = [0]; queue = null;
    fit();
  }
  function fit() {
    if (!cols) return;
    cs = Math.floor(Math.min((view.W - 28) / cols, (view.H - 110) / rows));
    ox = Math.round((view.W - cs * cols) / 2); oy = Math.round(78 + (view.H - 92 - cs * rows) / 2);
  }
  function reset() { solved = 0; shell.setScore('0'); timer.reset(); setLevel(0); }
  function finish() {
    shell.end({ score: solved, delay: 300, stats: 'последний размер: ' + cols + '×' + rows,
      phrase: 'В «Лабиринте» у меня ' + solved + ' ' + P.plural(solved, U) + ' за минуту.' });
  }
  function exits(i) { var n = 0; for (var b = 1; b <= 8; b <<= 1) if (cells[i] & b) n++; return n; }
  function roll(dirName) {
    if (!shell.running || path.length) { queue = dirName; return; }
    var d = D[dirName], cur = ball.c;
    while (cells[cur] & d[2]) {
      var x = cur % cols + d[0], y = Math.floor(cur / cols) + d[1];
      cur = y * cols + x; path.push(cur);
      if (cur === cols * rows - 1 || exits(cur) > 2) break;
      var ok = cells[cur] & d[2];
      if (!ok && exits(cur) === 2) {
        /* поворот коридора: продолжаем в единственную другую сторону */
        var from = d[3], turn = null;
        Object.keys(D).forEach(function (k) { if ((cells[cur] & D[k][2]) && D[k][2] !== from) turn = k; });
        if (turn) d = D[turn];
      }
    }
    if (path.length) P.haptic('tap');
  }
  P.loop(function (dt) {
    if (!cells) return;
    if (shell.running && path.length) {
      var target = path[0], tx = target % cols, ty = Math.floor(target / cols), step = dt * 16;
      var dx = tx - ball.x, dy = ty - ball.y, dist = Math.hypot(dx, dy);
      if (dist <= step) {
        ball.x = tx; ball.y = ty; ball.c = target; path.shift(); trail.push(target);
        if (ball.c === cols * rows - 1) {
          solved++; shell.setScore(String(solved)); timer.add(5); P.haptic('win'); path = [];
          setLevel(level + 1);
        } else if (!path.length && queue) { var q = queue; queue = null; roll(q); }
      } else { ball.x += dx / dist * step; ball.y += dy / dist * step; }
    }
    draw();
  });
  function draw() {
    var ctx = view.ctx, W = view.W, H = view.H;
    ctx.fillStyle = '#140734'; ctx.fillRect(0, 0, W, H);
    if (!cells || !cs) return;
    ctx.fillStyle = '#22105A'; ctx.fillRect(ox, oy, cs * cols, cs * rows);
    ctx.fillStyle = 'rgba(61,245,176,0.12)';
    trail.forEach(function (i) { ctx.fillRect(ox + (i % cols) * cs, oy + Math.floor(i / cols) * cs, cs, cs); });
    ctx.fillStyle = '#3DF5B0'; ctx.fillRect(ox + (cols - 1) * cs + 3, oy + (rows - 1) * cs + 3, cs - 6, cs - 6);
    ctx.strokeStyle = '#B9A8F0'; ctx.lineWidth = Math.max(2, cs * 0.12); ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i < cells.length; i++) {
      var x = ox + (i % cols) * cs, y = oy + Math.floor(i / cols) * cs;
      if (!(cells[i] & 1)) { ctx.moveTo(x, y); ctx.lineTo(x + cs, y); }
      if (!(cells[i] & 8)) { ctx.moveTo(x, y); ctx.lineTo(x, y + cs); }
      if (Math.floor(i / cols) === rows - 1 && !(cells[i] & 4)) { ctx.moveTo(x, y + cs); ctx.lineTo(x + cs, y + cs); }
      if (i % cols === cols - 1 && !(cells[i] & 2)) { ctx.moveTo(x + cs, y); ctx.lineTo(x + cs, y + cs); }
    }
    ctx.stroke();
    ctx.fillStyle = P.gold() ? '#FFD84D' : '#FF6B4A';
    ctx.beginPath(); ctx.arc(ox + (ball.x + 0.5) * cs, oy + (ball.y + 0.5) * cs, cs * 0.3, 0, Math.PI * 2); ctx.fill();
  }
  P.gestures(canvas, { swipe: roll });
  P.arrows(roll);
  setLevel(0);
})();
</script>
</body>
</html>
