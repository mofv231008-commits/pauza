600}\n.record.new{color:var(--mint)}\n.stats{margin:-6px 0 0;font-size:14px;color:var(--lilac);font-variant-numeric:tabular-nums}\n.pause-text{margin:-2px 0 0;font-size:16px;color:var(--lilac)}\n\n/* Отсчёт и подсказки */\n.countdown{position:absolute;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none;font-family:var(--font-display);font-weight:800;font-size:96px;color:var(--paper);text-shadow:0 6px 30px rgba(20,7,52,.75)}\n.toast{\n  position:absolute;left:50%;bottom:24px;z-index:20;transform:translateX(-50%);width:min(calc(100% - 32px),360px);\n  padding:12px 16px;border-radius:14px;background:var(--paper);color:var(--ink);font-size:14px;font-weight:500;\n  -webkit-user-select:text;user-select:text;box-shadow:0 10px 30px rgba(0,0,0,.35);\n}\n.timebar{width:100%;max-width:400px;height:8px;border-radius:4px;background:rgba(20,7,52,.55);overflow:hidden;flex:none}\n.timebar i{display:block;height:100%;width:100%;border-radius:4px;background:var(--mint);transform-origin:0 50%}\n.timebar.warn i{background:var(--coral)}\n\n@media (prefers-reduced-motion:reduce){\n  .mark i:last-child{animation:none}\n  *{transition-duration:.01ms!important;animation-duration:.01ms!important}\n}\n\n/* Рекламная строка на экране итога */\n.ad-line{display:flex;flex-direction:column;gap:3px;width:100%;margin:2px 0 0;padding:10px 12px;border:1px solid rgba(185,168,240,.2);border-radius:14px;background:rgba(244,241,255,.05);color:var(--paper);font:inherit;font-size:13px;line-height:1.35;text-align:left;cursor:pointer}\n.ad-line .ad-label{font-size:11px;letter-spacing:.04em;color:var(--lilac)}\n.ad-line[hidden]{display:none}\n<\/style>\n<style>/* Небольшой общий слой для минутных хорроров; меню и HUD остаются Pauza. */\n.stage.horror{background:#100c20}\n.horror .play{gap:12px;padding-top:88px;padding-bottom:max(18px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 35%,#302344 0,transparent 70%)}\n.horror .play::after{content:\"\";position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#000 3px 4px)}\n.horror .play>*{z-index:1}\n.horror .timebar{height:5px}\n.case{margin:0;color:var(--coral-2);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}\n.instruction{margin:0;text-align:center;color:var(--lilac);font-size:13px;min-height:2.8em;max-width:360px}\n.readout{margin:0;text-align:center;min-height:2.8em;font-size:14px;color:var(--paper);max-width:360px}\n.readout[data-tone=\"bad\"]{color:var(--coral-2)}\n.readout[data-tone=\"good\"]{color:var(--mint)}\n.control{appearance:none;border:1px solid var(--line);background:#211831;border-radius:15px;min-height:48px;padding:10px 16px;font:600 14px var(--font-body);cursor:pointer;touch-action:manipulation}\n.control:active{transform:translateY(1px)}\n.control:disabled{opacity:.45;cursor:default}\n.controls{display:flex;gap:8px;width:100%;max-width:360px}\n.controls>*{flex:1;min-width:0}\n.monitor{position:relative;width:100%;max-width:360px;border:1px solid #55415e;background:#151020;border-radius:22px;padding:16px;box-shadow:inset 0 0 30px #0008}\n.horror .panel{background:rgba(18,11,29,.95);border-color:#604958}\n.horror .mark i{background:var(--coral-2)}\n.horror [type=\"range\"]{width:100%;accent-color:var(--mint);min-height:40px;touch-action:pan-x}\n.horror label{font-size:13px;color:var(--lilac)}\n.horror .meter{height:6px;background:#09060f;border-radius:10px;overflow:hidden}\n.horror .meter i{display:block;height:100%;background:var(--coral-2);width:0;transition:width .12s linear}\n.horror .play .small{font-size:11px;letter-spacing:.1em;color:var(--lilac);margin:0;text-align:center}\n@media(max-height:650px){.horror .play{gap:7px;padding-top:78px;padding-bottom:10px}.horror .monitor{padding:10px}.instruction,.readout{font-size:12px;min-height:2.4em}.case{font-size:10px}}\n@media(prefers-reduced-motion:reduce){.horror *{animation:none!important;transition:none!important}}\n<\/style>\n<style>.cameras{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:360px}.camera{position:relative;min-height:96px;border:1px solid #5e4964;border-radius:16px;padding:12px;background:linear-gradient(110deg,#1c1829,#08060e);text-align:left;cursor:pointer;overflow:hidden}.camera.active{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint)}.camera .name{position:relative;z-index:2;font-size:11px;color:var(--lilac)}.camera .shadow{position:absolute;left:50%;top:45%;width:25px;height:40px;border-radius:50% 50% 0 0;background:#050308;box-shadow:0 0 16px #ff8a7b66;transform-origin:50% 100%}.camera .shadow:before,.camera .shadow:after{content:\"\";position:absolute;top:10px;width:4px;height:3px;background:var(--coral-2)}.camera .shadow:before{left:6px}.camera .shadow:after{right:6px}.camera .meter{position:absolute;bottom:9px;left:10px;right:10px}.camera .closed{position:absolute;inset:34px 0 20px;display:grid;place-items:center;color:var(--mint);font-size:11px;background:#131020}.power{display:flex;align-items:center;gap:12px;font-size:12px}.power .meter{flex:1}.power .meter i{background:var(--mint)}<\/style><\/head><body>\n<div class=\"stage horror\" id=\"stage\"><div class=\"play\">\n<div class=\"timebar\" id=\"timebar\"><i><\/i><\/div>\n<p class=\"case\">Объект 04 / пост охраны<\/p><p class=\"instruction\">Выбери камеру. Запри дверь, когда тень приблизится к красной полосе.<\/p><div class=\"cameras\" id=\"cameras\"><\/div><div class=\"monitor power\">Энергия <span id=\"energy\">100%<\/span><div class=\"meter\"><i id=\"power\"><\/i><\/div><\/div><button class=\"control\" id=\"door\">Запереть выбранную дверь · 25%<\/button>\n<p class=\"readout\" id=\"message\" role=\"status\" aria-live=\"polite\">Продержись до конца минуты.<\/p>\n<\/div><\/div>\n<script>/* «Пауза»: общий скрипт всех игр.\n   Даёт игре связь с Telegram, рекорды, паузу, экраны меню и кнопку «Вызвать друга».\n   Этим же набором функций будут пользоваться сторонние разработчики. */\n(function () {\n  'use strict';\n\n  var BOT = 'Pauzagame_bot';\n  var PLAY_LINK = 'https://t.me/' + BOT + '/play';\n  var NIGHT = '#140734';\n  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n\n  function safe(fn, fallback) { try { return fn(); } catch (e) { return fallback; } }\n\n  var store = {\n    get: function (k, d) {\n      return safe(function () { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }, d);\n    },\n    set: function (k, v) { safe(function () { localStorage.setItem(k, JSON.stringify(v)); }); }\n  };\n\n  /* ---------- Telegram ----------\n     Свой мост без скрипта с telegram.org: он может не загрузиться в России. */\n  var hashHasTg = /tgWebApp(Data|Version|Platform)=/.test(location.hash);\n  if (hashHasTg) safe(function () { sessionStorage.setItem('pz_preview_tg', '1'); });\n  var inTelegram = false && hashHasTg || !!window.TelegramWebviewProxy ||\n    safe(function () { return sessionStorage.getItem('pz_preview_tg') === '1'; }, false);\n\n  function postEvent(type, data) {\n    if (!inTelegram) return false;\n    var body = data || {};\n    try {\n      if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {\n        window.TelegramWebviewProxy.postEvent(type, JSON.stringify(body));\n        return true;\n      }\n      if (window.external && 'notify' in window.external) {\n        window.external.notify(JSON.stringify({ eventType: type, eventData: body }));\n        return true;\n      }\n      if (window.parent !== window) {\n        window.parent.postMessage(JSON.stringify({ eventType: type, eventData: body }), '*');\n        return true;\n      }\n    } catch (e) {}\n    return false;\n  }\n\n  function init() {\n    postEvent('web_app_ready');\n    postEvent('web_app_expand');\n    postEvent('web_app_setup_swipe_behavior', { allow_vertical_swipe: false });\n    postEvent('web_app_set_header_color', { color: NIGHT });\n    postEvent('web_app_set_background_color', { color: NIGHT });\n    postEvent('web_app_set_bottom_bar_color', { color: NIGHT });\n    /* Крестик Telegram сначала спрашивает «Закрыть?», а не выкидывает сразу */\n    postEvent('web_app_setup_closing_behavior', { need_confirmation: true });\n    if (!backHandler) postEvent('web_app_setup_back_button', { is_visible: false });\n  }\n\n  /* Кнопка «Назад» в шапке Telegram вместо крестика. back(fn) — показать, back(null) — спрятать */\n  var backHandler = null;\n  function back(fn) {\n    backHandler = fn || null;\n    postEvent('web_app_setup_back_button', { is_visible: !!backHandler });\n  }\n\n  /* Какую игру просили открыть по ссылке t.me/…/play?startapp=race */\n  function startParam() {\n    var fromQuery = safe(function () { return new URLSearchParams(location.search).get('tgWebAppStartParam'); }, null);\n    if (fromQuery) return fromQuery;\n    return safe(function () {\n      var data = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData');\n      return data ? new URLSearchParams(data).get('start_param') : null;\n    }, null);\n  }\n\n  function haptic(kind) {\n    if (!kind) return;\n    if (inTelegram) {\n      if (kind === 'crash') postEvent('web_app_trigger_haptic_feedback', { type: 'notification', notification_type: 'error' });\n      else if (kind === 'win') postEvent('web_app_trigger_haptic_feedback', { type: 'notification', notification_type: 'success' });\n      else if (kind === 'coin') postEvent('web_app_trigger_haptic_feedback', { type: 'selection_change' });\n      else postEvent('web_app_trigger_haptic_feedback', { type: 'impact', impact_style: 'light' });\n    } else if (kind === 'crash') {\n      safe(function () { if (navigator.vibrate) navigator.vibrate(80); });\n    }\n  }\n\n  /* «Вызвать друга»: в Telegram вставляет вызов в выбранный чат, в браузере копирует текст */\n  function share(gameId, phrase) {\n    if (postEvent('web_app_switch_inline_query', { query: gameId + ' ' + phrase, chat_types: ['users', 'groups'] })) {\n      return Promise.resolve('telegram');\n    }\n    var text = phrase + ' Побьёшь? ' + PLAY_LINK + '?startapp=' + gameId;\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      return navigator.clipboard.writeText(text).then(function () { return 'copied'; }, function () { return Promise.reject(text); });\n    }\n    return Promise.reject(text);\n  }\n\n  /* ---------- Ссылки, реклама и счётчик игроков ---------- */\n  var ROOT = safe(function () { return document.currentScript.src.replace(/shared\\/pauza\\.js.*$/, ''); }, '../');\n  var SUPPORT = 'helpPauza';\n  function openLink(url) {\n    if (!url) return;\n    if (/^https:\\/\\/t\\.me\\//.test(url)) { if (postEvent('web_app_open_tg_link', { path_full: url.slice(12) })) return; }\n    else if (postEvent('web_app_open_link', { url: url })) return;\n    window.open(url, '_blank', 'noopener');\n  }\n  /* Рекламное место. Объявление лежит в ads.json в корне сайта, код менять не нужно. */\n  var adPromise = null;\n  function today() { return new Date(Date.now() + 3 * 3600000).toISOString().slice(0, 10); }\n  function ad() { return Promise.resolve(null); }\n  function adLabel(a) { return ['Реклама', a.advertiser, a.erid ? 'erid: ' + a.erid : ''].filter(Boolean).join(' · '); }\n  /* Счётчик: случайный номер устройства, без имён и id из Telegram. Нужен, чтобы видеть, сколько людей играет. */\n  function deviceId() {\n    return safe(function () {\n      var v = localStorage.getItem('pz_preview_dev');\n      if (!v) { v = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('pz_preview_dev', v); }\n      return v.replace(/[^a-z0-9]/g, '').slice(0, 32);\n    }, '');\n  }\n  function ping(game) {}\n\n  /* ---------- События от Telegram ----------\n     Мобильные клиенты вызывают Telegram.WebView.receiveEvent, веб-версия присылает postMessage */\n  var listeners = {};\n  function on(type, fn) { (listeners[type] = listeners[type] || []).push(fn); }\n  function off(type, fn) {\n    var list = listeners[type];\n    if (list) listeners[type] = list.filter(function (f) { return f !== fn; });\n  }\n  function receiveEvent(type, data) {\n    (listeners[type] || []).slice().forEach(function (fn) { safe(function () { fn(data || {}); }); });\n  }\n  on('back_button_pressed', function () { if (backHandler) backHandler(); });\n  window.Telegram = window.Telegram || {};\n  if (!window.Telegram.WebView) window.Telegram.WebView = { receiveEvent: receiveEvent };\n  if (!window.TelegramGameProxy) window.TelegramGameProxy = { receiveEvent: receiveEvent };\n  if (!window.TelegramGameProxy_receiveEvent) window.TelegramGameProxy_receiveEvent = receiveEvent;\n  window.addEventListener('message', function (e) {\n    if (e.source !== window.parent || window.parent === window) return;\n    var d = safe(function () { return typeof e.data === 'string' ? JSON.parse(e.data) : e.data; }, null);\n    if (d && d.eventType) receiveEvent(d.eventType, d.eventData);\n  });\n\n  /* Облачное хранилище Telegram: одно на пользователя и бота, видно со всех его устройств */\n  var reqSeq = 0, pending = {};\n  on('custom_method_invoked', function (d) {\n    var p = pending[d.req_id];\n    if (!p) return;\n    delete pending[d.req_id];\n    if (d.error) p.reject(new Error(d.error)); else p.resolve(d.result);\n  });\n  function invoke(method, params, timeoutMs) {\n    return new Promise(function (resolve, reject) {\n      var id = 'pz' + (++reqSeq) + '_' + Date.now();\n      pending[id] = { resolve: resolve, reject: reject };\n      if (!postEvent('web_app_invoke_custom_method', { req_id: id, method: method, params: params })) {\n        delete pending[id];\n        reject(new Error('no telegram'));\n        return;\n      }\n      setTimeout(function () { if (pending[id]) { delete pending[id]; reject(new Error('timeout')); } }, timeoutMs || 4000);\n    });\n  }\n  var cloud = {\n    get: function (keys) { return invoke('getStorageValues', { keys: keys }); },\n    set: function (key, value) { return invoke('saveStorageValue', { key: key, value: value }); }\n  };\n\n  /* ---------- Звёзды ----------\n     Покупки только для красоты: на очки и рекорды они не влияют. */\n  var BOT_API = 'https://pauza-bot.mofv231008.workers.dev';\n  var PRODUCTS = {\n    thanks: { stars: 15, title: 'Спасибо', perk: 'Значок ⭐ на экране выбора' },\n    gold: { stars: 75, title: 'Золотой набор', perk: 'Золотые машинка, самолётик, змейка и звездолёт, плюс значок ⭐' }\n  };\n  var perkCache = null;\n  function perks() {\n    if (!perkCache) {\n      var p = store.get('pz_preview_perks', {});\n      perkCache = p && typeof p === 'object' ? p : {};\n    }\n    return perkCache;\n  }\n  function grant(id) {\n    var p = perks();\n    if (!p[id]) p[id] = Date.now();\n    store.set('pz_preview_perks', p);\n    cloud.set('pz_preview_perks', JSON.stringify(p)).catch(function () {});\n  }\n  function gold() { return !!perks().gold; }\n  function supporter() { var p = perks(); return !!(p.gold || p.thanks); }\n  /* Подтягиваем покупки из облака: так они появляются на новом телефоне */\n  function syncPerks() {\n    if (!inTelegram) return Promise.resolve(perks());\n    return cloud.get(['pz_preview_perks']).then(function (res) {\n      var remote = safe(function () { return JSON.parse((res && res.pz_perks) || '{}') || {}; }, {});\n      var local = perks(), changed = false;\n      Object.keys(remote).forEach(function (k) { if (PRODUCTS[k] && !local[k]) { local[k] = remote[k]; changed = true; } });\n      if (changed) store.set('pz_preview_perks', local);\n      return local;\n    }, function () { return perks(); });\n  }\n  /* Окно оплаты Telegram. Ответ: 'paid', 'cancelled', 'failed' или 'pending' */\n  function buy(id) {\n    if (!PRODUCTS[id]) return Promise.reject(new Error('Такого набора нет.'));\n    if (!inTelegram) return Promise.reject(new Error('Оплата звёздами работает только внутри Telegram. Открой игру через @' + BOT + '.'));\n    return fetch(BOT_API + '/invoice?product=' + encodeURIComponent(id)).then(function (r) {\n      if (!r.ok) throw new Error('Сервер оплаты не ответил. Попробуй ещё раз через минуту.');\n      return r.json();\n    }, function () {\n      throw new Error('Нет связи с сервером оплаты. Проверь интернет и попробуй ещё раз.');\n    }).then(function (data) {\n      var m = /^https:\\/\\/t\\.me\\/(?:\\$|invoice\\/)([A-Za-z0-9_\\-=]+)$/.exec((data && data.link) || '');\n      if (!m) throw new Error('Не получилось создать счёт. Попробуй ещё раз через минуту.');\n      var slug = m[1];\n      return new Promise(function (resolve, reject) {\n        function closed(d) {\n          if (d.slug && d.slug !== slug) return;\n          off('invoice_closed', closed);\n          if (d.status === 'paid') { grant(id); haptic('win'); }\n          resolve(d.status || 'cancelled');\n        }\n        on('invoice_closed', closed);\n        if (!postEvent('web_app_open_invoice', { slug: slug })) {\n          off('invoice_closed', closed);\n          reject(new Error('Не получилось открыть окно оплаты.'));\n        }\n      });\n    });\n  }\n\n  /* ---------- Помощники для игр ---------- */\n\n  /* Скруглённые прямоугольники на старых телефонах (iOS 15 и раньше) */\n  if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {\n    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {\n      r = Math.max(0, Math.min(typeof r === 'number' ? r : (r && r[0]) || 0, Math.abs(w) / 2, Math.abs(h) / 2));\n      this.moveTo(x + r, y);\n      this.arcTo(x + w, y, x + w, y + h, r);\n      this.arcTo(x + w, y + h, x, y + h, r);\n      this.arcTo(x, y + h, x, y, r);\n      this.arcTo(x, y, x + w, y, r);\n      this.closePath();\n      return this;\n    };\n  }\n\n  /* Холст во всю сцену с учётом плотности пикселей. onResize(view) зовётся при каждом изменении размера. */\n  function canvas2d(canvas, stage, onResize) {\n    var ctx = canvas.getContext('2d');\n    var view = { ctx: ctx, W: 1, H: 1, dpr: 1 };\n    var ready = false;\n    function fit() {\n      var r = stage.getBoundingClientRect();\n      var w = Math.max(1, r.width), h = Math.max(1, r.height);\n      view.dpr = Math.min(window.devicePixelRatio || 1, 2.5);\n      canvas.width = Math.round(w * view.dpr); canvas.height = Math.round(h * view.dpr);\n      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);\n      var oldW = view.W, oldH = view.H;\n      view.W = w; view.H = h;\n      if (onResize && ready) onResize(view, oldW, oldH);\n    }\n    if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);\n    window.addEventListener('resize', fit);\n    fit();\n    /* Первый вызов onResize — после того, как игра получила view */\n    Promise.resolve().then(function () { ready = true; if (onResize) onResize(view, 1, 1); });\n    return view;\n  }\n\n  /* Игровой цикл: fn(dt) каждый кадр, dt в секундах, не больше 0,05 */\n  function loop(fn) {\n    var last = performance.now();\n    function frame(now) {\n      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));\n      last = now;\n      fn(dt);\n      requestAnimationFrame(frame);\n    }\n    requestAnimationFrame(frame);\n  }\n\n  /* Ограничение по времени: секунды справа вверху и полоска .timebar, если она есть */\n  function timeLimit(game, total, onEnd, bar) {\n    var fill = bar ? bar.querySelector('i') : null;\n    var t = { left: total, total: total };\n    function show() {\n      var warn = t.left <= Math.min(10, total / 4);\n      game.setSide(Math.ceil(t.left) + ' с', warn);\n      if (fill) {\n        fill.style.transform = 'scaleX(' + clamp(t.left / total, 0, 1).toFixed(4) + ')';\n        bar.classList.toggle('warn', warn);\n      }\n    }\n    t.reset = function () { t.left = total; show(); };\n    t.add = function (sec) {\n      t.left = clamp(t.left + sec, 0, total * 2); show();\n      if (t.left <= 0 && game.running) onEnd();\n    };\n    t.show = show;\n    loop(function (dt) {\n      if (!game.running || t.left <= 0) return;\n      t.left -= dt;\n      if (t.left <= 0) { t.left = 0; show(); onEnd(); } else show();\n    });\n    return t;\n  }\n\n  /* Тап и свайп по элементу. h.tap(x, y, e) в координатах элемента, h.swipe('left'|'right'|'up'|'down') */\n  function gestures(el, h) {\n    var start = null;\n    el.addEventListener('pointerdown', function (e) {\n      if (e.button > 0) return;\n      start = { x: e.clientX, y: e.clientY, t: Date.now() };\n      if (h.down) { var r = el.getBoundingClientRect(); h.down(e.clientX - r.left, e.clientY - r.top, e); }\n    });\n    el.addEventListener('pointerup', function (e) {\n      if (!start) return;\n      var dx = e.clientX - start.x, dy = e.clientY - start.y;\n      start = null;\n      if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {\n        if (h.swipe) h.swipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));\n      } else if (h.tap) {\n        var r = el.getBoundingClientRect();\n        h.tap(e.clientX - r.left, e.clientY - r.top, e);\n      }\n    });\n    el.addEventListener('pointercancel', function () { start = null; });\n  }\n\n  /* Стрелки и WASD на компьютере */\n  function arrows(fn) {\n    var map = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };\n    window.addEventListener('keydown', function (e) {\n      var d = map[e.code];\n      if (d) { e.preventDefault(); fn(d, e); }\n    });\n  }\n\n  function rand(n) { return Math.floor(Math.random() * n); }\n  function pick(list) { return list[rand(list.length)]; }\n  function shuffle(list) {\n    for (var i = list.length - 1; i > 0; i--) { var j = rand(i + 1), t = list[i]; list[i] = list[j]; list[j] = t; }\n    return list;\n  }\n\n  /* ---------- Мелочи ---------- */\n  function fmt(n) { return Math.floor(n).toLocaleString('ru-RU'); }\n  function plural(n, forms) {\n    n = Math.abs(Math.floor(n));\n    va n window.external) {\n        window.external.notify(JSON.stringify({ eventType: type, eventData: body }));\n        return true;\n      }\n      if (window.parent !== window) {\n        window.parent.postMessage(JSON.stringify({ eventType: type, eventData: body }), '*');\n        return true;\n      }\n    } catch (e) {}\n    return false;\n  }\n\n  function init() {\n    postEvent('web_app_ready');\n    postEvent('web_app_expand');\n    postEvent('web_app_setup_swipe_behavior', { allow_vertical_swipe: false });\n    postEvent('web_app_set_header_color', { color: NIGHT });\n    postEvent('web_app_set_background_color', { color: NIGHT });\n    postEvent('web_app_set_bottom_bar_color', { color: NIGHT });\n    /* Крестик Telegram сначала спрашивает «Закрыть?», а не выкидывает сразу */\n    postEvent('web_app_setup_closing_behavior', { need_confirmation: true });\n    if (!backHandler) postEvent('web_app_setup_back_button', { is_visible: false });\n  }\n\n  /* Кнопка «Назад» в шапке Telegram вместо крестика. back(fn) — показать, back(null) — спрятать */\n  var backHandler = null;\n  function back(fn) {\n    backHandler = fn || null;\n    postEvent('web_app_setup_back_button', { is_visible: !!backHandler });\n  }\n\n  /* Какую игру просили открыть по ссылке t.me/…/play?startapp=race */\n  function startParam() {\n    var fromQuery = safe(function () { return new URLSearchParams(location.search).get('tgWebAppStartParam'); }, null);\n    if (fromQuery) return fromQuery;\n    return safe(function () {\n      var data = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData');\n      return data ? new URLSearchParams(data).get('start_param') : null;\n    }, null);\n  }\n\n  function haptic(kind) {\n    if (!kind) return;\n    if (inTelegram) {\n      if (kind === 'crash') postEvent('web_app_trigger_haptic_feedback', { type: 'notification', notification_type: 'error' });\n      else if (kind === 'win') postEvent('web_app_trigger_haptic_feedback', { type: 'notification', notification_type: 'success' });\n      else if (kind === 'coin') postEvent('web_app_trigger_haptic_feedback', { type: 'selection_change' });\n      else postEvent('web_app_trigger_haptic_feedback', { type: 'impact', impact_style: 'light' });\n    } else if (kind === 'crash') {\n      safe(function () { if (navigator.vibrate) navigator.vibrate(80); });\n    }\n  }\n\n  /* «Вызвать друга»: в Telegram вставляет вызов в выбранный чат, в браузере копирует текст */\n  function share(gameId, phrase) {\n    if (postEvent('web_app_switch_inline_query', { query: gameId + ' ' + phrase, chat_types: ['users', 'groups'] })) {\n      return Promise.resolve('telegram');\n    }\n    var text = phrase + ' Побьёшь? ' + PLAY_LINK + '?startapp=' + gameId;\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      return navigator.clipboard.writeText(text).then(function () { return 'copied'; }, function () { return Promise.reject(text); });\n    }\n    return Promise.reject(text);\n  }\n\n  /* ---------- Ссылки, реклама и счётчик игроков ---------- */\n  var ROOT = safe(function () { return document.currentScript.src.replace(/shared\\/pauza\\.js.*$/, ''); }, '../');\n  var SUPPORT = 'helpPauza';\n  function openLink(url) {\n    if (!url) return;\n    if (/^https:\\/\\/t\\.me\\//.test(url)) { if (postEvent('web_app_open_tg_link', { path_full: url.slice(12) })) return; }\n    else if (postEvent('web_app_open_link', { url: url })) return;\n    window.open(url, '_blank', 'noopener');\n  }\n  /* Рекламное место. Объявление лежит в ads.json в корне сайта, код менять не нужно. */\n  var adPromise = null;\n  function today() { return new Date(Date.now() + 3 * 3600000).toISOString().slice(0, 10); }\n  function ad() { return Promise.resolve(null); }\n  function adLabel(a) { return ['Реклама', a.advertiser, a.erid ? 'erid: ' + a.erid : ''].filter(Boolean).join(' · '); }\n  /* Счётчик: случайный номер устройства, без имён и id из Telegram. Нужен, чтобы видеть, сколько людей играет. */\n  function deviceId() {\n    return safe(function () {\n      var v = localStorage.getItem('pz_preview_dev');\n      if (!v) { v = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('pz_preview_dev', v); }\n      return v.replace(/[^a-z0-9]/g, '').slice(0, 32);\n    }, '');\n  }\n  function ping(game) {}\n\n  /* ---------- События от Telegram ----------\n     Мобильные клиенты вызывают Telegram.WebView.receiveEvent, веб-версия присылает postMessage */\n  var listeners = {};\n  function on(type, fn) { (listeners[type] = listeners[type] || []).push(fn); }\n  function off(type, fn) {\n    var list = listeners[type];\n    if (list) listeners[type] = list.filter(function (f) { return f !== fn; });\n  }\n  function receiveEvent(type, data) {\n    (listeners[type] || []).slice().forEach(function (fn) { safe(function () { fn(data || {}); }); });\n  }\n  on('back_button_pressed', function () { if (backHandler) backHandler(); });\n  window.Telegram = window.Telegram || {};\n  if (!window.Telegram.WebView) window.Telegram.WebView = { receiveEvent: receiveEvent };\n  if (!window.TelegramGameProxy) window.TelegramGameProxy = { receiveEvent: receiveEvent };\n  if (!window.TelegramGameProxy_receiveEvent) window.TelegramGameProxy_receiveEvent = receiveEvent;\n  window.addEventListener('message', function (e) {\n    if (e.source !== window.parent || window.parent === window) return;\n    var d = safe(function () { return typeof e.data === 'string' ? JSON.parse(e.data) : e.data; }, null);\n    if (d && d.eventType) receiveEvent(d.eventType, d.eventData);\n  });\n\n  /* Облачное хранилище Telegram: одно на пользователя и бота, видно со всех его устройств */\n  var reqSeq = 0, pending = {};\n  on('custom_method_invoked', function (d) {\n    var p = pending[d.req_id];\n    if (!p) return;\n    delete pending[d.req_id];\n    if (d.error) p.reject(new Error(d.error)); else p.resolve(d.result);\n  });\n  function invoke(method, params, timeoutMs) {\n    return new Promise(function (resolve, reject) {\n      var id = 'pz' + (++reqSeq) + '_' + Date.now();\n      pending[id] = { resolve: resolve, reject: reject };\n      if (!postEvent('web_app_invoke_custom_method', { req_id: id, method: method, params: params })) {\n        delete pending[id];\n        reject(new Error('no telegram'));\n        return;\n      }\n      setTimeout(function () { if (pending[id]) { delete pending[id]; reject(new Error('timeout')); } }, timeoutMs || 4000);\n    });\n  }\n  var cloud = {\n    get: function (keys) { return invoke('getStorageValues', { keys: keys }); },\n    set: function (key, value) { return invoke('saveStorageValue', { key: key, value: value }); }\n  };\n\n  /* ---------- Звёзды ----------\n     Покупки только для красоты: на очки и рекорды они не влияют. */\n  var BOT_API = 'https://pauza-bot.mofv231008.workers.dev';\n  var PRODUCTS = {\n    thanks: { stars: 15, title: 'Спасибо', perk: 'Значок ⭐ на экране выбора' },\n    gold: { stars: 75, title: 'Золотой набор', perk: 'Золотые машинка, самолётик, змейка и звездолёт, плюс значок ⭐' }\n  };\n  var perkCache = null;\n  function perks() {\n    if (!perkCache) {\n      var p = store.get('pz_preview_perks', {});\n      perkCache = p && typeof p === 'object' ? p : {};\n    }\n    return perkCache;\n  }\n  function grant(id) {\n    var p = perks();\n    if (!p[id]) p[id] = Date.now();\n    store.set('pz_preview_perks', p);\n    cloud.set('pz_preview_perks', JSON.stringify(p)).catch(function () {});\n  }\n  function gold() { return !!perks().gold; }\n  function supporter() { var p = perks(); return !!(p.gold || p.thanks); }\n  /* Подтягиваем покупки из облака: так они появляются на новом телефоне */\n  function syncPerks() {\n    if (!inTelegram) return Promise.resolve(perks());\n    return cloud.get(['pz_preview_perks']).then(function (res) {\n      var remote = safe(function () { return JSON.parse((res && res.pz_perks) || '{}') || {}; }, {});\n      var local = perks(), changed = false;\n      Object.keys(remote).forEach(function (k) { if (PRODUCTS[k] && !local[k]) { local[k] = remote[k]; changed = true; } });\n      if (changed) store.set('pz_preview_perks', local);\n      return local;\n    }, function () { return perks(); });\n  }\n  /* Окно оплаты Telegram. Ответ: 'paid', 'cancelled', 'failed' или 'pending' */\n  function buy(id) {\n    if (!PRODUCTS[id]) return Promise.reject(new Error('Такого набора нет.'));\n    if (!inTelegram) return Promise.reject(new Error('Оплата звёздами работает только внутри Telegram. Открой игру через @' + BOT + '.'));\n    return fetch(BOT_API + '/invoice?product=' + encodeURIComponent(id)).then(function (r) {\n      if (!r.ok) throw new Error('Сервер оплаты не ответил. Попробуй ещё раз через минуту.');\n      return r.json();\n    }, function () {\n      throw new Error('Нет связи с сервером оплаты. Проверь интернет и попробуй ещё раз.');\n    }).then(function (data) {\n      var m = /^https:\\/\\/t\\.me\\/(?:\\$|invoice\\/)([A-Za-z0-9_\\-=]+)$/.exec((data && data.link) || '');\n      if (!m) throw new Error('Не получилось создать счёт. Попробуй ещё раз через минуту.');\n      var slug = m[1];\n      return new Promise(function (resolve, reject) {\n        function closed(d) {\n          if (d.slug && d.slug !== slug) return;\n          off('invoice_closed', closed);\n          if (d.status === 'paid') { grant(id); haptic('win'); }\n          resolve(d.status || 'cancelled');\n        }\n        on('invoice_closed', closed);\n        if (!postEvent('web_app_open_invoice', { slug: slug })) {\n          off('invoice_closed', closed);\n          reject(new Error('Не получилось открыть окно оплаты.'));\n        }\n      });\n    });\n  }\n\n  /* ---------- Помощники для игр ---------- */\n\n  /* Скруглённые прямоугольники на старых телефонах (iOS 15 и раньше) */\n  if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {\n    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {\n      r = Math.max(0, Math.min(typeof r === 'number' ? r : (r && r[0]) || 0, Math.abs(w) / 2, Math.abs(h) / 2));\n      this.moveTo(x + r, y);\n      this.arcTo(x + w, y, x + w, y + h, r);\n      this.arcTo(x + w, y + h, x, y + h, r);\n      this.arcTo(x, y + h, x, y, r);\n      this.arcTo(x, y, x + w, y, r);\n      this.closePath();\n      return this;\n    };\n  }\n\n  /* Холст во всю сцену с учётом плотности пикселей. onResize(view) зовётся при каждом изменении размера. */\n  function canvas2d(canvas, stage, onResize) {\n    var ctx = canvas.getContext('2d');\n    var view = { ctx: ctx, W: 1, H: 1, dpr: 1 };\n    var ready = false;\n    function fit() {\n      var r = stage.getBoundingClientRect();\n      var w = Math.max(1, r.width), h = Math.max(1, r.height);\n      view.dpr = Math.min(window.devicePixelRatio || 1, 2.5);\n      canvas.width = Math.round(w * view.dpr); canvas.height = Math.round(h * view.dpr);\n      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);\n      var oldW = view.W, oldH = view.H;\n      view.W = w; view.H = h;\n      if (onResize && ready) onResize(view, oldW, oldH);\n    }\n    if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);\n    window.addEventListener('resize', fit);\n    fit();\n    /* Первый вызов onResize — после того, как игра получила view */\n    Promise.resolve().then(function () { ready = true; if (onResize) onResize(view, 1, 1); });\n    return view;\n  }\n\n  /* Игровой цикл: fn(dt) каждый кадр, dt в секундах, не больше 0,05 */\n  function loop(fn) {\n    var last = performance.now();\n    function frame(now) {\n      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));\n      last = now;\n      fn(dt);\n      requestAnimationFrame(frame);\n    }\n    requestAnimationFrame(frame);\n  }\n\n  /* Ограничение по времени: секунды справа вверху и полоска .timebar, если она есть */\n  function timeLimit(game, total, onEnd, bar) {\n    var fill = bar ? bar.querySelector('i') : animation:none!important;transition:none!important}}\n<\/style>\n<style>.seal{height:230px;display:grid;place-items:center;padding:0;background:radial-gradient(ellipse,#5e2448,#100c20 70%)}.seal svg{width:min(100%,230px);height:100%}.ring-controls{display:flex;flex-direction:column;gap:7px;width:100%;max-width:360px}.ring-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--lilac)}.ring-row button{width:56px;min-height:42px;padding:4px;font-size:22px}.seal .eye{fill:#100610;stroke:#FF9A6B;stroke-width:2}.seal .crack{stroke:#100c20;stroke-width:8}.seal line{stroke-linecap:round}@media(max-height:650px){.seal{height:160px}.ring-row button{min-height:36px}.ring-controls{gap:4px}}<\/style><\/head><body>\n<div class=\"stage horror\" id=\"stage\"><div class=\"play\">\n<div class=\"timebar\" id=\"timebar\"><i><\/i><\/div>\n<p class=\"case\">Архив запретных знаков / печать III<\/p><p class=\"instruction\">Поверни каждое кольцо, чтобы его светящаяся метка оказалась наверху.<\/p><div class=\"monitor seal\"><svg viewBox=\"0 0 240 240\" aria-hidden=\"true\"><path d=\"M120 8v16\" stroke=\"#3DF5B0\" stroke-width=\"3\"/><g id=\"rings\"><\/g><path class=\"eye\" d=\"M92 120q28-34 56 0q-28 34-56 0\"/><ellipse cx=\"120\" cy=\"120\" rx=\"5\" ry=\"13\" fill=\"#FF9A6B\"/><\/svg><\/div><div class=\"ring-controls\" id=\"ring-controls\"><\/div>\n<p class=\"readout\" id=\"message\" role=\"status\" aria-live=\"polite\">Продержись до конца минуты.<\/p>\n<\/div><\/div>\n<script>/* «Пауза»: общий скрипт всех игр.\n   Даёт игре связь с Telegram, рекорды, паузу, экраны меню и кнопку «Вызвать друга».\n   Этим же набором функций будут пользоваться сторонние разработчики. */\n(function () {\n  'use strict';\n\n  var BOT = 'Pauzagame_bot';\n  var PLAY_LINK = 'https://t.me/' + BOT + '/play';\n  var NIGHT = '#140734';\n  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n\n  function safe(fn, fallba f (!backHandler) postEvent('web_app_setup_back_button', { is_visible: false });\n  }\n\n  /* Кнопка «Назад» в шапке Telegram вместо крестика. back(fn) — показать, back(null) — спрятать */\n  var backHandler = null;\n  function back(fn) {\n    backHandler = fn || null;\n    postEvent('web_app_setup_back_button', { is_visible: !!backHandler });\n  }\n\n  /* Какую игру просили открыть по ссылке t.me/…/play?startapp=race */\n  function startParam() {\n    var fromQuery = safe(function () { return new URLSearchParams(location.search).get('tgWebAppStartParam'); }, null);\n    if (fromQuery) return fromQuery;\n    return safe(function () {\n      var data = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData');\n      return data ? new URLSearchParams(data).get('start_param') : null;\n    }, null);\n  }\n\n  function haptic(kind) {\n    if (!kind) return;\n    if (inTelegram) {\n      if (kind === 'crash') postEvent('web_app_trigger_haptic_feedback', { type: 'notification', notification_type: 'error' });\n      else if (kind === 'win') postEvent('web_app_trigger_haptic_feedback', { type: 'notification', notification_type: 'success' });\n      else if (kind === 'coin') postEvent('web_app_trigger_haptic_feedback', { type: 'selection_change' });\n      else postEvent('web_app_trigger_haptic_feedback', { type: 'impact', impact_style: 'light' });\n    } else if (kind === 'crash') {\n      safe(function () { if (navigator.vibrate) navigator.vibrate(80); });\n    }\n  }\n\n  /* «Вызвать друга»: в Telegram вставляет вызов в выбранный чат, в браузере копирует текст */\n  function share(gameId, phrase) {\n    if (postEvent('web_app_switch_inline_query', { query: gameId + ' ' + phrase, chat_types: ['users', 'groups'] })) {\n      return Promise.resolve('telegram');\n    }\n    var text = phrase + ' Побьёшь? ' + PLAY_LINK + '?startapp=' + gameId;\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      return navigator.clipboard.writeText(text).then(function ( lse && hashHasTg || !!window.TelegramWebviewProxy ||\n    safe(function () { return sessionStorage.getItem('pz_preview_tg') === '1'; }, false);\n\n  function postEvent(type, data) {\n    if (!inTelegram) return false;\n    var body = data || {};\n    try {\n      if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {\n        window.TelegramWebviewProxy.postEvent(type, JSON.stringify(body));\n        return true;\n      }\n      if (window.external && 'notify' in window.external) {\n        window.external.notify(JSON.stringify({ eventType: type, eventData: body }));\n        return true;\n      }\n      if (window.parent !== window) {\n        window.parent.postMessage(JSON.stringify({ eventType: type, eventData: body }), '*');\n        return true;\n      }\n    } catch (e) {}\n    return false;\n  }\n\n  function init() {\n    postEvent('web_app_ready');\n    postEvent('web_app_expand');\n    postEvent('web_app_setup_swipe_behavior', { allow_vertical_swipe: false });\n    postEvent('web_app_set_header_color', { color: NIGHT });\n    postEvent('web_app_set_background_color', { color: NIGHT });\n    postEvent('web_app_set_bottom_bar_color', { color: NIGHT });\n    /* Крестик Telegram сначала спрашивает «Закрыть?», а не выкидывает сразу */\n    postEvent('web_app_setup_closing_behavior', { need_confirmation: true });\n    if (!backHandler) postEvent('web_app_setup_back_button', { is_visible: false });\n  }\n\n  /* Кнопка «Назад» в шапке Telegram вместо крестика. back(fn) — показать, back(null) — спрятать */\n  var backHandler = null;\n  function back(fn) {\n    backHandler = fn || null;\n    postEvent('web_app_setup_back_button', { is_visible: !!backHandler });\n  }\n\n  /* Какую игру просили открыть по ссылке t.me/…/play?startapp=race */\n  function startParam() {\n    var fromQuery = safe(function () { return new URLSearchParams(location.search).get('tgWebAppStartParam'); }, null);\n    if (fromQuery) return fromQuery;\n    return safe(functio ta) : e.data; }, null);\n    if (d && d.eventType) receiveEvent(d.eventType, d.eventData);\n  });\n\n  /* Облачное хранилище Telegram: одно на пользователя и бота, видно со всех его устройств */\n  var reqSeq = 0, pending = {};\n  on('custom_method_invoked', function (d) {\n    var p = pending[d.req_id];\n    if (!p) return;\n    delete pending[d.req_id];\n    if (d.error) p.reject(new Error(d.error)); else p.resolve(d.result);\n  });\n  function invoke(method, params, timeoutMs) {\n    return new Promise(function (resolve, reject) {\n      var id = 'pz' + (++reqSeq) + '_' + Date.now();\n      pending[id] = { resolve: resolve, reject: reject };\n      if (!postEvent('web_app_invoke_custom_method', { req_id: id, method: method, params: params })) {\n        delete pending[id];\n        reject(new Error('no telegram'));\n        return;\n      }\n      setTimeout(function () { if (pending[id]) { delete pending[id]; reject(new Error('timeout')); } }, timeoutMs || 4000);\n    });\n  }\n  var cloud = {\n    get: function (keys) { return invoke('getStorageValues', { keys: keys }); },\n    set: function (key, value) { return invoke('saveStorageValue', { key: key, value: value }); }\n  };\n\n  /* ---------- Звёзды ----------\n     Покупки только для красоты: на очки и рекорды они не влияют. */\n  var BOT_API = 'https://pauza-bot.mofv231008.workers.dev';\n  var PRODUCTS = {\n    thanks: { stars: 15, title: 'Спасибо', perk: 'Значок ⭐ на экране выбора' },\n    gold: { stars: 75, title: 'Золотой набор', perk: 'Золотые машинка, самолётик, змейка и звездолёт, плюс значок ⭐' }\n  };\n  var perkCache = null;\n  function perks() {\n    if (!perkCache) {\n      var p = store.get('pz_preview_perks', {});\n      perkCache = p && typeof p === 'object' ? p : {};\n    }\n    return perkCache;\n  }\n  function grant(id) {\n    var p = perks();\n    if (!p[id]) p[id] = Date.now();\n    store.set('pz_preview_perks', p);\n    cloud.set('pz_preview_perks', JSON.stringify(p)).catch(function () {});\n  }\n  function gold() { return !!perks().gold; }\n  function supporter() { var p = perks(); return !!(p.gold || p.thanks); }\n  /* Подтягиваем покупки из облака: так они появляются на новом телефоне */\n  function syncPerks() {\n    if (!inTelegram) return Promise.resolve(perks());\n    return cloud.get(['pz_preview_perks']).then(function (res) {\n      var remote = safe(function () { return JSON.parse((res && res.pz_perks) || '{}') || {}; }, {});\n      var local = perks(), changed = false;\n      Object.keys(remote).forEach(function (k) { if (PRODUCTS[k] && !local[k]) { local[k] = remote[k]; changed = true; } });\n      if (changed) store.set('pz_preview_perks', local);\n      return local;\n    }, function () { return perks(); });\n  }\n  /* Окно оплаты Telegram. Ответ: 'paid', 'cancelled', 'failed' или 'pending' */\n  function buy(id) {\n    if (!PRODUCTS[id]) return Promise.reject(new Error('Такого набора нет.'));\n    if (!inTelegram) return Promise.reject(new Error('Оплата звёздами работает только внутри Telegram. Открой игру через @' + BOT + '.'));\n    return fetch(BOT_API + '/invoice?product=' + encodeURIComponent(id)).then(function (r) {\n      if (!r.ok) throw new Error('Сервер оплаты не ответил. Попробуй ещё раз через минуту.');\n      return r.json();\n    }, function () {\n      throw new Error('Нет связи с сервером оплаты. Проверь интернет и попробуй ещё раз.');\n    }).then(function (data) {\n      var m = /^https:\\/\\/t\\.me\\/(?:\\$|invoice\\/)([A-Za-z0-9_\\-=]+)$/.exec((data && data.link) || '');\n      if (!m) throw new Error('Не получилось создать счёт. Попробуй ещё раз через минуту.');\n      var slug = m[1];\n      return new Promise(function (resolve, reject) {\n        function closed(d) {\n          if (d.slug && d.slug !== slug) return;\n          off('invoice_closed', closed);\n          if (d.status === 'paid') { grant(id); haptic('win'); }\n          resolve(d.status || 'cancelled');\n        }\n        on('invoice_closed', closed);\n        if (!postEvent('web_app_open_invoice', { slug: slug })) {\n          off('invoice_closed', closed);\n          reject(new Error('Не получилось открыть окно оплаты.'));\n        }\n      });\n    });\n  }\n\n  /* ---------- Помощники для игр ---------- */\n\n  /* Скруглённые прямоугольники на старых телефонах (iOS 15 и раньше) */\n  if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {\n    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {\n      r = Math.max(0, Math.min(typeof r === 'number' ? r : (r && r[0]) || 0, Math.abs(w) / 2, Math.abs(h) / 2));\n      this.moveTo(x + r, y);\n      this.arcTo(x + w, y, x + w, y + h, r);\n      this.arcTo(x + w, y + h, x, y + h, r);\n      this.arcTo(x, y + h, x, y, r);\n      this.arcTo(x, y, x + w, y, r);\n      this.closePath();\n      return this;\n    };\n  }\n\n  /* Холст во всю сцену с учётом плотности пикселей. onResize(view) зовётся при каждом изменении размера. */\n  function canvas2d(canvas, stage, onResize) {\n    var ctx = canvas.getContext('2d');\n    var view = { ctx: ctx, W: 1, H: 1, dpr: 1 };\n    var ready = false;\n    function fit() {\n      var r = stage.getBoundingClientRect();\n      var w = Math.max(1, r.width), h = Math.max(1, r.height);\n      view.dpr = Math.min(window.devicePixelRatio || 1, 2.5);\n      canvas.width = Math.round(w * view.dpr); canvas.height = Math.round(h * view.dpr);\n      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);\n      var oldW = view.W, oldH = view.H;\n      view.W = w; view.H = h;\n      if (onResize && ready) onResize(view, oldW, oldH);\n    }\n    if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);\n    window.addEventListener('resize', fit);\n    fit();\n    /* Первый вызов onResize — после того, как игра получила view */\n    Promise.resolve().then(function () { ready = true; if (onResize) onResize(view, 1, 1); });\n    return view;\n  }\n\n  /* Игровой цикл: fn(dt) каждый кадр, dt в секундах, не больше 0,05 */\n  function loop(fn) {\n    var last = performance.now();\n    function frame(now) {\n      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));\n      last = now;\n      fn(dt);\n      requestAnimationFrame(frame);\n    }\n    requestAnimationFrame(frame);\n  }\n\n  /* Ограничение по времени: секунды справа вверху и полоска .timebar, если она есть */\n  function timeLimit(game, total, onEnd, bar) {\n    var fill = bar ? bar.querySelector('i') : null;\n    var t = { left: total, total: total };\n    function show() {\n      var warn = t.left <= Math.min(10, total / 4);\n      game.setSide(Math.ceil(t.left) + ' с', warn);\n      if (fill) {\n        fill.style.transform = 'scaleX(' + clamp(t.left / total, 0, 1).toFixed(4) + ')';\n        bar.classList.toggle('warn', warn);\n      }\n    }\n    t.reset = function () { t.left = total; show(); };\n    t.add = function (sec) {\n      t.left = clamp(t.left + sec, 0, total * 2); show();\n      if (t.left <= 0 && game.running) onEnd();\n    };\n    t.show = show;\n    loop(function (dt) {\n      if (!game.running || t.left <= 0) return;\n      t.left -= dt;\n      if (t.left <= 0) { t.left = 0; show(); onEnd(); } else show();\n    });\n    return t;\n  }\n\n  /* Тап и свайп по элементу. h.tap(x, y, e) в координатах элемента, h.swipe('left'|'right'|'up'|'down') */\n  function gestures(el, h) {\n    var start = null;\n    el.addEventListener('pointerdown', function (e) {\n      if (e.button > 0) return;\n      start = { x: e.clientX, y: e.clientY, t: Date.now() };\n      if (h.down) { var r = el.getBoundingClientRect(); h.down(e.clientX - r.left, e.clientY - r.top, e); }\n    });\n    el.addEventListener('pointerup', function (e) {\n      if (!start) return;\n      var dx = e.clientX - start.x, dy = e.clientY - start.y;\n      start = null;\n      if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {\n        if (h.swipe) h.swipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy
