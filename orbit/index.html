<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Орбита</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=5">
<style>.stage{background:#0E0526}</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="game" aria-label="Орбита. Нажимай, чтобы сменить орбиту"></canvas></div>
<script src="../shared/pauza.js?v=5"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['звезда', 'звезды', 'звёзд'], TOP = 70, ORB = [0.2, 0.3, 0.4];
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var ang = -Math.PI / 2, lane = 1, rad = 0.3, obj = [], parts = [], bg = [], score = 0, t = 0, spawnT = 0, dead = false, up = 1;

  var shell = P.shell({
    id: 'orbit', title: 'Орбита', tagline: 'Собирай звёзды, уворачивайся от метеоритов.',
    rulesHtml: '<p>Спутник сам летит по кругу вокруг планеты. Нажми — и он перескочит на соседнюю орбиту: сначала наружу, потом обратно внутрь. Собирай жёлтые звёзды и не врезайся в красные метеориты, которые летят навстречу. Скорость растёт.</p>',
    startLabel: 'На орбиту', countdown: true, overEyebrow: 'Спутник сбит',
    unit: function (n) { return P.plural(n, U); },
    kbdHint: 'На компьютере: пробел или стрелки, P — пауза',
    pauseKeys: ['KeyP', 'Escape'],
    onReset: reset
  });
  var view = P.canvas(canvas, stage, function () {
    bg = []; for (var i = 0; i < 70; i++) bg.push({ x: Math.random() * view.W, y: Math.random() * view.H, r: Math.random() * 1.2 + 0.3 });
  });
  function C() { return { x: view.W / 2, y: TOP + (view.H - TOP) / 2 }; }
  function B() { return Math.min(view.W, view.H - TOP); }
  function omega() { return 1.5 + Math.min(1.3, t * 0.025); }
  function reset() { ang = -Math.PI / 2; lane = 1; up = 1; rad = ORB[1]; obj = []; parts = []; score = 0; t = 0; spawnT = 0.6; dead = false; shell.setScore('0'); }
  function hop() {
    if (!shell.running || dead) return;
    if (lane === ORB.length - 1) up = -1; else if (lane === 0) up = 1;
    lane += up; P.haptic('tap');
  }
  function spawn() {
    var meteor = Math.random() < Math.min(0.62, 0.42 + t * 0.006);
    var a = ang + Math.PI * (0.7 + Math.random() * 0.6);
    obj.push({ a: a, lane: P.rand(ORB.length), kind: meteor ? 'm' : 's', w: meteor ? -(0.35 + Math.random() * 0.5) : 0, life: meteor ? 7 : 9 });
    if (meteor && t > 15 && Math.random() < 0.35) {
      var l2 = P.rand(ORB.length);
      obj.push({ a: a + 0.25, lane: l2, kind: 'm', w: obj[obj.length - 1].w, life: 7 });
    }
  }
  function posOf(a, r) { var c = C(); return { x: c.x + Math.cos(a) * r * B(), y: c.y + Math.sin(a) * r * B() }; }
  P.loop(function (dt) {
    if (shell.running && !dead) {
      t += dt;
      ang += omega() * dt;
      rad += (ORB[lane] - rad) * Math.min(1, dt * 14);
      spawnT -= dt;
      if (spawnT <= 0) { spawn(); spawnT = Math.max(0.45, 1.05 - t * 0.012); }
      var me = posOf(ang, rad), hitR = B() * 0.045;
      obj.forEach(function (o) {
        o.a += o.w * dt; o.life -= dt;
        var p = posOf(o.a, ORB[o.lane]);
        if (o.life > 0 && Math.hypot(p.x - me.x, p.y - me.y) < hitR) {
          if (o.kind === 's') {
            o.life = 0; score++; shell.setScore(String(score)); P.haptic('coin');
            for (var i = 0; i < 8; i++) { var a = Math.random() * Math.PI * 2; parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90, life: 0.4, col: '#FFD84D' }); }
          } else if (!dead) {
            dead = true; P.haptic('crash');
            for (var j = 0; j < 24; j++) { var b = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 140; parts.push({ x: me.x, y: me.y, vx: Math.cos(b) * sp, vy: Math.sin(b) * sp, life: 0.8, col: '#FF6B4A' }); }
            shell.end({ score: score, delay: 800, stats: 'на орбите ' + Math.round(t) + ' с', phrase: 'В «Орбите» я собираю ' + score + ' ' + P.plural(score, U) + '. Обгонишь?' });
          }
        }
      });
      obj = obj.filter(function (o) { return o.life > 0; });
    }
    parts.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
    parts = parts.filter(function (p) { return p.life > 0; });
    draw();
  });
  function star(ctx, x, y, r) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
  }
  function draw() {
    var ctx = view.ctx, W = view.W, H = view.H, c = C(), b = B();
    ctx.fillStyle = '#0E0526'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#F4F1FF'; ctx.globalAlpha = 0.45;
    bg.forEach(function (s) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); });
    ctx.globalAlpha = 1;
    ORB.forEach(function (r, i) { ctx.strokeStyle = i === lane ? 'rgba(61,245,176,.35)' : 'rgba(185,168,240,.18)'; ctx.lineWidth = 2; ctx.setLineDash([4, 8]); ctx.beginPath(); ctx.arc(c.x, c.y, r * b, 0, Math.PI * 2); ctx.stroke(); });
    ctx.setLineDash([]);
    var g = ctx.createRadialGradient(c.x - b * 0.03, c.y - b * 0.03, b * 0.01, c.x, c.y, b * 0.11);
    g.addColorStop(0, '#6FD3FF'); g.addColorStop(1, '#3B1E8C');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, b * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,138,216,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(c.x, c.y, b * 0.15, b * 0.035, -0.3, 0, Math.PI * 2); ctx.stroke();
    obj.forEach(function (o) {
      var p = posOf(o.a, ORB[o.lane]);
      ctx.globalAlpha = Math.min(1, o.life * 2);
      if (o.kind === 's') { ctx.fillStyle = '#FFD84D'; star(ctx, p.x, p.y, b * 0.026); }
      else {
        var dx = Math.sin(o.a), dy = -Math.cos(o.a);
        ctx.fillStyle = 'rgba(255,107,74,.3)'; ctx.beginPath(); ctx.arc(p.x - dx * b * 0.034, p.y - dy * b * 0.034, b * 0.014, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,107,74,.15)'; ctx.beginPath(); ctx.arc(p.x - dx * b * 0.06, p.y - dy * b * 0.06, b * 0.01, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FF6B4A'; ctx.beginPath(); ctx.arc(p.x, p.y, b * 0.024, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#C0392B'; ctx.beginPath(); ctx.arc(p.x + b * 0.006, p.y - b * 0.005, b * 0.007, 0, Math.PI * 2); ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
    parts.forEach(function (p) { ctx.globalAlpha = Math.min(1, p.life * 2.5); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); });
    ctx.globalAlpha = 1;
    if (!dead) {
      var me = posOf(ang, rad);
      ctx.save(); ctx.translate(me.x, me.y); ctx.rotate(ang + Math.PI / 2);
      ctx.fillStyle = '#B9A8F0'; ctx.fillRect(-b * 0.035, -b * 0.008, b * 0.07, b * 0.016);
      ctx.fillStyle = P.gold() ? '#FFD84D' : '#3DF5B0'; ctx.beginPath(); ctx.roundRect(-b * 0.014, -b * 0.016, b * 0.028, b * 0.032, 4); ctx.fill();
      ctx.restore();
    }
  }
  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); hop(); });
  window.addEventListener('keydown', function (e) {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].indexOf(e.code) === -1) return;
    e.preventDefault(); if (!e.repeat) hop();
  });
})();
</script>
</body>
</html>
