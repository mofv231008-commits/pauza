<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101119">
  <meta name="color-scheme" content="dark">
  <title>Пауза · Манекен</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../shared/pauza.css?v=6">
  <link rel="stylesheet" href="tunnel.css?v=1">
</head>
<body>
  <main class="stage tunnel">
    <div class="tunnel-layout">
      <div class="corridor">
        <canvas id="corridor" aria-label="Тоннель от первого лица. Проведи по экрану, чтобы повернуться."></canvas>
        <div class="exit-direction" aria-label="Направление к выходу">
          <span id="exit-arrow" aria-hidden="true">↑</span> Выход
        </div>
      </div>
      <div class="tunnel-panel">
        <div class="tunnel-status" id="tunnel-status">Прислушайся</div>
        <div class="tunnel-controls" role="group" aria-label="Управление">
          <button class="turn-left" id="turn-left" aria-label="Поворот влево" type="button">↶</button>
          <div class="walk">
            <button id="forward" aria-label="Шаг вперёд" type="button">↑</button>
            <button id="backward" aria-label="Шаг назад" type="button">↓</button>
          </div>
          <button class="turn-right" id="turn-right" aria-label="Поворот вправо" type="button">↷</button>
          <button class="flashlight" id="flashlight" aria-pressed="true" type="button">Фонарь</button>
        </div>
      </div>
    </div>
  </main>
  <script src="../shared/pauza.js?v=6"></script>
  <script src="model.js?v=1"></script>
  <script src="scene.js?v=1"></script>
  <script src="tunnel.js?v=1"></script>
</body>
</html>
