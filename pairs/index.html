<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Пары</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=3">
<style>
/* Сетка 4×4 из карточек, которые переворачиваются по тапу */
.grid{--size:340px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;width:var(--size);height:var(--size);flex:none}
.pcard{position:relative;display:block;min-width:0;padding:0;border:0;background:none;cursor:pointer;perspective:600px;border-radius:14px}
.pcard-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .26s ease}
.pcard.open .pcard-in,.pcard.done .pcard-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.f-back{background:var(--night)}
.face.f-back .bars i{width:5px;height:20px;opacity:.55}
.face.f-front{background:var(--shoulder);transform:rotateY(180deg)}
.face.f-front svg{display:block;width:58%;height:58%}
.pcard.done .face.f-front{border-color:var(--mint);background:rgba(61,245,176,.12)}
.pairs-hint{margin:0;font-size:14px;color:var(--lilac)}
.stage[data-state="paused"] .grid{visibility:hidden}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="play">
    <div class="grid" id="grid"></div>
    <p class="pairs-hint" id="hint">Найдено 0 из 8</p>
  </div>
</div>

<script src="../shared/pauza.js?v=3"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var MOVES = ['ход', 'хода', 'ходов'];
  var SHAPES = [
    { name: 'круг', svg: '<circle cx="20" cy="20" r="13" fill="#3DF5B0"/>' },
    { name: 'квадрат', svg: '<rect x="8" y="8" width="24" height="24" rx="4" fill="#FF6B4A"/>' },
    { name: 'треугольник', svg: '<path d="M20 6 L35 32 H5 Z" fill="#FFD84D" stroke="#FFD84D" stroke-width="3" stroke-linejoin="round"/>' },
    { name: 'ромб', svg: '<path d="M20 4 L36 20 L20 36 L4 20 Z" fill="#B9A8F0"/>' },
    { name: 'звезда', svg: '<path d="M20 6 L23.82 15.74 L34.27 16.36 L26.18 23.01 L28.82 33.14 L20 27.5 L11.18 33.14 L13.82 23.01 L5.73 16.36 L16.18 15.74 Z" fill="#F4F1FF"/>' },
    { name: 'сердце', svg: '<path d="M20 34 C6 24 4 15 9.5 10.5 C13.5 7.2 18 8.8 20 12.5 C22 8.8 26.5 7.2 30.5 10.5 C36 15 34 24 20 34 Z" fill="#FF8AD8"/>' },
    { name: 'плюс', svg: '<path d="M16 6 h8 v10 h10 v8 h-10 v10 h-8 v-10 h-10 v-8 h10 Z" fill="#6FD3FF"/>' },
    { name: 'кольцо', svg: '<circle cx="20" cy="20" r="11" fill="none" stroke="#FF9A6B" stroke-width="7"/>' }
  ];

  var stage = document.getElementById('stage'), gridEl = document.getElementById('grid'), hintEl = document.getElementById('hint');
  var cards = [], open = [], moves = 0, found = 0, elapsed = 0, closeTimer = 0;

  var shell = P.shell({
    id: 'pairs',
    title: 'Пары',
    tagline: 'Найди все одинаковые карточки.',
    rulesHtml: '<p>Открывай по две карточки. Совпали — остаются открытыми. В зачёт идёт число ходов: чем меньше, тем лучше.</p>',
    overEyebrow: 'Все пары найдены',
    overTone: 'good',
    lowerIsBetter: true,
    formatScore: function (n) { return String(n); },
    unit: function (n) { return P.plural(n, MOVES); },
    onReset: reset
  });

  function shuffle(list) {
    for (var i = list.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0, tmp = list[i];
      list[i] = list[j]; list[j] = tmp;
    }
    return list;
  }
  function build(deck) {
    gridEl.textContent = '';
    cards = deck.map(function (shapeIndex, i) {
      var shape = SHAPES[shapeIndex];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pcard';
      btn.id = 'card-' + i;
      btn.setAttribute('aria-label', 'Закрытая карточка ' + (i + 1));
      btn.innerHTML = '<span class="pcard-in"><span class="face f-back"><span class="bars"><i></i><i></i></span></span>' +
        '<span class="face f-front"><svg viewBox="0 0 40 40" aria-hidden="true">' + shape.svg + '</svg></span></span>';
      var card = { el: btn, shape: shapeIndex, index: i, done: false };
      btn.addEventListener('click', function () { flip(card); });
      gridEl.appendChild(btn);
      return card;
    });
  }
  function deal() {
    var deck = [];
    for (var i = 0; i < SHAPES.length; i++) deck.push(i, i);
    build(shuffle(deck));
  }
  function reset() {
    clearTimeout(closeTimer);
    open = []; moves = 0; found = 0; elapsed = 0;
    deal();
    shell.setScore('0');
    shell.setSide(P.clock(0));
    hintEl.textContent = 'Найдено 0 из ' + SHAPES.length;
  }
  function show(card, isOpen) {
    card.el.classList.toggle('open', isOpen);
    card.el.setAttribute('aria-label', isOpen || card.done ? 'Карточка: ' + SHAPES[card.shape].name : 'Закрытая карточка ' + (card.index + 1));
  }
  function closeOpen() {
    clearTimeout(closeTimer);
    open.forEach(function (c) { show(c, false); });
    open = [];
  }
  function flip(card) {
    if (!shell.running || card.done || open.indexOf(card) !== -1) return;
    /* Третий тап не ждёт, пока две несовпавшие карточки закроются сами */
    if (open.length === 2) closeOpen();
    open.push(card);
    show(card, true);
    P.haptic('tap');
    if (open.length < 2) return;
    moves++;
    shell.setScore(String(moves));
    var a = open[0], b = open[1];
    if (a.shape === b.shape) {
      a.done = b.done = true;
      a.el.classList.add('done'); b.el.classList.add('done');
      show(a, true); show(b, true);
      open = [];
      found++;
      hintEl.textContent = 'Найдено ' + found + ' из ' + SHAPES.length;
      P.haptic('coin');
      if (found === SHAPES.length) finish();
    } else {
      closeTimer = setTimeout(closeOpen, 850);
    }
  }
  function finish() {
    shell.end({
      score: moves,
      delay: 550,
      haptic: 'win',
      stats: 'время: ' + P.clock(elapsed),
      phrase: 'У меня все пары за ' + moves + ' ' + P.plural(moves, MOVES) + '.'
    });
  }

  var last = performance.now();
  function tick(now) {
    var dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    if (shell.running) { elapsed += dt; shell.setSide(P.clock(elapsed)); }
    requestAnimationFrame(tick);
  }
  function layout() {
    var r = stage.getBoundingClientRect();
    var size = Math.max(200, Math.min(r.width - 32, r.height - 230, 400));
    gridEl.style.setProperty('--size', Math.floor(size) + 'px');
  }

  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
  window.addEventListener('resize', layout);

  layout();
  deal();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
