  var order = [], pos = 0;
  PauzaQuiz({
    id: 'emojikino', title: 'Кино в эмодзи', tagline: 'Три эмодзи — один фильм.',
    rules: '<p>По трём эмодзи угадай фильм или мультфильм. Выбери из четырёх вариантов. Ошибка — минус 3 секунды. На всё 60 секунд.</p>',
    unit: ['фильм', 'фильма', 'фильмов'], sub: 'Что это за фильм?',
    onReset: function () { order = P.shuffle(M.map(function (_, i) { return i; })); pos = 0; },
    next: function () {
      if (!order.length || pos >= order.length) { order = P.shuffle(M.map(function (_, i) { return i; })); pos = 0; }
      var m = M[order[pos++]], others = P.shuffle(M.filter(function (x) { return x !== m; })).slice(0, 3).map(function (x) { return x[1]; });
      var opts = P.shuffle([m[1]].concat(others));
      return { q: m[0], opts: opts, right: opts.indexOf(m[1]), cls: 'emoji' };
    },
    phrase: function (s) { return 'В «Кино в эмодзи» я угадал ' + s + ' фильмов за минуту. Обгонишь?'; }
  });
