<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Пенальти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>.stage{background:#140734}</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="game" aria-label="Пенальти. Веди пальцем в точку ворот и отпусти"></canvas></div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['гол', 'гола', 'голов'], TOP = 70, MISSES = 3;
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var G = null, home = { x: 0, y: 0 }, br = 12, aim = null, shot = null, keeper = null, goals = 0, misses = 0, shots = 0, msg = null, kbAim = null;

  var shell = P.shell({
    id: 'penalty', title: 'Пенальти', tagline: 'Переиграй вратаря. Три промаха — конец.',
    rulesHtml: '<p>Веди пальцем по экрану: жёлтый прицел показывает, куда полетит мяч. Отпусти — удар. В углы вратарю тянуться тяжелее, но там легко промазать мимо штанги. Вратарь учится и угадывает всё чаще. Три промаха или сейва — конец серии.</p>',
    startLabel: 'К мячу', countdown: false, overEyebrow: 'Серия окончена',
    unit: function (n) { return P.plural(n, U); },
    kbdHint: 'На компьютере: стрелки — прицел, пробел — удар, P — пауза',
    pauseKeys: ['KeyP', 'Escape'],
    onReset: reset
  });
  var view = P.canvas(canvas, stage, function () {
    var W = view.W, H = view.H, gw = Math.min(W * 0.86, 420);
    G = { x: (W - gw) / 2, y: TOP + Math.max(30, (H - TOP) * 0.12), w: gw, h: gw * 0.38 };
    home = { x: W / 2, y: H - Math.max(70, H * 0.12) };
    br = Math.min(W, H) * 0.035;
    if (!keeper) newKick();
  });
  function reset() { goals = 0; misses = 0; shots = 0; msg = null; aim = null; kbAim = null; if (G) newKick(); shell.setScore('0'); side(); }
  function side() { var s = ''; for (var i = 0; i < MISSES; i++) s += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:3px;background:' + (i < MISSES - misses ? '#3DF5B0' : 'rgba(185,168,240,.3)') + '"></span>'; shell.setSide(s); }
  function newKick() { shot = null; keeper = { x: G.x + G.w / 2, y: G.y + G.h * 0.55, tx: G.x + G.w / 2, ty: G.y + G.h * 0.55, dive: 0, t: 0 }; }
  function kick(tx, ty) {
    if (!shell.running || shot) return;
    ty = Math.min(ty, G.y + G.h - br * 0.7);
    var err = G.w * 0.03, ex = tx + (Math.random() + Math.random() - 1) * err, ey = ty + (Math.random() + Math.random() - 1) * err;
    shot = { sx: home.x, sy: home.y, x: ex, y: ey, t: 0, dur: 0.55, done: false };
    shots++;
    var cx = G.x + G.w / 2, zone = function (x) { return x < G.x + G.w * 0.36 ? -1 : x > G.x + G.w * 0.64 ? 1 : 0; };
    var smart = Math.random() < Math.min(0.72, 0.32 + goals * 0.03), z = smart ? zone(ex) : P.pick([-1, 0, 1].filter(function (q) { return q !== zone(ex); }));
    if (smart) { keeper.tx = P.clamp(ex, G.x + G.w * 0.2, G.x + G.w * 0.8); keeper.ty = P.clamp(ey, G.y + G.h * 0.3, G.y + G.h * 0.72); }
    else { keeper.tx = cx + z * G.w * 0.3; keeper.ty = G.y + G.h * (0.4 + Math.random() * 0.3); }
    keeper.dive = keeper.tx === cx ? 0 : Math.sign(keeper.tx - cx); keeper.t = 0;
    P.haptic('tap');
  }
  function judge() {
    var x = shot.x, y = shot.y, post = br * 0.5;
    var inGoal = x > G.x + post && x < G.x + G.w - post && y > G.y + post && y < G.y + G.h;
    var hw = keeper.dive ? G.w * (0.17 + Math.min(0.04, goals * 0.004)) : G.w * 0.11, hh = keeper.dive ? G.h * 0.22 : G.h * 0.46;
    var saved = Math.abs(x - keeper.x) < hw && Math.abs(y - keeper.y) < hh;
    var text;
    if (!inGoal) { var nearPost = Math.abs(x - G.x) < br || Math.abs(x - G.x - G.w) < br || Math.abs(y - G.y) < br; text = nearPost ? 'Штанга!' : 'Мимо!'; }
    else if (saved) text = 'Сейв!';
    else text = y < G.y + G.h * 0.3 && (x < G.x + G.w * 0.2 || x > G.x + G.w * 0.8) ? 'В девятку!' : 'ГОЛ!';
    if (inGoal && !saved) { goals++; shell.setScore(String(goals)); P.haptic('win'); }
    else { misses++; side(); P.haptic('crash'); }
    msg = { text: text, good: inGoal && !saved, life: 1.1 };
    if (misses >= MISSES) { shell.end({ score: goals, delay: 1000, stats: 'ударов: ' + shots, phrase: 'В «Пенальти» я забиваю ' + goals + ' ' + P.plural(goals, U) + ' подряд вратарю. Переиграешь?' }); return; }
    setTimeout(function () { if (shell.running) newKick(); }, 1100);
  }
  P.loop(function (dt) {
    if (!G) return;
    if (shell.running && shot && !shot.done) {
      shot.t += dt; keeper.t += dt;
      var k = P.clamp((keeper.t - 0.08) / 0.4, 0, 1), e = 1 - Math.pow(1 - k, 3), c0 = G.x + G.w / 2, cy = G.y + G.h * 0.55;
      keeper.x = c0 + (keeper.tx - c0) * e; keeper.y = cy + (keeper.ty - cy) * e;
      if (shot.t >= shot.dur) { shot.t = shot.dur; shot.done = true; judge(); }
    }
    if (msg) { msg.life -= dt; if (msg.life <= 0) msg = null; }
    draw();
  });
  function draw() {
    var ctx = view.ctx, W = view.W, H = view.H;
    ctx.fillStyle = '#140734'; ctx.fillRect(0, 0, W, H);
    if (!G) return;
    var gy = G.y + G.h;
    ctx.fillStyle = '#138A5E'; ctx.beginPath(); ctx.moveTo(G.x - G.w * 0.25, gy); ctx.lineTo(G.x + G.w * 1.25, gy); ctx.lineTo(W + 40, H); ctx.lineTo(-40, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.05)'; for (var s = 0; s < 6; s++) { var y0 = gy + (H - gy) * s / 6; ctx.fillRect(0, y0, W, (H - gy) / 12); }
    ctx.strokeStyle = 'rgba(244,241,255,.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(G.x - G.w * 0.15, gy); ctx.lineTo(G.x - G.w * 0.3, gy + (H - gy) * 0.35); ctx.lineTo(G.x + G.w * 1.3, gy + (H - gy) * 0.35); ctx.lineTo(G.x + G.w * 1.15, gy); ctx.stroke();
    ctx.fillStyle = '#F4F1FF'; ctx.beginPath(); ctx.ellipse(home.x, home.y + br * 0.6, br * 0.6, br * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(244,241,255,.08)'; ctx.fillRect(G.x, G.y, G.w, G.h);
    ctx.strokeStyle = 'rgba(244,241,255,.22)'; ctx.lineWidth = 1;
    for (var nx = G.x; nx <= G.x + G.w; nx += G.w / 14) { ctx.beginPath(); ctx.moveTo(nx, G.y); ctx.lineTo(nx, gy); ctx.stroke(); }
    for (var ny = G.y; ny <= gy; ny += G.h / 6) { ctx.beginPath(); ctx.moveTo(G.x, ny); ctx.lineTo(G.x + G.w, ny); ctx.stroke(); }
    var kp = keeper || { x: G.x + G.w / 2, y: G.y + G.h * 0.55, dive: 0 }, ang = keeper ? (keeper.x - (G.x + G.w / 2)) / (G.w * 0.3) * 1.2 : 0;
    ctx.save(); ctx.translate(kp.x, kp.y); ctx.rotate(P.clamp(ang, -1.3, 1.3));
    var kh = G.h * 0.8, kw = G.w * 0.09;
    ctx.fillStyle = '#FF6B4A'; ctx.beginPath(); ctx.roundRect(-kw / 2, -kh * 0.35, kw, kh * 0.55, 6); ctx.fill();
    ctx.fillStyle = '#120630'; ctx.fillRect(-kw / 2, kh * 0.18, kw * 0.42, kh * 0.32); ctx.fillRect(kw * 0.08, kh * 0.18, kw * 0.42, kh * 0.32);
    ctx.strokeStyle = '#FF6B4A'; ctx.lineWidth = kw * 0.3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-kw * 0.4, -kh * 0.28); ctx.lineTo(-kw * 1.3, -kh * 0.55); ctx.moveTo(kw * 0.4, -kh * 0.28); ctx.lineTo(kw * 1.3, -kh * 0.55); ctx.stroke();
    ctx.fillStyle = '#FFD84D'; ctx.beginPath(); ctx.arc(-kw * 1.35, -kh * 0.58, kw * 0.28, 0, Math.PI * 2); ctx.arc(kw * 1.35, -kh * 0.58, kw * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFD0C4'; ctx.beginPath(); ctx.arc(0, -kh * 0.48, kw * 0.38, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#F4F1FF'; ctx.lineWidth = 6; ctx.lineCap = 'square'; ctx.beginPath(); ctx.moveTo(G.x, gy); ctx.lineTo(G.x, G.y); ctx.lineTo(G.x + G.w, G.y); ctx.lineTo(G.x + G.w, gy); ctx.stroke();
    var target = aim || kbAim;
    if (target && !shot) {
      ctx.strokeStyle = 'rgba(255,216,77,.5)'; ctx.setLineDash([5, 7]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(home.x, home.y); ctx.lineTo(target.x, target.y); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = '#FFD84D'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(target.x, target.y, br * 0.9, 0, Math.PI * 2); ctx.stroke();
    }
    var bx = home.x, by = home.y, sc = 1;
    if (shot) { var q = shot.t / shot.dur, qe = 1 - Math.pow(1 - q, 2); bx = shot.sx + (shot.x - shot.sx) * qe; by = shot.sy + (shot.y - shot.sy) * qe - Math.sin(q * Math.PI) * G.h * 0.25; sc = 1 - q * 0.5; }
    ctx.fillStyle = P.gold() ? '#FFD84D' : '#F4F1FF'; ctx.beginPath(); ctx.arc(bx, by, br * sc, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#120630'; ctx.beginPath(); ctx.arc(bx, by, br * sc * 0.35, 0, Math.PI * 2); ctx.fill();
    if (msg) { ctx.globalAlpha = Math.min(1, msg.life * 2); ctx.fillStyle = msg.good ? '#3DF5B0' : '#FF6B4A'; ctx.font = '800 30px Unbounded, "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(msg.text, W / 2, gy + (H - gy) * 0.45); ctx.globalAlpha = 1; }
  }
  function pos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: Math.min(e.clientY - r.top, home.y - br * 3) }; }
  canvas.addEventListener('pointerdown', function (e) { if (!shell.running || shot) return; aim = pos(e); });
  canvas.addEventListener('pointermove', function (e) { if (aim) aim = pos(e); });
  canvas.addEventListener('pointerup', function () { if (!aim) return; var a = aim; aim = null; kick(a.x, a.y); });
  canvas.addEventListener('pointercancel', function () { aim = null; });
  P.arrows(function (d) {
    if (!shell.running || shot || !G) return;
    if (!kbAim) kbAim = { x: G.x + G.w / 2, y: G.y + G.h / 2 };
    var sx = G.w * 0.06, sy = G.h * 0.15;
    if (d === 'left') kbAim.x -= sx; if (d === 'right') kbAim.x += sx; if (d === 'up') kbAim.y -= sy; if (d === 'down') kbAim.y += sy;
  });
  window.addEventListener('keydown', function (e) { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); if (shell.running && !shot && G) { var a = kbAim || { x: G.x + G.w / 2, y: G.y + G.h / 2 }; kick(a.x, a.y); } } });
})();
</script>
</body>
</html>
