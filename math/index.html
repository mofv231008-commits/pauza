<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Счёт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>
/* Пример по центру, под ним две большие кнопки: слева «Неверно», справа «Верно» */
.stage{background:var(--shoulder)}
.play{justify-content:space-between;gap:20px}
.eq-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-width:0;text-align:center}
.eq{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(30px,10.5vw,46px);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.eq.bad{animation:eq-shake .28s ease-out}
@keyframes eq-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}60%{transform:translateX(8px)}}
.eq-sub{margin:0;min-height:1.45em;font-size:15px;color:var(--lilac)}
/* Отклик на ответ живёт у шкалы времени, а не под примером: под примером он читался бы как подсказка к новому */
.fb{margin:-10px 0 0;width:100%;max-width:400px;min-height:22px;text-align:right;font-family:var(--font-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;opacity:0}
.fb.good{color:var(--mint);animation:fb-fade .7s ease-out}
.fb.bad{color:var(--coral);animation:fb-fade 1.1s ease-out}
@keyframes fb-fade{0%{opacity:1;transform:translateY(4px)}70%{opacity:1;transform:translateY(0)}100%{opacity:0}}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:400px}
.ans{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:112px;min-width:0;padding:12px;
  border-radius:22px;border:2px solid transparent;cursor:pointer;
  font-family:var(--font-display);font-weight:600;font-size:16px;
}
.ans svg{display:block;width:30px;height:30px}
.ans-no{background:transparent;border-color:var(--coral);color:var(--coral)}
.ans-yes{background:var(--mint);color:var(--ink)}
.ans:active{transform:translateY(2px)}
.stage[data-state="paused"] .eq,.stage[data-state="countdown"] .eq{visibility:hidden}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="play">
    <div class="timebar" id="timebar"><i id="timeFill"></i></div>
    <p class="fb" id="fb" role="status"></p>
    <div class="eq-wrap">
      <p class="eq" id="eq">7 × 8 = 54</p>
      <p class="eq-sub" id="eqSub">Верно или нет?</p>
    </div>
    <div class="answers">
      <button class="ans ans-no" id="btnNo" type="button">
        <svg viewBox="0 0 30 30" aria-hidden="true"><path d="M7 7 L23 23 M23 7 L7 23" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/></svg>
        Неверно
      </button>
      <button class="ans ans-yes" id="btnYes" type="button">
        <svg viewBox="0 0 30 30" aria-hidden="true"><path d="M5 16 L12 23 L25 8" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        Верно
      </button>
    </div>
  </div>
</div>

<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var DURATION = 45, PENALTY = 3;
  var EXAMPLES = ['пример', 'примера', 'примеров'];

  var eqEl = document.getElementById('eq'), fbEl = document.getElementById('fb');
  var timebar = document.getElementById('timebar'), timeFill = document.getElementById('timeFill');

  var score = 0, errors = 0, left = DURATION, question = null, flashTimer = 0;

  var shell = P.shell({
    id: 'math',
    title: 'Счёт',
    tagline: 'Верно решён пример или нет?',
    rulesHtml: '<p>На всё 45 секунд. Каждый правильный ответ идёт в счёт, а ошибка отнимает 3 секунды. Примеры постепенно усложняются.</p>',
    overEyebrow: 'Время вышло',
    countdown: true,
    formatScore: function (n) { return String(n); },
    unit: function (n) { return P.plural(n, EXAMPLES); },
    kbdHint: 'На компьютере: ← неверно, → верно, пробел — пауза',
    onReset: reset,
    onRun: function (isResume) { if (!isResume || !question) next(); }
  });

  function say(text, tone) {
    fbEl.textContent = text;
    fbEl.className = 'fb';
    void fbEl.offsetWidth;
    if (tone) fbEl.className = 'fb ' + tone;
  }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  /* Чем больше решено, тем крупнее числа и тем чаще умножение и деление */
  function make(solved) {
    var roll = Math.random(), type;
    if (solved < 5) type = roll < 0.5 ? 'add' : 'sub';
    else if (solved < 12) type = roll < 0.35 ? 'add' : roll < 0.7 ? 'sub' : 'mul';
    else type = roll < 0.25 ? 'add' : roll < 0.5 ? 'sub' : roll < 0.8 ? 'mul' : 'div';
    var big = solved < 5 ? 10 : solved < 12 ? 30 : solved < 22 ? 60 : 99;
    var table = solved < 12 ? 6 : 9;
    var a, b, c, sign;
    if (type === 'add') { a = rnd(2, big); b = rnd(2, big); c = a + b; sign = '+'; }
    else if (type === 'sub') { a = rnd(4, big + 6); b = rnd(1, a - 1); c = a - b; sign = '−'; }
    else if (type === 'mul') { a = rnd(2, table); b = rnd(2, 9); c = a * b; sign = '×'; }
    else { b = rnd(2, 9); c = rnd(2, table); a = b * c; sign = ':'; }
    var truth = Math.random() < 0.5, shown = c;
    if (!truth) {
      var deltas = [1, -1, 2, -2, 10, -10];
      if (type === 'mul') deltas.push(a, -a, b, -b);
      do { shown = c + deltas[rnd(0, deltas.length - 1)]; } while (shown === c || shown < 0);
    }
    return { text: a + ' ' + sign + ' ' + b + ' = ' + shown, truth: truth };
  }
  function next() {
    var prev = question ? question.text : '';
    do { question = make(score); } while (question.text === prev);
    eqEl.textContent = question.text;
  }
  function reset() {
    clearTimeout(flashTimer);
    score = 0; errors = 0; left = DURATION; question = null;
    eqEl.className = 'eq';
    say('', '');
    shell.setScore('0');
    showTime();
  }
  function answer(saysTrue) {
    if (!shell.running || !question) return;
    var right = saysTrue === question.truth;
    clearTimeout(flashTimer);
    eqEl.className = 'eq';
    if (right) {
      score++;
      shell.setScore(String(score));
      say('+1', 'good');
      P.haptic('coin');
    } else {
      errors++;
      left = Math.max(0, left - PENALTY);
      say('Ошибка: −' + PENALTY + ' с', 'bad');
      void eqEl.offsetWidth;
      eqEl.className = 'eq bad';
      P.haptic('crash');
    }
    flashTimer = setTimeout(function () { eqEl.className = 'eq'; }, 300);
    next();
    showTime();
  }
  function finish() {
    shell.end({
      score: score,
      stats: 'ошибок: ' + errors,
      phrase: 'Мой результат в «Счёте» — ' + score + ' ' + P.plural(score, EXAMPLES) + ' за 45 секунд.'
    });
  }
  function showTime() {
    var warn = left <= 10;
    shell.setSide(Math.ceil(left) + ' с', warn);
    timeFill.style.transform = 'scaleX(' + P.clamp(left / DURATION, 0, 1).toFixed(4) + ')';
    timebar.classList.toggle('warn', warn);
  }

  var last = performance.now();
  function tick(now) {
    var dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    if (shell.running) {
      left -= dt;
      if (left <= 0) { left = 0; showTime(); finish(); }
      else showTime();
    }
    requestAnimationFrame(tick);
  }

  document.getElementById('btnNo').addEventListener('click', function () { answer(false); });
  document.getElementById('btnYes').addEventListener('click', function () { answer(true); });
  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); answer(false); }
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); answer(true); }
  });

  showTime();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
