<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Солитёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>

</style>
</head>
<body>
<div class="stage" id="stage">
<canvas id="game" aria-label="Солитёр. Нажми фишку, потом пустую лунку через одну"></canvas>
</div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['фишка', 'фишки', 'фишек'];
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var b = [], sel = null, hist = [], S = 1, done = false, anim = null;
  var shell = P.shell({
    id: 'pegs', title: 'Солитёр', tagline: 'Классика: 32 фишки и одна пустая лунка.',
    rulesHtml: '<p>Фишка перепрыгивает через соседнюю в пустую лунку — перепрыгнутая уходит с доски. Прыгать можно только по прямой. Цель — оставить как можно меньше фишек. Идеал — одна в центре. Кнопкой «Назад ход» можно отменить.</p>',
    overEyebrow: 'Ходов больше нет', countdown: false, lowerIsBetter: true,
    unit: function (n) { return P.plural(n, U); }, onReset: reset
  });
  var view = P.canvas(canvas, stage, function () { S = P.clamp(view.W / 390, 0.8, 1.3); });
  function hole(x, y) { return x >= 0 && y >= 0 && x < 7 && y < 7 && ((x >= 2 && x <= 4) || (y >= 2 && y <= 4)); }
  function reset() { b = []; for (var y = 0; y < 7; y++) { b.push([]); for (var x = 0; x < 7; x++) b[y].push(hole(x, y) ? 1 : -1); } b[3][3] = 0; sel = null; hist = []; done = false; upd(); }
  function left() { var n = 0; b.forEach(function (r) { r.forEach(function (v) { if (v === 1) n++; }); }); return n; }
  function upd() { shell.setScore(String(left())); }
  function targets(x, y) {
    var out = [];
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) { var mx = x + d[0], my = y + d[1], tx = x + 2 * d[0], ty = y + 2 * d[1]; if (hole(tx, ty) && b[my][mx] === 1 && b[ty][tx] === 0) out.push([tx, ty, mx, my]); });
    return out;
  }
  function anyMove() { for (var y = 0; y < 7; y++) for (var x = 0; x < 7; x++) if (b[y] && b[y][x] === 1 && targets(x, y).length) return true; return false; }
  function jump(x, y, t) {
    hist.push(b.map(function (r) { return r.slice(); }));
    b[y][x] = 0; b[t[3]][t[2]] = 0; b[t[1]][t[0]] = 1; anim = { x: t[0], y: t[1], t: 0 }; sel = null; P.haptic('tap'); upd();
    if (!anyMove()) {
      done = true; var n = left(), perfect = n === 1 && b[3][3] === 1;
      P.haptic(n <= 2 ? 'win' : null);
      shell.end({ score: n, delay: 700, eyebrow: n === 1 ? (perfect ? 'Идеально!' : 'Одна фишка!') : 'Ходов больше нет', tone: n <= 2 ? 'good' : '', stats: perfect ? 'последняя фишка ровно в центре' : '', phrase: 'В «Солитёре» у меня осталось ' + n + ' ' + P.plural(n, U) + '. Оставишь меньше?' });
    }
  }
  P.loop(function (dt) { if (anim) { anim.t += dt * 5; if (anim.t > 1) anim = null; } draw(); });
  function geo() { var size = Math.min(view.W - 30, view.H - 220), cs = size / 7; return { cs: cs, x: (view.W - size) / 2, y: 100 + (view.H - 180 - size) / 2, size: size }; }
  function undoRect() { var G = geo(); return { x: view.W / 2 - 70, y: G.y + G.size + 24, w: 140, h: 44 }; }
  function draw() {
    var c = view.ctx, W = view.W, H = view.H, G = geo();
    c.fillStyle = '#22105A'; c.fillRect(0, 0, W, H);
    if (!b.length) return;
    c.fillStyle = '#3B1E8C';
    for (var y = 0; y < 7; y++) for (var x = 0; x < 7; x++) if (hole(x, y)) { c.beginPath(); if (c.roundRect) c.roundRect(G.x + x * G.cs + 2, G.y + y * G.cs + 2, G.cs - 4, G.cs - 4, G.cs * 0.25); else c.rect(G.x + x * G.cs, G.y + y * G.cs, G.cs, G.cs); c.fill(); }
    var tg = sel ? targets(sel[0], sel[1]) : [];
    for (y = 0; y < 7; y++) for (x = 0; x < 7; x++) {
      if (!hole(x, y)) continue;
      var cx = G.x + (x + 0.5) * G.cs, cy = G.y + (y + 0.5) * G.cs;
      c.fillStyle = '#140734'; c.beginPath(); c.arc(cx, cy, G.cs * 0.2, 0, 7); c.fill();
      if (b[y][x] === 1) {
        var r = G.cs * 0.33 * (anim && anim.x === x && anim.y === y ? 0.7 + 0.3 * anim.t : 1), isSel = sel && sel[0] === x && sel[1] === y;
        c.fillStyle = isSel ? '#FFD84D' : P.gold() ? '#FFD84D' : '#FF8AD8'; c.beginPath(); c.arc(cx, cy - (isSel ? 4 : 0), r, 0, 7); c.fill();
        c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(cx - r * 0.3, cy - r * 0.35 - (isSel ? 4 : 0), r * 0.28, 0, 7); c.fill();
      }
    }
    tg.forEach(function (p) { c.strokeStyle = '#3DF5B0'; c.lineWidth = 3; c.beginPath(); c.arc(G.x + (p[0] + 0.5) * G.cs, G.y + (p[1] + 0.5) * G.cs, G.cs * 0.3, 0, 7); c.stroke(); });
    var u = undoRect(); c.globalAlpha = hist.length && !done ? 1 : 0.35; c.strokeStyle = '#B9A8F0'; c.lineWidth = 1.5; c.beginPath(); if (c.roundRect) c.roundRect(u.x, u.y, u.w, u.h, 14); else c.rect(u.x, u.y, u.w, u.h); c.stroke();
    c.fillStyle = '#F4F1FF'; c.font = '600 15px Unbounded, Arial Black, sans-serif'; c.textAlign = 'center'; c.fillText('Назад ход', u.x + u.w / 2, u.y + 28); c.globalAlpha = 1;
  }
  P.gestures(canvas, { tap: function (x, y) {
    if (!shell.running || done) return;
    var u = undoRect(); if (x > u.x && x < u.x + u.w && y > u.y && y < u.y + u.h) { if (hist.length) { b = hist.pop(); sel = null; upd(); } return; }
    var G = geo(), gx = Math.floor((x - G.x) / G.cs), gy = Math.floor((y - G.y) / G.cs);
    if (!hole(gx, gy)) { sel = null; return; }
    if (b[gy][gx] === 1) { sel = targets(gx, gy).length ? [gx, gy] : null; if (!sel) P.haptic('crash'); return; }
    if (sel) { var t = targets(sel[0], sel[1]).filter(function (p) { return p[0] === gx && p[1] === gy; })[0]; if (t) jump(sel[0], sel[1], t); else sel = null; }
  } });
  reset();
})();
</script>
</body>
</html>
