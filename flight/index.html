<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Полёт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>
.stage{background:var(--night)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="game" aria-label="Полёт. Тапай, чтобы самолётик поднимался"></canvas>
</div>

<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var ARCS = ['арка', 'арки', 'арок'];

  var stage = document.getElementById('stage'), canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  var W = 1, H = 1, dpr = 1, ground = 0;

  var plane = { x: 0, y: 0, vy: 0 }, gates = [], passed = 0, scroll = 0, t = 0, flash = 0, crashed = false, sinceGate = 0;
  var stars = [];
  for (var s = 0; s < 40; s++) stars.push({ x: Math.random(), y: Math.random() * 0.8, r: 0.6 + Math.random() * 1.1, a: 0.2 + Math.random() * 0.5 });
  var hills = [];
  for (var h = 0; h < 7; h++) hills.push({ x: h / 6, r: 0.18 + Math.random() * 0.14 });

  var shell = P.shell({
    id: 'flight',
    title: 'Полёт',
    tagline: 'Пролетай сквозь арки и не падай.',
    rulesHtml: '<p>Каждый тап подбрасывает самолётик вверх, без тапов он падает. Арки идут всё плотнее, а проходы в них становятся уже.</p>',
    startLabel: 'Взлететь',
    overEyebrow: 'Крушение',
    countdown: true,
    formatScore: function (n) { return String(n); },
    unit: function (n) { return P.plural(n, ARCS); },
    pauseKeys: ['KeyP', 'Escape'],
    kbdHint: 'На компьютере: пробел — взмах, P — пауза',
    onReset: reset,
    onRun: function (isResume) { if (!isResume) flap(); }
  });

  /* Размеры в долях высоты экрана, чтобы игра одинаково ощущалась на любом телефоне */
  function gravity() { return 2.3 * H; }
  function lift() { return -0.66 * H; }
  function speed() { return Math.min(0.5, 0.36 + passed * 0.006) * W; }
  function gap() { return Math.max(0.21, 0.29 - passed * 0.0035) * H; }
  function spacing() { return Math.max(0.5, 0.66 - passed * 0.006) * W; }
  function gateW() { return Math.max(46, W * 0.15); }
  function size() { return Math.max(18, Math.min(W, H) * 0.06); }

  function addGate(x) {
    var g = gap(), margin = H * 0.12;
    var center = margin + g / 2 + Math.random() * Math.max(1, ground - margin * 2 - g);
    gates.push({ x: x, top: center - g / 2, bottom: center + g / 2, passed: false });
  }
  function reset() {
    plane.x = W * 0.28; plane.y = H * 0.42; plane.vy = 0;
    gates = []; passed = 0; scroll = 0; t = 0; flash = 0; crashed = false; sinceGate = 0;
    addGate(W * 1.15);
    shell.setScore('0');
  }
  function demo() {
    plane.x = W * 0.28; plane.y = H * 0.4; plane.vy = -0.2 * H;
    gates = [];
    addGate(W * 0.62); addGate(W * 1.25);
  }
  function flap() {
    if (!shell.running || crashed) return;
    plane.vy = lift();
    P.haptic('tap');
  }
  function crash() {
    if (crashed) return;
    crashed = true; flash = 1;
    shell.end({
      score: passed,
      delay: 800,
      haptic: 'crash',
      stats: 'в полёте: ' + t.toFixed(1).replace('.', ',') + ' с',
      phrase: 'Мой полёт — ' + passed + ' ' + P.plural(passed, ARCS) + '.'
    });
  }
  function hit(g) {
    var r = size() * 0.42, w = gateW();
    if (plane.x + r < g.x || plane.x - r > g.x + w) return false;
    return plane.y - r < g.top || plane.y + r > g.bottom;
  }
  function update(dt) {
    var running = shell.running;
    if (running && !crashed) {
      t += dt;
      plane.vy = Math.min(plane.vy + gravity() * dt, H * 1.2);
      plane.y += plane.vy * dt;
      if (plane.y < size() * 0.5) { plane.y = size() * 0.5; plane.vy = 0; }
      var v = speed() * dt;
      scroll += v; sinceGate += v;
      for (var i = 0; i < gates.length; i++) {
        var g = gates[i];
        g.x -= v;
        if (!g.passed && g.x + gateW() < plane.x) {
          g.passed = true; passed++;
          shell.setScore(String(passed));
          P.haptic('coin');
        }
        if (hit(g)) crash();
      }
      gates = gates.filter(function (g) { return g.x + gateW() > -10; });
      var lastGate = gates[gates.length - 1];
      if (!lastGate || lastGate.x + spacing() < W + 40) addGate((lastGate ? lastGate.x : W) + spacing());
      if (plane.y + size() * 0.42 >= ground) { plane.y = ground - size() * 0.42; crash(); }
    } else if (crashed && shell.state !== 'paused') {
      plane.vy = Math.min(plane.vy + gravity() * dt, H * 1.4);
      plane.y = Math.min(ground - size() * 0.42, plane.y + plane.vy * dt);
    }
    if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
  }

  function rr(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function draw() {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#140734'); grad.addColorStop(1, '#3B1E8C');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#F4F1FF';
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i], sx = ((st.x * W - scroll * 0.08) % W + W) % W;
      ctx.globalAlpha = st.a; ctx.beginPath(); ctx.arc(sx, st.y * ground, st.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#2A1470';
    for (var hI = 0; hI < hills.length; hI++) {
      var hx = ((hills[hI].x * W * 1.4 - scroll * 0.25) % (W * 1.4) + W * 1.4) % (W * 1.4) - W * 0.2;
      ctx.beginPath(); ctx.arc(hx, ground, hills[hI].r * H, Math.PI, 0); ctx.fill();
    }

    var w = gateW(), cap = 10;
    for (var g = 0; g < gates.length; g++) {
      var gt = gates[g];
      ctx.fillStyle = gt.passed ? '#2FD99B' : '#3DF5B0';
      rr(gt.x, -20, w, gt.top + 20, 10); ctx.fill();
      rr(gt.x, gt.bottom, w, ground - gt.bottom + 20, 10); ctx.fill();
      ctx.fillStyle = 'rgba(18,6,48,0.25)';
      rr(gt.x - 4, gt.top - cap, w + 8, cap, 4); ctx.fill();
      rr(gt.x - 4, gt.bottom, w + 8, cap, 4); ctx.fill();
    }

    ctx.fillStyle = '#140734'; ctx.fillRect(0, ground, W, H - ground);
    ctx.fillStyle = '#FF6B4A'; ctx.fillRect(0, ground, W, 3);
    ctx.fillStyle = 'rgba(244,241,255,0.12)';
    var dash = 28, off = scroll % (dash * 2);
    for (var d = -off; d < W; d += dash * 2) ctx.fillRect(d, ground + 14, dash, 3);

    var s = size(), ang = P.clamp(plane.vy / (H * 1.1), -0.45, 1.1);
    ctx.save();
    ctx.translate(plane.x, plane.y);
    ctx.rotate(ang);
    var gold = P.gold();
    ctx.fillStyle = gold ? '#FFD84D' : '#F4F1FF';
    ctx.beginPath();
    ctx.moveTo(s * 0.75, 0);
    ctx.lineTo(-s * 0.6, -s * 0.5);
    ctx.lineTo(-s * 0.32, 0);
    ctx.lineTo(-s * 0.6, s * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = gold ? '#FF9A6B' : '#B9A8F0';
    ctx.beginPath();
    ctx.moveTo(s * 0.75, 0);
    ctx.lineTo(-s * 0.32, 0);
    ctx.lineTo(-s * 0.6, s * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    if (flash > 0) { ctx.fillStyle = 'rgba(255,107,74,' + (flash * 0.35).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  function resize() {
    var r = stage.getBoundingClientRect();
    var oldW = W, oldH = H;
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ground = H - Math.max(H * 0.1, 64);
    if (shell.state === 'start') demo();
    else if (oldW > 1) {
      plane.x = W * 0.28; plane.y *= H / oldH;
      gates.forEach(function (g) { g.x *= W / oldW; g.top *= H / oldH; g.bottom *= H / oldH; });
    }
    draw();
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); flap(); });
  window.addEventListener('keydown', function (e) {
    if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && !e.repeat) { e.preventDefault(); flap(); }
  });

  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
  P.syncPerks();
})();
</script>
</body>
</html>
