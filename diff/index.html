<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Отличия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>
.stage{background:var(--shoulder)}
.play{gap:10px}
.info{margin:0;font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--lilac)}
.pic{--w:300px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:var(--w);height:calc(var(--w) * .8);padding:6px;border-radius:14px;background:#22105A;flex:none}
.pic button{border:0;padding:0;border-radius:8px;background:transparent;cursor:pointer;touch-action:manipulation;position:relative}
.pic svg{display:block;width:100%;height:100%}
.pic button.found{box-shadow:inset 0 0 0 3px var(--mint);background:rgba(61,245,176,.12)}
.pic button.miss{animation:miss .35s}
@keyframes miss{50%{background:rgba(255,107,74,.45)}}
.stage[data-state="paused"] .pic,.stage[data-state="countdown"] .pic{visibility:hidden}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="play">
    <div class="timebar" id="timebar"><i></i></div>
    <p class="info" id="info">Найди 3 отличия</p>
    <div class="pic" id="a"></div>
    <div class="pic" id="b"></div>
  </div>
</div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var CELLS = 20, U = ['отличие', 'отличия', 'отличий'];
  var COLS = ['#FF6B4A', '#3DF5B0', '#FFD84D', '#6FD3FF', '#FF8AD8', '#B9A8F0'];
  var SHAPES = {
    circle: '<circle cx="20" cy="20" r="13"/>',
    square: '<rect x="8" y="8" width="24" height="24" rx="5"/>',
    tri: '<path d="M20 6 L34 32 H6 Z"/>',
    star: '<path d="M20 5l4.2 9 9.8 1.2-7.2 6.7 1.9 9.7L20 26.8l-8.7 4.8 1.9-9.7L6 15.2l9.8-1.2z"/>',
    heart: '<path d="M20 33 C6 24 5 14 10.5 10 C15 7 19 10 20 13 C21 10 25 7 29.5 10 C35 14 34 24 20 33Z"/>',
    drop: '<path d="M20 5 C28 16 31 21 31 25 a11 11 0 0 1 -22 0 C9 21 12 16 20 5Z"/>',
    moon: '<path d="M26 6 a14 14 0 1 0 8 22 a11 11 0 1 1 -8 -22Z"/>',
    diamond: '<path d="M20 5 L34 20 L20 35 L6 20 Z"/>'
  };
  var NAMES = Object.keys(SHAPES);
  var stage = document.getElementById('stage'), A = document.getElementById('a'), B = document.getElementById('b'), info = document.getElementById('info');
  var left, right, diffs, found, score, rounds, busy;

  var shell = P.shell({
    id: 'diff', title: 'Отличия', tagline: 'Найди отличия между двумя картинками.',
    rulesHtml: '<p>Картинки отличаются в трёх местах: где-то другой цвет, где-то другая фигура, где-то фигура пропала или повёрнута. Нажимай на отличия на любой из картинок. Промах отнимает 2 секунды. На всё 60 секунд.</p>',
    overEyebrow: 'Время вышло', countdown: true,
    unit: function (n) { return P.plural(n, U); },
    onReset: reset
  });
  var timer = P.timeLimit(shell, 60, finish, document.getElementById('timebar'));
  function item() { return Math.random() < 0.12 ? null : { s: P.pick(NAMES), c: P.pick(COLS), r: P.pick([0, 0, 0, 90, 180]) }; }
  function svg(it) { return it ? '<svg viewBox="0 0 40 40" aria-hidden="true"><g fill="' + it.c + '" transform="rotate(' + it.r + ' 20 20)">' + SHAPES[it.s] + '</g></svg>' : ''; }
  function mutate(it) {
    var k = P.rand(it ? 4 : 1);
    if (!it) return { s: P.pick(NAMES), c: P.pick(COLS), r: 0 };
    var n = { s: it.s, c: it.c, r: it.r };
    if (k === 0) { do { n.c = P.pick(COLS); } while (n.c === it.c); }
    else if (k === 1) { do { n.s = P.pick(NAMES); } while (n.s === it.s); }
    else if (k === 2 && ['circle', 'square', 'diamond'].indexOf(it.s) === -1) n.r = (it.r + 90) % 360;
    else return null;
    return n;
  }
  function build() {
    left = []; for (var i = 0; i < CELLS; i++) left.push(item());
    right = left.slice();
    diffs = P.shuffle(Array.from({ length: CELLS }, function (_, k) { return k; })).slice(0, 3);
    diffs.forEach(function (k) { right[k] = mutate(left[k]); });
    found = []; busy = false;
    draw();
    info.textContent = 'Найди 3 отличия';
  }
  function draw() {
    [[A, left], [B, right]].forEach(function (pair) {
      pair[0].textContent = '';
      pair[1].forEach(function (it, k) {
        var b = document.createElement('button'); b.type = 'button'; b.innerHTML = svg(it);
        b.className = found.indexOf(k) !== -1 ? 'found' : '';
        b.setAttribute('aria-label', 'Клетка ' + (k + 1));
        b.addEventListener('click', function () { tap(k, b); });
        pair[0].appendChild(b);
      });
    });
  }
  function tap(k, el) {
    if (!shell.running || busy) return;
    if (found.indexOf(k) !== -1) return;
    if (diffs.indexOf(k) !== -1) {
      found.push(k); score++; shell.setScore(String(score)); P.haptic('coin'); draw();
      info.textContent = 'Найдено ' + found.length + ' из 3';
      if (found.length === 3) { rounds++; busy = true; P.haptic('win'); timer.add(4); info.textContent = 'Все отличия! +4 секунды'; setTimeout(function () { if (shell.running) build(); }, 700); }
    } else {
      P.haptic('crash'); timer.add(-2);
      el.classList.remove('miss'); void el.offsetWidth; el.classList.add('miss');
    }
  }
  function reset() { score = 0; rounds = 0; shell.setScore('0'); timer.reset(); build(); }
  function finish() { busy = true; shell.end({ score: score, delay: 300, stats: 'пар картинок: ' + rounds, phrase: 'В «Отличиях» у меня ' + score + ' ' + P.plural(score, U) + ' за минуту.' }); }
  function layout() { var r = stage.getBoundingClientRect(); var w = Math.floor(Math.min(r.width - 32, (r.height - 170) / 1.65, 420)); A.style.setProperty('--w', w + 'px'); B.style.setProperty('--w', w + 'px'); }
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
  layout(); build(); timer.show();
})();
</script>
</body>
</html>
