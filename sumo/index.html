<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Сумо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>

</style>
</head>
<body>
<div class="stage" id="stage">
<canvas id="game" aria-label="Сумо для двоих. Каждый ведёт пальцем на своей половине"></canvas>
</div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var A = null, B = null, score = [0, 0], WIN = 3, ptrs = {}, keys = {}, pause = 0, msg = '', S = 1, fx = [];
  var shell = P.shell({
    id: 'sumo', title: 'Сумо', tagline: 'Игра вдвоём на одном телефоне.',
    rulesHtml: '<p>Положите телефон между собой. Каждый ведёт пальцем на своей половине экрана — борец разгоняется в ту сторону. Толкайтесь! Кто вылетел за круг — проиграл раунд. До трёх побед.</p>',
    startLabel: 'Хаккэ-ёй!', countdown: true, overEyebrow: 'Бой окончен',
    formatScore: function () { return score[0] + ':' + score[1]; }, onReset: reset, pauseKeys: ['KeyP', 'Escape']
  });
  var view = P.canvas(canvas, stage, function () { S = P.clamp(Math.min(view.W, view.H) / 390, 0.8, 1.4); });
  function ring() { return { x: view.W / 2, y: view.H / 2 + 10, r: Math.min(view.W, view.H - 120) * 0.44 }; }
  function place() { var R = ring(); A = { x: R.x, y: R.y + R.r * 0.45, vx: 0, vy: 0, ax: 0, ay: 0, col: '#6FD3FF' }; B = { x: R.x, y: R.y - R.r * 0.45, vx: 0, vy: 0, ax: 0, ay: 0, col: '#FF6B4A' }; ptrs = {}; }
  function reset() { score = [0, 0]; place(); pause = 0.8; msg = ''; fx = []; shell.setScore('0:0'); }
  function step(dt) {
    var acc = 900 * S, R = ring(), rad = 26 * S;
    [A, B].forEach(function (p, i) {
      var kx = 0, ky = 0;
      if (i === 0) { if (keys.ArrowLeft) kx--; if (keys.ArrowRight) kx++; if (keys.ArrowUp) ky--; if (keys.ArrowDown) ky++; }
      else { if (keys.KeyA) kx--; if (keys.KeyD) kx++; if (keys.KeyW) ky--; if (keys.KeyS) ky++; }
      var ax = p.ax + kx, ay = p.ay + ky, m = Math.hypot(ax, ay); if (m > 1) { ax /= m; ay /= m; }
      p.vx += ax * acc * dt; p.vy += ay * acc * dt; p.vx *= Math.pow(0.12, dt); p.vy *= Math.pow(0.12, dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
    });
    var dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
    if (d < rad * 2 && d > 0) {
      var nx = dx / d, ny = dy / d, ov = rad * 2 - d; A.x -= nx * ov / 2; A.y -= ny * ov / 2; B.x += nx * ov / 2; B.y += ny * ov / 2;
      var rv = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
      if (rv < 0) { var j = -1.9 * rv / 2; A.vx -= j * nx; A.vy -= j * ny; B.vx += j * nx; B.vy += j * ny; if (-rv > 200 * S) { P.haptic('tap'); for (var k = 0; k < 6; k++) fx.push({ x: (A.x + B.x) / 2, y: (A.y + B.y) / 2, vx: (Math.random() - 0.5) * 300, vy: (Math.random() - 0.5) * 300, life: 0.3 }); } }
    }
    var outA = Math.hypot(A.x - R.x, A.y - R.y) > R.r, outB = Math.hypot(B.x - R.x, B.y - R.y) > R.r;
    if (outA || outB) {
      if (outA && !outB) score[1]++; else if (outB && !outA) score[0]++;
      shell.setScore(score[0] + ':' + score[1]); P.haptic('win');
      msg = outA && outB ? 'Оба вылетели!' : outA ? 'Раунд красным!' : 'Раунд синим!';
      if (score[0] >= WIN || score[1] >= WIN) { var w = score[0] > score[1] ? 'Синий' : 'Красный'; shell.end({ score: Math.max(score[0], score[1]), record: false, delay: 700, eyebrow: w + ' победил', tone: 'good', stats: 'счёт ' + score[0] + ':' + score[1], phrase: 'Сыграли в «Сумо» — ' + score[0] + ':' + score[1] + '. Реванш?' }); pause = 99; return; }
      pause = 1.3; setTimeout(place, 700);
    }
  }
  P.loop(function (dt) {
    if (shell.running && A) { if (pause > 0) pause -= dt; else step(dt); }
    fx.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }); fx = fx.filter(function (p) { return p.life > 0; });
    draw();
  });
  function wrestler(c, p, flip) {
    var r = 26 * S; c.save(); c.translate(p.x, p.y); if (flip) c.rotate(Math.PI);
    c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(3, 6, r, r * 0.9, 0, 0, 7); c.fill();
    c.fillStyle = p.col; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
    c.fillStyle = '#FFD3B0'; c.beginPath(); c.arc(0, r * 0.15, r * 0.62, 0, 7); c.fill();
    c.fillStyle = '#120630'; c.beginPath(); c.arc(-r * 0.22, r * 0.05, r * 0.08, 0, 7); c.arc(r * 0.22, r * 0.05, r * 0.08, 0, 7); c.fill();
    c.fillRect(-r * 0.2, r * 0.32, r * 0.4, r * 0.06); c.beginPath(); c.arc(0, -r * 0.5, r * 0.22, 0, 7); c.fill();
    c.restore();
  }
  function draw() {
    var c = view.ctx, W = view.W, H = view.H, R = ring();
    c.fillStyle = '#22105A'; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(255,107,74,.08)'; c.fillRect(0, 0, W, H / 2); c.fillStyle = 'rgba(111,211,255,.08)'; c.fillRect(0, H / 2, W, H / 2);
    c.fillStyle = '#E8D3A8'; c.beginPath(); c.arc(R.x, R.y, R.r, 0, 7); c.fill();
    c.strokeStyle = '#9C5A3C'; c.lineWidth = 8 * S; c.stroke();
    c.strokeStyle = 'rgba(156,90,60,.5)'; c.lineWidth = 3; c.beginPath(); c.moveTo(R.x - 30 * S, R.y); c.lineTo(R.x - 10 * S, R.y); c.moveTo(R.x + 10 * S, R.y); c.lineTo(R.x + 30 * S, R.y); c.stroke();
    if (A) { wrestler(c, B, true); wrestler(c, A, false); }
    fx.forEach(function (p) { c.globalAlpha = p.life * 3; c.fillStyle = '#fff'; c.fillRect(p.x - 2, p.y - 2, 4, 4); }); c.globalAlpha = 1;
    c.font = '800 ' + Math.round(26 * S) + 'px Unbounded, Arial Black, sans-serif'; c.textAlign = 'center';
    c.save(); c.translate(W / 2, 110); c.rotate(Math.PI); c.fillStyle = '#FF6B4A'; c.fillText(String(score[1]), 0, 0); c.restore();
    c.fillStyle = '#6FD3FF'; c.fillText(String(score[0]), W / 2, H - 24);
    if (pause > 0 && msg && shell.running) { c.fillStyle = '#F4F1FF'; c.font = '800 ' + Math.round(22 * S) + 'px Unbounded, Arial Black, sans-serif'; c.fillText(msg, W / 2, H / 2 + 8); }
  }
  function pt(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointerdown', function (e) { var p = pt(e); ptrs[e.pointerId] = { who: p.y > view.H / 2 ? 0 : 1, x: p.x, y: p.y }; try { canvas.setPointerCapture(e.pointerId); } catch (er) {} });
  canvas.addEventListener('pointermove', function (e) {
    var t = ptrs[e.pointerId]; if (!t) return; var p = pt(e), dx = p.x - t.x, dy = p.y - t.y, m = Math.hypot(dx, dy), w = t.who === 0 ? A : B;
    if (!w) return; var k = Math.min(1, m / (50 * S)); w.ax = m ? dx / m * k : 0; w.ay = m ? dy / m * k : 0;
    if (m > 60 * S) { t.x = p.x - dx / m * 60 * S; t.y = p.y - dy / m * 60 * S; }
  });
  function up(e) { var t = ptrs[e.pointerId]; if (!t) return; var w = t.who === 0 ? A : B; if (w) { w.ax = 0; w.ay = 0; } delete ptrs[e.pointerId]; }
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  window.addEventListener('keydown', function (e) { keys[e.code] = true; if (/^Arrow/.test(e.code)) e.preventDefault(); });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
})();
</script>
</body>
</html>
