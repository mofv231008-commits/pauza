<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Танчики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>

</style>
</head>
<body>
<div class="stage" id="stage">
<canvas id="game" aria-label="Танчики. Веди пальцем — танк едет туда и стреляет сам"></canvas>
</div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['очко', 'очка', 'очков'], FW = 26;
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var f = 15, FH = 40, top = 74, map = [], tanks = [], bullets = [], fx = [], me = null, lives = 3, level = 1, left = 0, onField = 0, spawnT = 0, score = 0, kills = 0, drag = null, keyDir = -1, over = false;
  var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  var shell = P.shell({
    id: 'tank', title: 'Танчики', tagline: 'Кирпичи, сталь и база за спиной.',
    rulesHtml: '<p>Веди пальцем по экрану — танк поедет в ту сторону и сам стреляет вперёд. Кирпичи пробиваются, сталь — нет. Не дай врагам попасть в базу внизу. Три танка в запасе.</p>',
    startLabel: 'В бой', countdown: true, overEyebrow: 'Бой окончен',
    unit: function (n) { return P.plural(n, U); }, kbdHint: 'На компьютере: стрелки — ехать, танк стреляет сам',
    onReset: reset
  });
  var view = P.canvas(canvas, stage, function () { f = view.W / FW; FH = Math.max(28, Math.floor((view.H - top - 24) / f / 2) * 2); if (!map.length) build(); });
  function build() {
    map = []; var R = FH / 2;
    for (var y = 0; y < FH; y++) { map.push([]); for (var x = 0; x < FW; x++) map[y].push(0); }
    function set(cx, cy, v) { for (var a = 0; a < 2; a++) for (var b = 0; b < 2; b++) map[cy * 2 + a][cx * 2 + b] = v; }
    for (var cy = 2; cy < R - 3; cy++) for (var cx = 0; cx < 13; cx++) {
      var r = Math.random();
      if ((cx + cy) % 2 === 0 && r < 0.42) set(cx, cy, 1); else if (r < 0.05 + level * 0.005) set(cx, cy, 2);
    }
    var row = 3 + P.rand(R - 8); for (var c2 = 0; c2 < 13; c2++) set(c2, row, 0);
    [[5, R - 1], [7, R - 1], [5, R - 2], [6, R - 2], [7, R - 2]].forEach(function (p) { set(p[0], p[1], 1); });
    set(6, R - 1, 3); set(4, R - 1, 0); set(8, R - 1, 0); set(4, R - 2, 0);
  }
  function reset() { level = 1; score = 0; kills = 0; lives = 3; over = false; startLevel(); shell.setScore('0'); }
  function startLevel() {
    build(); tanks = []; bullets = []; fx = []; left = 8 + level * 2; onField = 0; spawnT = 0.5;
    me = tank(4 * 2 + 1, FH - 1, 0, true); tanks.push(me); side();
  }
  function side() { shell.setSide('♥ ' + lives + ' · 🎯 ' + (left + onField), lives <= 1); }
  function tank(cx, cy, dir, mine) { return { x: cx * f, y: cy * f, dir: dir, mine: !!mine, cool: 0.6, turn: 1 + Math.random() * 2, col: mine ? '#3DF5B0' : P.pick(['#FF6B4A', '#FF8AD8', '#FFD84D']), hp: !mine && level > 2 && Math.random() < 0.25 ? 2 : 1, moving: false, inv: mine ? 2 : 0 }; }
  function cell(x, y) { var cx = Math.floor(x / f), cy = Math.floor(y / f); if (cx < 0 || cy < 0 || cx >= FW || cy >= FH) return 2; return map[cy][cx]; }
  function blocked(t, nx, ny) {
    var h = f * 0.94;
    for (var yy = ny - h; yy <= ny + h; yy += f * 0.94) for (var xx = nx - h; xx <= nx + h; xx += f * 0.94) if (cell(xx, yy) !== 0) return true;
    return tanks.some(function (o) { return o !== t && Math.abs(o.x - nx) < f * 1.9 && Math.abs(o.y - ny) < f * 1.9 && Math.hypot(o.x - nx, o.y - ny) < Math.hypot(o.x - t.x, o.y - t.y); });
  }
  function turn(t, d) { if (d === t.dir) return; if ((d % 2) !== (t.dir % 2)) { if (d % 2) t.y = Math.round(t.y / f) * f; else t.x = Math.round(t.x / f) * f; } t.dir = d; }
  function move(t, dt, sp) {
    var nx = t.x + DX[t.dir] * sp * dt, ny = t.y + DY[t.dir] * sp * dt;
    if (!blocked(t, nx, ny)) { t.x = nx; t.y = ny; return true; } return false;
  }
  function fire(t) { if (t.cool > 0) return; t.cool = t.mine ? 0.5 : 1 + Math.random() * 0.9; bullets.push({ x: t.x + DX[t.dir] * f, y: t.y + DY[t.dir] * f, dir: t.dir, mine: t.mine }); }
  function hitCell(x, y, dir) {
    var hit = false, pts = dir % 2 === 0 ? [[x - f * 0.5, y], [x + f * 0.5, y]] : [[x, y - f * 0.5], [x, y + f * 0.5]];
    pts.forEach(function (p) {
      var cx = Math.floor(p[0] / f), cy = Math.floor(p[1] / f), v = cell(p[0], p[1]);
      if (v === 1) { map[cy][cx] = 0; hit = true; } else if (v === 2) hit = true;
      else if (v === 3) { hit = true; lose('base'); }
    });
    return hit;
  }
  function boom(x, y, col, n) { for (var i = 0; i < n; i++) { var a = Math.random() * 6.28, s = (30 + Math.random() * 140); fx.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.4, col: col }); } }
  function lose(why) {
    if (over) return;
    if (why === 'base') { over = true; boom(13 * f, (FH - 1) * f, '#3DF5B0', 40); P.haptic('crash'); finish('Базу разбили'); return; }
    lives--; boom(me.x, me.y, '#3DF5B0', 24); P.haptic('crash'); side();
    if (lives <= 0) { over = true; tanks.splice(tanks.indexOf(me), 1); finish('Танк подбит'); return; }
    me.x = 9 * f; me.y = (FH - 1) * f; me.dir = 0; me.inv = 2.5;
  }
  function finish(eb) { shell.end({ score: score, delay: 900, eyebrow: eb, stats: 'уровень ' + level + ' · подбито танков: ' + kills, phrase: 'В «Танчиках» я подбил ' + kills + ' танков и дошёл до уровня ' + level + '. Отобьёшься лучше?' }); }
  function step(dt) {
    var sp = f * 3.6;
    me.inv = Math.max(0, me.inv - dt);
    var d = keyDir >= 0 ? keyDir : drag && drag.dir >= 0 ? drag.dir : -1;
    if (d >= 0) { turn(me, d); move(me, dt, sp); }
    tanks.forEach(function (t) {
      t.cool -= dt;
      if (t.mine) { fire(t); return; }
      t.turn -= dt;
      if (!move(t, dt, sp * (0.55 + Math.min(0.35, level * 0.05))) || t.turn <= 0) {
        var r = Math.random(), nd;
        if (r < 0.35) nd = 2; else if (r < 0.55) nd = Math.abs(me.x - t.x) > Math.abs(me.y - t.y) ? (me.x > t.x ? 1 : 3) : (me.y > t.y ? 2 : 0); else nd = P.rand(4);
        turn(t, nd); t.turn = 0.8 + Math.random() * 2;
      }
      if (Math.random() < dt * 1.4) fire(t);
    });
    spawnT -= dt;
    if (spawnT <= 0 && left > 0 && onField < Math.min(4, 2 + level)) {
      var pts = [[1, 1], [13, 1], [25, 1]], p = P.pick(pts), nt = tank(p[0], p[1], 2, false);
      if (!blocked(nt, nt.x, nt.y)) { tanks.push(nt); left--; onField++; side(); }
      spawnT = 2.2;
    }
    bullets.forEach(function (b) {
      for (var s = 0; s < 3 && !b.dead; s++) {
        b.x += DX[b.dir] * f * 11 * dt / 3; b.y += DY[b.dir] * f * 11 * dt / 3;
        if (hitCell(b.x, b.y, b.dir)) { b.dead = true; boom(b.x, b.y, '#FF9A6B', 6); break; }
        for (var i = 0; i < tanks.length; i++) {
          var t = tanks[i];
          if (t.mine === b.mine || Math.abs(t.x - b.x) > f || Math.abs(t.y - b.y) > f) continue;
          b.dead = true;
          if (t.mine) { if (t.inv <= 0) lose('me'); }
          else { t.hp--; boom(t.x, t.y, t.col, 10); if (t.hp <= 0) { tanks.splice(i, 1); onField--; kills++; score += 100; shell.setScore(String(score)); P.haptic('coin'); boom(t.x, t.y, t.col, 22); side(); } }
          break;
        }
      }
    });
    bullets.forEach(function (a) { bullets.forEach(function (b) { if (a !== b && a.mine !== b.mine && !a.dead && !b.dead && Math.abs(a.x - b.x) < f * 0.7 && Math.abs(a.y - b.y) < f * 0.7) { a.dead = b.dead = true; } }); });
    bullets = bullets.filter(function (b) { return !b.dead && b.x > 0 && b.y > 0 && b.x < FW * f && b.y < FH * f; });
    if (!over && left === 0 && onField === 0) { score += 1000; level++; shell.setScore(String(score)); P.haptic('win'); startLevel(); }
  }
  P.loop(function (dt) {
    if (shell.running && me && !over) step(dt);
    fx.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }); fx = fx.filter(function (p) { return p.life > 0; });
    draw();
  });
  function draw() {
    var c = view.ctx, W = view.W, H = view.H;
    c.fillStyle = '#0E0526'; c.fillRect(0, 0, W, H);
    c.save(); c.translate(0, top);
    c.fillStyle = '#140734'; c.fillRect(0, 0, FW * f, FH * f);
    for (var y = 0; y < map.length; y++) for (var x = 0; x < FW; x++) {
      var v = map[y][x]; if (!v) continue;
      if (v === 1) { c.fillStyle = '#FF6B4A'; c.fillRect(x * f, y * f, f, f); c.fillStyle = 'rgba(18,6,48,.35)'; c.fillRect(x * f, y * f + f * 0.45, f, f * 0.1); c.fillRect(x * f + (y % 2 ? f * 0.3 : f * 0.7), y * f, f * 0.1, f * 0.45); }
      else if (v === 2) { c.fillStyle = '#B9A8F0'; c.fillRect(x * f, y * f, f, f); c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(x * f + 2, y * f + 2, f * 0.3, f * 0.3); }
    }
    var bx = 12 * f, by = (FH - 2) * f;
    c.fillStyle = over ? '#3B1E8C' : '#22105A'; c.fillRect(bx, by, 2 * f, 2 * f);
    c.fillStyle = over ? '#5B3FD0' : '#3DF5B0'; c.fillRect(bx + f * 0.45, by + f * 0.4, f * 0.4, f * 1.2); c.fillRect(bx + f * 1.15, by + f * 0.4, f * 0.4, f * 1.2);
    tanks.forEach(function (t) {
      if (t.mine && t.inv > 0 && Math.floor(t.inv * 10) % 2) return;
      c.save(); c.translate(t.x, t.y); c.rotate(t.dir * Math.PI / 2);
      var s = f * 0.92;
      c.fillStyle = '#120630'; c.fillRect(-s, -s, s * 0.5, s * 2); c.fillRect(s * 0.5, -s, s * 0.5, s * 2);
      c.fillStyle = t.col; c.fillRect(-s * 0.75, -s * 0.8, s * 1.5, s * 1.6);
      c.fillStyle = 'rgba(18,6,48,.35)'; c.beginPath(); c.arc(0, s * 0.1, s * 0.48, 0, 7); c.fill();
      c.fillStyle = t.col; c.fillRect(-s * 0.13, -s * 1.15, s * 0.26, s * 1.05);
      if (t.hp > 1) { c.strokeStyle = '#fff'; c.lineWidth = 2; c.strokeRect(-s * 0.75, -s * 0.8, s * 1.5, s * 1.6); }
      c.restore();
    });
    c.fillStyle = '#fff'; bullets.forEach(function (b) { c.beginPath(); c.arc(b.x, b.y, f * 0.22, 0, 7); c.fill(); });
    fx.forEach(function (p) { c.globalAlpha = Math.min(1, p.life * 2); c.fillStyle = p.col; c.fillRect(p.x - 2, p.y - 2, 4, 4); }); c.globalAlpha = 1;
    c.restore();
  }
  canvas.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, dir: drag ? drag.dir : -1, id: e.pointerId }; });
  window.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 14) { drag.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0); drag.x = e.clientX - dx * 0.5; drag.y = e.clientY - dy * 0.5; }
  });
  window.addEventListener('pointerup', function (e) { if (drag && e.pointerId === drag.id) drag = null; });
  var KD = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
  window.addEventListener('keydown', function (e) { if (KD[e.code] !== undefined) { e.preventDefault(); keyDir = KD[e.code]; } });
  window.addEventListener('keyup', function (e) { if (KD[e.code] === keyDir) keyDir = -1; });
})();
</script>
</body>
</html>
