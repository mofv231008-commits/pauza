<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Змеи и лестницы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>

</style>
</head>
<body>
<div class="stage" id="stage">
<canvas id="game" aria-label="Змеи и лестницы. Нажми, чтобы бросить кубик"></canvas>
</div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['бросок', 'броска', 'бросков'];
  var LAD = { 4: 14, 9: 31, 20: 38, 28: 84, 40: 59, 51: 67, 63: 81, 71: 91 }, SNK = { 17: 7, 54: 34, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 99: 78 };
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var pl = [], cur = 0, die = 1, rolling = 0, moving = null, rolls = 0, over = false, msg = '', S = 1, gen = 0, place = [];
  var shell = P.shell({
    id: 'ladders', title: 'Змеи и лестницы', tagline: 'Ты и два бота — кто первым до сотни?',
    rulesHtml: '<p>Нажми на экран — бросишь кубик, фишка пройдёт столько клеток. Лестница поднимает, змея спускает вниз. На 100 нужно попасть точно: лишние очки — стоишь на месте. Рекорд — за сколько бросков дошёл первым.</p>',
    startLabel: 'Бросать', countdown: false, overEyebrow: 'Финиш', lowerIsBetter: true,
    unit: function (n) { return P.plural(n, U); }, onReset: reset
  });
  var view = P.canvas(canvas, stage, function () { S = P.clamp(view.W / 390, 0.8, 1.3); });
  function geo() { var size = Math.min(view.W - 16, view.H - 230), cs = size / 10; return { cs: cs, x: (view.W - size) / 2, y: 84, size: size }; }
  function xy(n) { var G = geo(), r = Math.floor((n - 1) / 10), c = (n - 1) % 10; if (r % 2) c = 9 - c; return { x: G.x + (c + 0.5) * G.cs, y: G.y + (9 - r + 0.5) * G.cs }; }
  function wait(fn, ms) { var g = gen; setTimeout(function tick() { if (g !== gen) return; if (!shell.running) { setTimeout(tick, 300); return; } fn(); }, ms); }
  function reset() { gen++; pl = [{ n: 1, col: '#3DF5B0', name: 'Ты' }, { n: 1, col: '#FF6B4A', name: 'Бот Вася' }, { n: 1, col: '#6FD3FF', name: 'Бот Петя' }]; cur = 0; rolls = 0; over = false; moving = null; place = []; msg = 'Твой бросок — нажми на экран'; shell.setScore('0'); }
  function roll() {
    if (!shell.running || over || moving || rolling > 0) return;
    if (cur !== 0) return;
    rolls++; shell.setScore(String(rolls)); doRoll();
  }
  function doRoll() { rolling = 0.6; P.haptic('tap'); wait(function () { die = 1 + P.rand(6); rolling = 0; move(die); }, 600); }
  function move(d) {
    var p = pl[cur], target = p.n + d;
    msg = p.name + ': ' + d;
    if (target > 100) { msg += ' — перебор, стоит'; wait(nextTurn, 700); return; }
    var path = []; for (var i = p.n + 1; i <= target; i++) path.push(i);
    moving = { p: p, path: path, t: 0 };
  }
  function land() {
    var p = pl[cur];
    if (LAD[p.n]) { msg = p.name + ': лестница! ' + p.n + ' → ' + LAD[p.n]; moving = { p: p, jump: LAD[p.n], from: p.n, t: 0 }; if (cur === 0) P.haptic('coin'); return; }
    if (SNK[p.n]) { msg = p.name + ': змея! ' + p.n + ' → ' + SNK[p.n]; moving = { p: p, jump: SNK[p.n], from: p.n, t: 0 }; if (cur === 0) P.haptic('crash'); return; }
    if (p.n === 100) {
      over = true;
      if (cur === 0) { P.haptic('win'); shell.end({ score: rolls, delay: 700, eyebrow: 'Ты первый!', tone: 'good', phrase: 'В «Змеях и лестницах» я дошёл до сотни за ' + rolls + ' ' + P.plural(rolls, U) + '. Быстрее сможешь?' }); }
      else { P.haptic('crash'); shell.end({ score: rolls, record: false, delay: 700, eyebrow: p.name + ' победил', stats: 'ты был на клетке ' + pl[0].n, phrase: 'В «Змеях и лестницах» меня обогнал бот. Обгонишь его?' }); }
      return;
    }
    wait(nextTurn, 450);
  }
  function nextTurn() {
    if (over) return;
    if (die === 6 && cur >= 0) { msg += ' · шестёрка — ещё бросок'; }
    else cur = (cur + 1) % pl.length;
    if (cur === 0) msg = 'Твой бросок — нажми на экран'; else wait(doRoll, 500);
  }
  P.loop(function (dt) {
    if (rolling > 0 && shell.running) { rolling -= dt; die = 1 + P.rand(6); }
    if (moving && shell.running) {
      moving.t += dt * (moving.jump ? 1.6 : 6.5);
      if (moving.jump) { if (moving.t >= 1) { moving.p.n = moving.jump; moving = null; wait(nextTurn, 450); } }
      else if (moving.t >= 1) { moving.t = 0; moving.p.n = moving.path.shift(); if (!moving.path.length) { moving = null; land(); } }
    }
    draw();
  });
  function draw() {
    var c = view.ctx, W = view.W, H = view.H, G = geo();
    c.fillStyle = '#22105A'; c.fillRect(0, 0, W, H);
    if (!pl.length) return;
    for (var n = 1; n <= 100; n++) {
      var p = xy(n); c.fillStyle = (Math.floor((n - 1) / 10) + n) % 2 ? '#3B1E8C' : '#2F1675'; c.fillRect(p.x - G.cs / 2, p.y - G.cs / 2, G.cs + 0.5, G.cs + 0.5);
      c.fillStyle = 'rgba(185,168,240,.55)'; c.font = '600 ' + Math.round(G.cs * 0.24) + 'px Onest, sans-serif'; c.textAlign = 'left'; c.fillText(String(n), p.x - G.cs * 0.44, p.y - G.cs * 0.22);
    }
    c.lineCap = 'round';
    Object.keys(LAD).forEach(function (a) {
      var A = xy(+a), B = xy(LAD[a]), dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy), nx = -dy / L * G.cs * 0.16, ny = dx / L * G.cs * 0.16;
      c.strokeStyle = '#FFD84D'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(A.x + nx, A.y + ny); c.lineTo(B.x + nx, B.y + ny); c.moveTo(A.x - nx, A.y - ny); c.lineTo(B.x - nx, B.y - ny); c.stroke();
      for (var k = 1; k < L / (G.cs * 0.35); k++) { var t = k * G.cs * 0.35 / L; c.beginPath(); c.moveTo(A.x + dx * t + nx, A.y + dy * t + ny); c.lineTo(A.x + dx * t - nx, A.y + dy * t - ny); c.stroke(); }
    });
    Object.keys(SNK).forEach(function (a, i) {
      var A = xy(+a), B = xy(SNK[a]), dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
      var col = ['#3DF5B0', '#FF8AD8', '#FF9A6B', '#6FD3FF'][i % 4];
      c.strokeStyle = col; c.lineWidth = G.cs * 0.22; c.beginPath(); c.moveTo(A.x, A.y);
      for (var k = 1; k <= 20; k++) { var t = k / 20, w = Math.sin(t * Math.PI * 3) * G.cs * 0.35 * (1 - t * 0.5); c.lineTo(A.x + dx * t + nx * w, A.y + dy * t + ny * w); }
      c.stroke(); c.fillStyle = col; c.beginPath(); c.arc(A.x, A.y, G.cs * 0.2, 0, 7); c.fill(); c.fillStyle = '#120630'; c.beginPath(); c.arc(A.x - G.cs * 0.07, A.y - G.cs * 0.05, G.cs * 0.04, 0, 7); c.arc(A.x + G.cs * 0.07, A.y - G.cs * 0.05, G.cs * 0.04, 0, 7); c.fill();
    });
    pl.forEach(function (p, i) {
      var q = xy(p.n);
      if (moving && moving.p === p) { var to = moving.jump ? xy(moving.jump) : xy(moving.path[0]), from = moving.jump ? xy(moving.from) : q, t2 = Math.min(1, moving.t); q = { x: from.x + (to.x - from.x) * t2, y: from.y + (to.y - from.y) * t2 - (moving.jump ? 0 : Math.sin(t2 * Math.PI) * G.cs * 0.3) }; }
      var ox = (i - 1) * G.cs * 0.22;
      c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.arc(q.x + ox + 2, q.y + 3, G.cs * 0.2, 0, 7); c.fill();
      c.fillStyle = p.col; c.beginPath(); c.arc(q.x + ox, q.y, G.cs * 0.2, 0, 7); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
    });
    var by = G.y + G.size + 20, ds = 64;
    c.fillStyle = '#F4F1FF'; c.beginPath(); if (c.roundRect) c.roundRect(W / 2 - ds / 2, by, ds, ds, 14); else c.rect(W / 2 - ds / 2, by, ds, ds); c.fill();
    var PP = [[], [4], [0, 8], [0, 4, 8], [0, 2, 6, 8], [0, 2, 4, 6, 8], [0, 2, 3, 5, 6, 8]];
    c.fillStyle = '#120630'; PP[die].forEach(function (k) { c.beginPath(); c.arc(W / 2 - ds / 2 + 14 + (k % 3) * 18, by + 14 + Math.floor(k / 3) * 18, 5, 0, 7); c.fill(); });
    c.fillStyle = cur === 0 && !over ? '#3DF5B0' : '#B9A8F0'; c.font = '600 14px Onest, sans-serif'; c.textAlign = 'center'; c.fillText(msg, W / 2, by + ds + 24);
  }
  canvas.addEventListener('pointerdown', roll);
  window.addEventListener('keydown', function (e) { if (e.code === 'Enter' || e.code === 'ArrowDown') { e.preventDefault(); roll(); } });
  reset();
})();
</script>
</body>
</html>
