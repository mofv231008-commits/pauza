<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var D = [
    ['Призвание варягов, начало правления Рюрика', 862], ['Крещение Руси', 988], ['Первое упоминание Москвы в летописи', 1147], ['Основание Нижнего Новгорода', 1221],
    ['Невская битва', 1240], ['Ледовое побоище', 1242], ['Куликовская битва', 1380], ['Падение Константинополя', 1453], ['Стояние на реке Угре — конец ордынского ига', 1480],
    ['Открытие Америки Колумбом', 1492], ['Венчание Ивана Грозного на царство', 1547], ['Взятие Казани войском Ивана Грозного', 1552], ['Первая московская печатная книга «Апостол»', 1564],
    ['Избрание Михаила Романова на царство', 1613], ['Основание Санкт-Петербурга', 1703], ['Полтавская битва', 1709], ['Ништадтский мир — конец Северной войны', 1721],
    ['Смерть Петра I', 1725], ['Основание Московского университета', 1755], ['Начало правления Екатерины II', 1762], ['Декларация независимости США', 1776],

    ['Начало Первой мировой войны', 1914], ['Октябрьская революция', 1917], ['Образование СССР', 1922], ['Открытие первой линии московского метро', 1935],
    ['Начало Второй мировой войны', 1939], ['Начало Великой Отечественной войны', 1941], ['Победа в Сталинградской битве', 1943], ['Победа в Великой Отечественной войне', 1945],
    ['Запуск первого искусственного спутника Земли', 1957], ['Полёт Юрия Гагарина', 1961], ['Карибский кризис', 1962], ['Высадка человека на Луну', 1969],

    ['Падение Западной Римской империи', 476]
  ];
  var order = [], pos = 0;
  function near(y) {
    var span = y < 1500 ? 60 : y < 1900 ? 30 : 12, out = [];
    while (out.length < 3) { var d = (1 + P.rand(span)) * (Math.random() < 0.5 ? -1 : 1), v = y + d; if (v !== y && out.indexOf(v) < 0 && v <= 2026) out.push(v); }
    return out;
  }
  PauzaQuiz({
    id: 'dates', title: 'Даты истории', tagline: 'От Рюрика до полёта на Луну.',
    rules: '<p>Назвали событие — выбери год. Варианты нарочно близкие. Ошибка отнимает 3 секунды. На всё 60 секунд.</p>',
    cols: 2, sub: 'В каком году?',
    onReset: function () { order = P.shuffle(D.map(function (_, i) { return i; })); pos = 0; },
    next: function () {
      if (!order.length || pos >= order.length) { order = P.shuffle(D.map(function (_, i) { return i; })); pos = 0; }
      var d = D[order[pos++]], opts = P.shuffle([d[1]].concat(near(d[1]))).map(String);
      return { q: d[0], opts: opts, right: opts.indexOf(String(d[1])), cls: 'long' };
    }
  });
})();
