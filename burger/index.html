<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Бургерная</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>
.stage{background:var(--shoulder)}
.bg-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:82px 14px 16px}
.bg-wrap .timebar{width:100%}
.bg-top{display:flex;gap:12px;width:100%;flex:1;min-height:0}
.bg-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0}
.bg-col h3{margin:0;font-family:var(--font-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lilac);font-weight:600}
.bg-stack{flex:1;width:100%;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:2px;padding:10px 6px;border-radius:18px;background:rgba(20,7,52,.5);overflow:hidden}
.bg-order .bg-stack{background:rgba(255,216,77,.08);border:1px dashed rgba(255,216,77,.4)}
.ing{width:86%;border-radius:8px;flex:none;position:relative}
.ing.small{transform:scaleY(.9)}
.ing.next{outline:2px solid var(--mint);outline-offset:2px}
.ing.done{opacity:.35}
.bg-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.bg-btns button{border:0;border-radius:14px;min-height:62px;background:var(--road);color:var(--paper);font-family:var(--font-body);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;touch-action:manipulation;padding:6px 2px}
.bg-btns button i{display:block;width:70%;border-radius:5px}
.bg-wrap.bad .bg-mine{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.stage[data-state="paused"] .bg-wrap,.stage[data-state="countdown"] .bg-wrap{visibility:hidden}
</style>
</head>
<body>
<div class="stage" id="stage">
<div class="bg-wrap" id="wrap">
  <div class="timebar" id="timebar"><i></i></div>
  <div class="bg-top">
    <div class="bg-col bg-order"><h3>Заказ</h3><div class="bg-stack" id="order"></div></div>
    <div class="bg-col bg-mine"><h3>Твой бургер</h3><div class="bg-stack" id="mine"></div></div>
  </div>
  <div class="bg-btns" id="btns"></div>
</div>
</div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['бургер', 'бургера', 'бургеров'];
  var ING = [
    { id: 'bun0', n: 'низ булки', col: '#E8A045', h: 16 }, { id: 'meat', n: 'котлета', col: '#7A4430', h: 14 }, { id: 'cheese', n: 'сыр', col: '#FFD84D', h: 8 },
    { id: 'salad', n: 'салат', col: '#3DF5B0', h: 9 }, { id: 'tomato', n: 'томат', col: '#FF6B4A', h: 9 }, { id: 'onion', n: 'лук', col: '#F4F1FF', h: 7 },
    { id: 'pickle', n: 'огурчик', col: '#1FA67A', h: 7 }, { id: 'bun1', n: 'верх булки', col: '#E8A045', h: 22, top: true }
  ];
  var byId = {}; ING.forEach(function (g) { byId[g.id] = g; });
  var orderEl = document.getElementById('order'), mineEl = document.getElementById('mine'), btns = document.getElementById('btns'), wrap = document.getElementById('wrap');
  var order = [], pos = 0, score = 0, made = 0, wrong = 0;
  var shell = P.shell({
    id: 'burger', title: 'Бургерная', tagline: 'Час пик. Заказы сыплются.',
    rulesHtml: '<p>Слева — заказ снизу вверх. Нажимай ингредиенты в том же порядке, от нижней булки до верхней. Ошибся — бургер в мусор и минус 3 секунды. Чем длиннее бургер, тем больше очков.</p>',
    countdown: true, overEyebrow: 'Кухня закрыта',
    unit: function (n) { return P.plural(n, U); }, onReset: reset
  });
  var timer = P.timeLimit(shell, 60, finish, document.getElementById('timebar'));
  ING.forEach(function (g) {
    var b = document.createElement('button'); b.type = 'button';
    b.innerHTML = '<i style="height:' + Math.max(8, g.h * 0.8) + 'px;background:' + g.col + (g.top ? ';border-radius:14px 14px 5px 5px' : '') + '"></i>' + g.n;
    b.addEventListener('click', function () { tap(g.id); });
    btns.appendChild(b);
  });
  function piece(g) { var d = document.createElement('div'); d.className = 'ing'; d.style.height = g.h + 'px'; d.style.background = g.col; if (g.top) d.style.borderRadius = '40px 40px 8px 8px'; if (g.id === 'bun0') d.style.borderRadius = '6px 6px 14px 14px'; if (g.id === 'salad') d.style.borderRadius = '10px'; return d; }
  function newOrder() {
    var n = 2 + Math.min(5, Math.floor(made / 2) + P.rand(2)), mid = ['meat', 'cheese', 'salad', 'tomato', 'onion', 'pickle'];
    order = ['bun0']; for (var i = 0; i < n; i++) order.push(i === 0 ? 'meat' : P.pick(mid)); order.push('bun1');
    pos = 0; render();
  }
  function render() {
    orderEl.textContent = ''; mineEl.textContent = '';
    order.forEach(function (id, i) { var d = piece(byId[id]); if (i < pos) d.className += ' done'; if (i === pos) d.className += ' next'; orderEl.appendChild(d); });
    for (var i = 0; i < pos; i++) mineEl.appendChild(piece(byId[order[i]]));
  }
  function tap(id) {
    if (!shell.running) return;
    if (order[pos] === id) {
      pos++; P.haptic('tap');
      if (pos >= order.length) { made++; score += order.length - 2; shell.setScore(String(made)); P.haptic('coin'); render(); setTimeout(function () { if (shell.running) newOrder(); }, 260); return; }
      render();
    } else {
      wrong++; P.haptic('crash'); timer.add(-3); wrap.classList.remove('bad'); void wrap.offsetWidth; wrap.classList.add('bad'); pos = 0; render();
    }
  }
  function reset() { made = 0; score = 0; wrong = 0; timer.reset(); shell.setScore('0'); newOrder(); }
  function finish() { shell.end({ score: made, delay: 300, stats: 'слоёв: ' + score + ' · ошибок: ' + wrong, phrase: 'В «Бургерной» я собрал ' + made + ' ' + P.plural(made, U) + ' за минуту. Обгонишь на кухне?' }); }
  window.addEventListener('keydown', function (e) { var m = /^Digit([1-8])$/.exec(e.code); if (m) tap(ING[m[1] - 1].id); });
  newOrder(); timer.show();
})();
</script>
</body>
</html>
