<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза</title>
<script src="shared/pauza.js?v=2"></script>
<script>
/* Ссылка вида t.me/Pauzagame_bot/play?startapp=race сразу открывает нужную игру */
(function () {
  var known = { race: 1, reaction: 1, tower: 1, '2048': 1, pairs: 1, math: 1 };
  var wanted = window.Pauza.startParam();
  if (wanted && known[wanted]) location.replace(wanted + '/' + location.hash);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="shared/pauza.css?v=2">
<style>
/* Экран выбора: шапка с названием и сетка карточек в две колонки */
body.hub{overflow-y:auto;height:auto;min-height:100%}
.hub-wrap{
  width:min(100%,460px);margin-inline:auto;display:flex;flex-direction:column;gap:20px;
  padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.hub-head{display:flex;align-items:center;gap:16px}
.hub-head .mark{height:46px}
.hub-head .mark i{width:16px;height:46px;border-radius:8px}
.hub-head h1{font-size:34px}
.hub-head .tag{margin:4px 0 0;font-size:15px}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{
  display:flex;flex-direction:column;height:100%;min-width:0;overflow:hidden;
  border-radius:18px;background:var(--shoulder);border:1px solid var(--line);
  color:var(--paper);text-decoration:none;
}
.card:active{transform:translateY(1px)}
.art{display:block;width:100%;aspect-ratio:16/9;background:var(--road)}
.art svg{display:block;width:100%;height:100%}
.card-body{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px}
.card-title{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.2}
.card-desc{font-size:13px;line-height:1.3;color:var(--lilac)}
.card-best{margin-top:4px;font-size:12px;color:var(--mint);font-variant-numeric:tabular-nums}
.hub-foot{margin:0;font-size:13px;color:var(--lilac);text-align:center}
.art text{font-family:"Unbounded","Arial Black",system-ui,sans-serif;font-weight:800}
</style>
</head>
<body class="hub">
<main class="hub-wrap">
  <header class="hub-head">
    <div class="mark" aria-hidden="true"><i></i><i></i></div>
    <div>
      <h1>Пауза</h1>
      <p class="tag">Игры на минуту, пока ждёшь ответа.</p>
    </div>
  </header>

  <ul class="cards">
    <li><a class="card" href="race/" data-id="race">
      <span class="art"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="160" height="90" fill="#22105A"/><rect x="30" width="100" height="90" fill="#3B1E8C"/>
        <rect x="29" width="2" height="90" fill="#3DF5B0"/><rect x="129" width="2" height="90" fill="#3DF5B0"/>
        <g fill="#3DF5B0" opacity=".3"><rect x="62.5" y="4" width="2" height="16" rx="1"/><rect x="62.5" y="36" width="2" height="16" rx="1"/><rect x="62.5" y="68" width="2" height="16" rx="1"/><rect x="95.5" y="4" width="2" height="16" rx="1"/><rect x="95.5" y="36" width="2" height="16" rx="1"/><rect x="95.5" y="68" width="2" height="16" rx="1"/></g>
        <rect x="37" y="8" width="19" height="31" rx="6" fill="#FF6B4A"/><rect x="104" y="-8" width="19" height="31" rx="6" fill="#FF9A6B"/>
        <rect x="70.5" y="50" width="19" height="31" rx="6" fill="#3DF5B0"/><circle cx="113.5" cy="54" r="5.5" fill="#FFD84D"/>
      </svg></span>
      <span class="card-body"><span class="card-title">Гонка</span><span class="card-desc">Уворачивайся от машин</span><span class="card-best" hidden></span></span>
    </a></li>

    <li><a class="card" href="tower/" data-id="tower">
      <span class="art"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="160" height="90" fill="#22105A"/>
        <rect x="48" y="74" width="64" height="11" rx="3" fill="#3DF5B0"/><rect x="54" y="62" width="56" height="11" rx="3" fill="#6FD3FF"/>
        <rect x="50" y="50" width="50" height="11" rx="3" fill="#B9A8F0"/><rect x="58" y="38" width="42" height="11" rx="3" fill="#FF8AD8"/>
        <rect x="84" y="20" width="42" height="11" rx="3" fill="#FFD84D"/>
      </svg></span>
      <span class="card-body"><span class="card-title">Башня</span><span class="card-desc">Роняй блоки ровно</span><span class="card-best" hidden></span></span>
    </a></li>

    <li><a class="card" href="2048/" data-id="2048">
      <span class="art"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="160" height="90" fill="#140734"/>
        <rect x="14" y="30" width="30" height="30" rx="7" fill="#2E1A78"/><rect x="48" y="30" width="30" height="30" rx="7" fill="#4B2FB8"/>
        <rect x="82" y="30" width="30" height="30" rx="7" fill="#B9A8F0"/><rect x="116" y="30" width="30" height="30" rx="7" fill="#3DF5B0"/>
        <g font-size="13" text-anchor="middle"><text x="29" y="50" fill="#F4F1FF">2</text><text x="63" y="50" fill="#F4F1FF">4</text><text x="97" y="50" fill="#120630">8</text><text x="131" y="50" fill="#120630">16</text></g>
      </svg></span>
      <span class="card-body"><span class="card-title">2048 за минуту</span><span class="card-desc">Складывай плитки на время</span><span class="card-best" hidden></span></span>
    </a></li>

    <li><a class="card" href="pairs/" data-id="pairs">
      <span class="art"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="160" height="90" fill="#3B1E8C"/>
        <rect x="21" y="20" width="36" height="50" rx="8" fill="#22105A"/><rect x="62" y="20" width="36" height="50" rx="8" fill="#140734"/><rect x="103" y="20" width="36" height="50" rx="8" fill="#22105A"/>
        <path d="M39 33 L41.9 40.4 L49.8 40.8 L43.7 45.9 L45.7 53.6 L39 49.3 L32.3 53.6 L34.3 45.9 L28.2 40.8 L36.1 40.4 Z" fill="#FFD84D"/>
        <path d="M121 33 L123.9 40.4 L131.8 40.8 L125.7 45.9 L127.7 53.6 L121 49.3 L114.3 53.6 L116.3 45.9 L110.2 40.8 L118.1 40.4 Z" fill="#FFD84D"/>
        <rect x="74.5" y="37" width="4" height="16" rx="2" fill="#3DF5B0"/><rect x="82" y="37" width="4" height="16" rx="2" fill="#3DF5B0" transform="rotate(9 84 53)"/>
      </svg></span>
      <span class="card-body"><span class="card-title">Пары</span><span class="card-desc">Найди одинаковые карточки</span><span class="card-best" hidden></span></span>
    </a></li>

    <li><a class="card" href="math/" data-id="math">
      <span class="art"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="160" height="90" fill="#22105A"/>
        <text x="80" y="40" font-size="17" text-anchor="middle" fill="#F4F1FF">7 × 8 = 54</text>
        <circle cx="62" cy="64" r="11" fill="#FF6B4A"/><path d="M57.5 59.5 L66.5 68.5 M66.5 59.5 L57.5 68.5" stroke="#120630" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="98" cy="64" r="11" fill="none" stroke="#3DF5B0" stroke-width="2"/><path d="M92.5 64.5 L96.5 68.5 L103.5 60" stroke="#3DF5B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg></span>
      <span class="card-body"><span class="card-title">Счёт</span><span class="card-desc">Верно или нет? 45 секунд</span><span class="card-best" hidden></span></span>
    </a></li>

    <li><a class="card" href="reaction/" data-id="reaction">
      <span class="art"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="160" height="90" fill="#3B1E8C"/>
        <circle cx="80" cy="45" r="54" fill="none" stroke="#3DF5B0" stroke-width="2" opacity=".14"/><circle cx="80" cy="45" r="42" fill="none" stroke="#3DF5B0" stroke-width="2" opacity=".32"/>
        <circle cx="80" cy="45" r="30" fill="#3DF5B0"/>
        <path d="M84 26 L69 48 H79 L75 64 L91 41 H81 Z" fill="#120630"/>
      </svg></span>
      <span class="card-body"><span class="card-title">Реакция</span><span class="card-desc">Жми на зелёный</span><span class="card-best" hidden></span></span>
    </a></li>
  </ul>

  <p class="hub-foot">Набери @Pauzagame_bot в любом чате, чтобы позвать друга.</p>
</main>

<script>
(function () {
  'use strict';
  var P = window.Pauza;
  P.init();
  var points = ['очко', 'очка', 'очков'];
  var units = {
    race: points,
    tower: ['этаж', 'этажа', 'этажей'],
    '2048': points,
    pairs: ['ход', 'хода', 'ходов'],
    math: ['пример', 'примера', 'примеров'],
    reaction: 'мс'
  };
  /* Рекорд гонки из первой версии игры */
  if (P.store.get('pz_best_race', null) === null && P.store.get('pz_best', 0) > 0) {
    P.store.set('pz_best_race', P.store.get('pz_best', 0));
  }
  Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
    var id = card.getAttribute('data-id');
    var best = P.store.get('pz_best_' + id, null);
    if (best === null) return;
    var u = units[id];
    var line = card.querySelector('.card-best');
    line.textContent = 'Рекорд: ' + P.fmt(best) + ' ' + (typeof u === 'string' ? u : P.plural(best, u));
    line.hidden = false;
  });
})();
</script>
</body>
</html>
