<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Ножи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=5">
<style>.stage{background:#140734}</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="game" aria-label="Ножи. Тап — бросить нож в бревно"></canvas></div>
<script src="../shared/pauza.js?v=5"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['нож', 'ножа', 'ножей'];
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var level, stuck, need, left, rot, spin, t, flying, score, apples, bits, shake, dead, clearT;

  var shell = P.shell({
    id: 'knives', title: 'Ножи', tagline: 'Втыкай ножи в бревно и не задевай другие.',
    rulesHtml: '<p>Тап бросает нож в крутящееся бревно. Если нож попадёт в уже воткнутый, игра окончена. Воткни все ножи уровня, и бревно расколется. Яблоки на бревне дают +3.</p>',
    startLabel: 'Бросать', overEyebrow: 'Нож отскочил', countdown: true,
    unit: function (n) { return P.plural(n, ['очко', 'очка', 'очков']); },
    kbdHint: 'На компьютере: пробел — бросок, P — пауза', pauseKeys: ['KeyP', 'Escape'],
    onReset: reset
  });
  var view = P.canvas(canvas, stage, function () { draw(); });
  function R() { return Math.min(view.W * 0.27, view.H * 0.17); }
  function cy() { return view.H * 0.36; }
  function angDiff(a, b) { var d = (a - b) % (Math.PI * 2); if (d < -Math.PI) d += Math.PI * 2; if (d > Math.PI) d -= Math.PI * 2; return Math.abs(d); }
  function setup(l) {
    level = l; stuck = []; apples = []; flying = null; rot = 0; t = 0; clearT = 0;
    need = Math.min(11, 5 + l); left = need;
    var pre = l < 2 ? 0 : Math.min(4, Math.floor(l / 2) + P.rand(2));
    for (var i = 0; i < pre; i++) { var a; do { a = Math.random() * Math.PI * 2; } while (stuck.some(function (k) { return angDiff(k, a) < 0.5; })); stuck.push(a); }
    var ac = l % 2 === 0 ? 1 : 2;
    for (i = 0; i < ac; i++) { do { a = Math.random() * Math.PI * 2; } while (stuck.concat(apples.map(function (x) { return x.a; })).some(function (k) { return angDiff(k, a) < 0.45; })); apples.push({ a: a }); }
    spin = function (time) {
      var base = 1.5 + Math.min(2.2, l * 0.22);
      if (l % 3 === 2) return base * Math.sin(time * 0.9) * 1.4;
      if (l % 3 === 1) return base * (1 + 0.6 * Math.sin(time * 2.2));
      return (l % 2 ? -1 : 1) * base;
    };
    showSide();
  }
  function showSide() { shell.setSide('ур. ' + (level + 1) + ' · ' + left); }
  function reset() { score = 0; bits = []; shake = 0; dead = false; setup(0); shell.setScore('0'); }
  function throwKnife() {
    if (!shell.running || dead || flying || left <= 0 || clearT > 0) return;
    flying = { y: view.H * 0.82 };
    left--; showSide();
  }
  function lose() {
    dead = true; shake = 0.4;
    shell.end({ score: score, delay: 800, haptic: 'crash', stats: 'уровень: ' + (level + 1),
      phrase: 'В «Ножах» у меня ' + score + ' ' + P.plural(score, ['очко', 'очка', 'очков']) + ', уровень ' + (level + 1) + '.' });
  }
  P.loop(function (dt) {
    if (shake > 0) shake -= dt;
    bits.forEach(function (b) { b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 900 * dt; b.r += b.vr * dt; b.life -= dt; });
    bits = bits.filter(function (b) { return b.life > 0; });
    if (shell.running && !dead) {
      t += dt;
      rot += spin(t) * dt;
      if (clearT > 0) { clearT -= dt; if (clearT <= 0) setup(level + 1); }
      if (flying) {
        flying.y -= view.H * 3.2 * dt;
        var hitY = cy() + R();
        if (flying.y <= hitY) {
          var a = Math.PI / 2 - rot;
          if (stuck.some(function (k) { return angDiff(k, a) < 0.2; })) {
            bits.push({ x: view.W / 2, y: hitY, vx: (Math.random() - 0.5) * 300, vy: 200, r: 0, vr: 14, life: 1.2, knife: true });
            flying = null; lose(); return;
          }
          stuck.push(a); flying = null; score++; P.haptic('tap');
          apples = apples.filter(function (ap) {
            if (angDiff(ap.a, a) < 0.28) { score += 3; P.haptic('coin'); for (var k = 0; k < 6; k++) bits.push({ x: view.W / 2 + Math.cos(ap.a + rot) * R(), y: cy() + Math.sin(ap.a + rot) * R(), vx: (Math.random() - 0.5) * 300, vy: -Math.random() * 300, r: 0, vr: 6, life: 0.8, apple: true }); return false; }
            return true;
          });
          shell.setScore(String(score));
          if (left === 0 && stuck.length) {
            clearT = 0.7; score += 5; shell.setScore(String(score)); P.haptic('win');
            for (var k = 0; k < 10; k++) bits.push({ x: view.W / 2, y: cy(), vx: (Math.random() - 0.5) * 520, vy: -Math.random() * 400, r: Math.random() * 6, vr: (Math.random() - 0.5) * 10, life: 1.4, wood: true });
          }
        }
      }
    }
    draw();
  });
  function knife(ctx, x, y, ang, len) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    var gold = P.gold();
    ctx.fillStyle = gold ? '#FFD84D' : '#F4F1FF';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len * 0.09, len * 0.12); ctx.lineTo(len * 0.07, len * 0.6); ctx.lineTo(-len * 0.07, len * 0.6); ctx.lineTo(-len * 0.09, len * 0.12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FF6B4A'; ctx.beginPath(); ctx.roundRect(-len * 0.07, len * 0.6, len * 0.14, len * 0.4, 4); ctx.fill();
    ctx.restore();
  }
  function draw() {
    var ctx = view.ctx, W = view.W, H = view.H, r = R(), x = W / 2, y = cy(), len = r * 0.95;
    ctx.fillStyle = '#140734'; ctx.fillRect(0, 0, W, H);
    if (rot == null) return;
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 10 * shake);
    if (clearT <= 0) {
      stuck.forEach(function (a) { var ang = a + rot; knife(ctx, x + Math.cos(ang) * r * 0.86, y + Math.sin(ang) * r * 0.86, ang - Math.PI / 2, len); });
      ctx.fillStyle = '#FF9A6B'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(18,6,48,0.25)'; ctx.lineWidth = 3;
      [0.75, 0.5, 0.25].forEach(function (k) { ctx.beginPath(); ctx.arc(x, y, r * k, 0, Math.PI * 2); ctx.stroke(); });
      ctx.fillStyle = '#FF6B4A'; ctx.beginPath(); ctx.arc(x, y, r * 0.12, 0, Math.PI * 2); ctx.fill();
      apples.forEach(function (ap) { var ang = ap.a + rot; ctx.fillStyle = '#3DF5B0'; ctx.beginPath(); ctx.arc(x + Math.cos(ang) * r * 1.13, y + Math.sin(ang) * r * 1.13, r * 0.13, 0, Math.PI * 2); ctx.fill(); });
    }
    ctx.restore();
    bits.forEach(function (b) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.globalAlpha = Math.min(1, b.life * 2);
      if (b.knife) knife(ctx, 0, 0, 0, len);
      else { ctx.fillStyle = b.apple ? '#3DF5B0' : '#FF9A6B'; ctx.fillRect(-r * 0.15, -r * 0.08, r * 0.3, r * 0.16); }
      ctx.restore();
    });
    ctx.globalAlpha = 1;
    if (flying) knife(ctx, x, flying.y, 0, len);
    else if (!dead && left > 0 && clearT <= 0) knife(ctx, x, H * 0.82, 0, len);
    for (var i = 0; i < need; i++) {
      ctx.fillStyle = i < left ? '#F4F1FF' : 'rgba(244,241,255,0.2)';
      ctx.fillRect(18, H - 30 - i * 16, 5, 11);
    }
  }
  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); throwKnife(); });
  window.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); throwKnife(); } });
  reset();
  P.syncPerks();
})();
</script>
</body>
</html>
