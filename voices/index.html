<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Голосовые</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=4">
<style>
.stage{background:#17093F}
.play{gap:16px}
.rule{margin:0;color:var(--lilac);font-size:14px;text-align:center;line-height:1.4}
.rule b{color:var(--paper)}
.card{width:min(100%,340px);padding:16px;border-radius:22px;background:#2E177A;display:flex;flex-direction:column;gap:12px;transition:transform .18s,opacity .18s;touch-action:pan-y}
.card.go-l{transform:translateX(-120%) rotate(-12deg);opacity:0}
.card.go-r{transform:translateX(120%) rotate(12deg);opacity:0}
.from{display:flex;align-items:center;gap:10px}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;color:var(--ink)}
.from b{font-size:16px}
.from span{display:block;font-size:13px;color:var(--lilac)}
.voice{display:flex;align-items:center;gap:12px}
.voice .pbtn{width:46px;height:46px;border-radius:50%;background:var(--mint);flex:none;display:grid;place-items:center}
.voice .pbtn::after{content:"";border-left:14px solid var(--ink);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:36px}
.wave i{flex:1;border-radius:2px;background:var(--lilac)}
.dur{font-family:var(--font-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.dur.long{color:var(--coral)}
.timer{height:5px;border-radius:3px;background:rgba(244,241,255,.1);overflow:hidden}
.timer i{display:block;height:100%;background:var(--sun);transform-origin:left}
.say{margin:0;min-height:2.6em;color:var(--sun);font-size:14px;text-align:center;line-height:1.35}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,340px)}
.btns button{min-height:58px;border:0;border-radius:18px;font-family:var(--font-display);font-weight:600;font-size:15px;cursor:pointer;touch-action:manipulation}
.skip{background:var(--road);color:var(--paper)}
.listen{background:var(--mint);color:var(--ink)}
.stage[data-state="paused"] .card{visibility:hidden}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="play">
    <p class="rule">До <b>30 секунд</b> — слушай. Длиннее — мимо.</p>
    <div class="card" id="card"></div>
    <p class="say" id="say"></p>
    <div class="btns"><button class="skip" type="button" id="skip">← Потом</button><button class="listen" type="button" id="listen">Послушать →</button></div>
  </div>
</div>
<script src="../shared/pauza.js?v=4"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['голосовое', 'голосовых', 'голосовых'], LIVES = 3;
  var FROM = [['Мама', '#FFD84D'], ['Лёха', '#6FD3FF'], ['Тётя Люба', '#FF8AD8'], ['Староста', '#3DF5B0'], ['Начальник', '#FF9A6B'], ['Сосед', '#B9A8F0'], ['Бабушка', '#FF6B4A'], ['Димон', '#6FD3FF'], ['Чат дома', '#FFD84D'], ['Курьер', '#3DF5B0']];
  var LONG = ['Пять минут про то, как прошёл день у кота', 'Двенадцать минут, из них одиннадцать — «эээ»', 'Тётя Люба пересказала весь сериал', 'Это был рецепт борща. С историей семьи', 'Начальник думал вслух. Долго', 'В конце было «короче, неважно»', 'Семь минут шума ветра и одно «пока»', 'Это можно было написать словом «ок»'];
  var SHORT = ['Пропущено важное: «я у подъезда»', 'А там было «выходи, я внизу»', 'Это было «купи хлеба». Хлеба нет', 'Там было «ты где?». Ты в игнор-листе', 'Там было «спасибо». Неловко вышло'];
  var cardEl = document.getElementById('card'), say = document.getElementById('say');
  var cur, left, limit, lives, score, busy, timeBar;

  var shell = P.shell({
    id: 'voices', title: 'Голосовые', tagline: 'Короткие слушай, длинные — мимо.',
    rulesHtml: '<p>Тебе шлют голосовые. Короткое, до 30 секунд, — жми «Послушать» или смахни вправо. Длинное — «Потом» или смахни влево. Ошибся или не успел — минус жизнь. Их три. Голосовые приходят всё быстрее.</p>',
    startLabel: 'Открыть чат', countdown: true, overEyebrow: 'Чат утонул в голосовых',
    unit: function (n) { return P.plural(n, U); },
    kbdHint: 'На компьютере: стрелки влево и вправо',
    onReset: reset
  });
  function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function newVoice() {
    var f = P.pick(FROM), long = Math.random() < 0.5;
    var sec = long ? (Math.random() < 0.5 ? 31 + P.rand(60) : 60 + P.rand(700)) : 1 + P.rand(30);
    if (!long && sec > 30) sec = 30;
    if (score > 6 && Math.random() < 0.35) sec = long ? 31 + P.rand(8) : 24 + P.rand(7);
    cur = { f: f, sec: sec, long: sec > 30 };
    var bars = ''; for (var i = 0; i < 28; i++) bars += '<i style="height:' + (20 + Math.random() * 80) + '%"></i>';
    cardEl.className = 'card';
    cardEl.innerHTML = '<div class="from"><div class="ava" style="background:' + f[1] + '">' + f[0][0] + '</div><div><b>' + f[0] + '</b><span>голосовое сообщение</span></div></div>' +
      '<div class="voice"><div class="pbtn"></div><div class="wave">' + bars + '</div><div class="dur">' + fmt(sec) + '</div></div><div class="timer"><i id="tb"></i></div>';
    timeBar = document.getElementById('tb');
    limit = Math.max(1.1, 3 - score * 0.08); left = limit; busy = false;
  }
  function act(listen) {
    if (!shell.running || busy || !cur) return;
    busy = true;
    var right = listen === !cur.long;
    cardEl.classList.add(listen ? 'go-r' : 'go-l');
    if (right) { score++; shell.setScore(String(score)); P.haptic('coin'); say.textContent = listen ? 'Быстро и по делу' : 'Сэкономлено ' + fmt(cur.sec); }
    else { lose(listen ? P.pick(LONG) : P.pick(SHORT)); }
    setTimeout(function () { if (shell.running) newVoice(); }, 220);
  }
  function lose(text) {
    lives--; side(); P.haptic('crash'); say.textContent = text;
    if (lives <= 0) shell.end({ score: score, delay: 700, stats: 'разобрано голосовых: ' + score, phrase: 'В «Голосовых» я разгребаю ' + score + ' ' + P.plural(score, U) + ' подряд. А ты?' });
  }
  function side() { var s = ''; for (var i = 0; i < LIVES; i++) s += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + (i < lives ? '#3DF5B0' : 'rgba(185,168,240,.3)') + '"></span>'; shell.setSide(s); }
  function reset() { lives = LIVES; score = 0; shell.setScore('0'); side(); say.textContent = ''; newVoice(); }
  P.loop(function (dt) {
    if (!shell.running || busy || !cur) return;
    left -= dt; if (timeBar) timeBar.style.transform = 'scaleX(' + Math.max(0, left / limit).toFixed(3) + ')';
    if (left <= 0) { busy = true; lose(cur.long ? 'Голосовое на ' + fmt(cur.sec) + ' начало играть само' : 'Время вышло — уже пришло второе'); cardEl.classList.add('go-l'); setTimeout(function () { if (shell.running) newVoice(); }, 260); }
  });
  document.getElementById('skip').addEventListener('click', function () { act(false); });
  document.getElementById('listen').addEventListener('click', function () { act(true); });
  P.gestures(cardEl, { swipe: function (d) { if (d === 'left') act(false); if (d === 'right') act(true); } });
  P.arrows(function (d) { if (d === 'left') act(false); if (d === 'right') act(true); });
  newVoice();
})();
</script>
</body>
</html>
