<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Боулинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>.stage{background:#140734}</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="game" aria-label="Боулинг. Смахни шар вверх по дорожке"></canvas></div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var U = ['кегля', 'кегли', 'кеглей'], TOP = 70, FRAMES = 5, SUB = 6;
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var L = null, br = 10, pr = 6, pins = [], ball = null, frame = 0, roll = 0, total = 0, strikes = 0, cards = [], drag = null, phase = 'aim', phaseT = 0, msg = null, gx = 0;

  var shell = P.shell({
    id: 'bowling', title: 'Боулинг', tagline: 'Пять фреймов, десять кеглей в каждом.',
    rulesHtml: '<p>Поставь палец на шар и смахни вверх по дорожке: куда смахнёшь, туда и покатится, чем быстрее — тем сильнее. В каждом фрейме два броска. Пять фреймов, считаем все сбитые кегли — максимум 50.</p>',
    startLabel: 'На дорожку', countdown: false, overEyebrow: 'Игра окончена', overTone: 'good',
    unit: function (n) { return P.plural(n, U); },
    kbdHint: 'На компьютере: стрелки влево и вправо — сдвинуть шар, вверх — бросить',
    onReset: reset
  });
  var view = P.canvas(canvas, stage, function () { var keep = L; layout(); if (!keep || !pins.length) setPins(); else setPins(true); });
  function layout() {
    var W = view.W, H = view.H, w = Math.min(W * 0.66, 290);
    L = { x: (W - w) / 2, y: TOP + 8, w: w, h: H - TOP - 20 };
    gx = w * 0.1; br = w * 0.075; pr = w * 0.042;
  }
  function surf() { return { a: L.x + gx, b: L.x + L.w - gx }; }
  function setPins(keepState) {
    var cx = L.x + L.w / 2, hy = L.y + L.h * 0.26, sx = L.w * 0.165, old = pins;
    pins = [];
    for (var r = 0; r < 4; r++) for (var i = 0; i <= r; i++) {
      var x = cx + (i - r / 2) * sx, y = hy - r * sx * 0.87, o = old[pins.length];
      pins.push({ x: x, y: y, x0: x, y0: y, vx: 0, vy: 0, down: keepState && o ? o.down : false, gone: keepState && o ? o.gone : false });
    }
    if (!keepState || !ball) newBall();
  }
  function newBall() { ball = { x: L.x + L.w / 2, y: L.y + L.h - br * 1.6, vx: 0, vy: 0, gutter: false }; phase = 'aim'; }
  function reset() { frame = 0; roll = 0; total = 0; strikes = 0; cards = []; msg = null; drag = null; if (L) { setPins(); } shell.setScore('0'); side(); }
  function side() { shell.setSide('фрейм ' + Math.min(FRAMES, frame + 1) + '/' + FRAMES); }
  function launch(vx, vy) {
    if (phase !== 'aim' || !shell.running) return;
    var sp = Math.hypot(vx, vy), lim = L.h * 2.3, min = L.h * 0.9;
    if (sp > lim) { vx *= lim / sp; vy *= lim / sp; } else if (sp < min) { vx *= min / sp; vy *= min / sp; }
    if (Math.abs(vx) > Math.abs(vy) * 0.3) vx = Math.sign(vx) * Math.abs(vy) * 0.3;
    ball.vx = vx; ball.vy = vy; phase = 'roll'; phaseT = 0; P.haptic('tap');
  }
  function collide(a, b, ma, mb, rr) {
    var dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d >= rr || d < 1e-6) return false;
    var nx = dx / d, ny = dy / d, o = rr - d, ta = mb / (ma + mb), tb = ma / (ma + mb);
    a.x -= nx * o * ta; a.y -= ny * o * ta; b.x += nx * o * tb; b.y += ny * o * tb;
    var vr = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (vr > 0) { var j = 1.85 * vr / (1 / ma + 1 / mb); a.vx -= j / ma * nx; a.vy -= j / ma * ny; b.vx += j / mb * nx; b.vy += j / mb * ny; }
    return true;
  }
  function physics(h) {
    var s = surf();
    if (phase === 'roll') {
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      if (!ball.gutter && (ball.x - br * 0.6 < s.a || ball.x + br * 0.6 > s.b)) { ball.gutter = true; ball.vx = 0; ball.x = ball.x < L.x + L.w / 2 ? L.x + gx / 2 : L.x + L.w - gx / 2; P.haptic('crash'); }
    }
    var live = pins.filter(function (p) { return !p.gone; });
    live.forEach(function (p) {
      p.x += p.vx * h; p.y += p.vy * h;
      if (!ball.gutter && phase === 'roll' && collide(ball, p, 6, 1, br + pr)) p.down = true;
    });
    for (var i = 0; i < live.length; i++) for (var j = i + 1; j < live.length; j++) {
      var a = live[i], b = live[j];
      if (collide(a, b, 1, 1, pr * 2)) { if (Math.hypot(a.vx, a.vy) > L.w * 0.2 || a.down) b.down = true; if (Math.hypot(b.vx, b.vy) > L.w * 0.2 || b.down) a.down = true; }
    }
    live.forEach(function (p) {
      if (Math.hypot(p.x - p.x0, p.y - p.y0) > pr * 0.7) p.down = true;
      if (p.x < s.a || p.x > s.b || p.y < L.y) { p.down = true; }
    });
  }
  function settle() {
    var knocked = 0;
    pins.forEach(function (p) { if (p.down && !p.gone) { p.gone = true; knocked++; } p.vx = p.vy = 0; });
    var standing = pins.filter(function (p) { return !p.gone; }).length;
    total += knocked; shell.setScore(String(total));
    cards[frame] = (cards[frame] || 0) + knocked;
    var next = false;
    if (standing === 0) {
      if (roll === 0) { strikes++; msg = { text: 'Страйк!', life: 1.2 }; P.haptic('win'); }
      else { msg = { text: 'Спэр!', life: 1.2 }; P.haptic('coin'); }
      next = true;
    } else if (roll === 1) { next = true; msg = { text: knocked ? '+' + knocked : 'Мимо', life: 0.9 }; }
    else { roll = 1; msg = { text: knocked ? '+' + knocked : 'Мимо', life: 0.9 }; }
    if (next) {
      frame++; roll = 0;
      if (frame >= FRAMES) {
        phase = 'done';
        shell.end({ score: total, delay: 900, stats: 'страйков: ' + strikes + ' · по фреймам: ' + cards.join(' · '), phrase: 'В «Боулинге» я выбиваю ' + total + ' ' + P.plural(total, U) + ' из 50. Сможешь больше?' });
        return;
      }
      side(); setPins();
    } else newBall();
  }
  P.loop(function (dt) {
    if (!L || !ball) return;
    if (shell.running && phase === 'roll') {
      phaseT += dt;
      for (var s = 0; s < SUB; s++) physics(dt / SUB);
      pins.forEach(function (p) { var f = Math.pow(0.18, dt); p.vx *= f; p.vy *= f; });
      var still = pins.every(function (p) { return p.gone || Math.hypot(p.vx, p.vy) < L.w * 0.05; });
      if ((ball.y < L.y - br * 2 && still) || phaseT > 5) { phase = 'wait'; phaseT = 0.5; }
    } else if (shell.running && phase === 'wait') { phaseT -= dt; if (phaseT <= 0) settle(); }
    if (msg) { msg.life -= dt; if (msg.life <= 0) msg = null; }
    draw();
  });
  function draw() {
    var ctx = view.ctx, W = view.W, H = view.H;
    ctx.fillStyle = '#140734'; ctx.fillRect(0, 0, W, H);
    if (!L) return;
    ctx.fillStyle = '#22105A'; ctx.beginPath(); ctx.roundRect(L.x, L.y, L.w, L.h, 10); ctx.fill();
    var s = surf();
    ctx.fillStyle = '#E9C38A'; ctx.fillRect(s.a, L.y, s.b - s.a, L.h);
    ctx.fillStyle = 'rgba(160,100,40,.18)'; for (var k = 1; k < 8; k++) ctx.fillRect(s.a + (s.b - s.a) * k / 8, L.y, 1.5, L.h);
    ctx.fillStyle = '#C0392B';
    for (var a = 0; a < 5; a++) { var ax = s.a + (s.b - s.a) * (a + 1) / 6, ay = L.y + L.h * 0.62; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax - 5, ay + 12); ctx.lineTo(ax + 5, ay + 12); ctx.fill(); }
    ctx.fillStyle = 'rgba(192,57,43,.6)'; ctx.fillRect(s.a, L.y + L.h * 0.8, s.b - s.a, 3);
    pins.forEach(function (p) {
      if (p.gone) return;
      if (p.down) { ctx.globalAlpha = 0.6; ctx.fillStyle = '#F4F1FF'; ctx.beginPath(); ctx.ellipse(p.x, p.y, pr * 1.6, pr * 0.7, Math.atan2(p.vy, p.vx) || 0.6, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; return; }
      ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.arc(p.x + 2, p.y + 3, pr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#F4F1FF'; ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#FF6B4A'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, pr * 0.62, 0, Math.PI * 2); ctx.stroke();
    });
    if (ball && phase !== 'done' && ball.y > L.y - br * 2) {
      ctx.fillStyle = P.gold() ? '#FFD84D' : '#3B1E8C'; ctx.beginPath(); ctx.arc(ball.x, ball.y, br, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = P.gold() ? '#B8860B' : '#6FD3FF';
      [[-0.25, -0.3], [0.2, -0.32], [0, 0.05]].forEach(function (h) { ctx.beginPath(); ctx.arc(ball.x + h[0] * br, ball.y + h[1] * br, br * 0.13, 0, Math.PI * 2); ctx.fill(); });
    }
    if (drag && phase === 'aim') {
      ctx.strokeStyle = 'rgba(244,241,255,.6)'; ctx.lineWidth = 3; ctx.setLineDash([5, 6]);
      ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(ball.x + (drag.x - drag.sx) * 2, ball.y + (drag.y - drag.sy) * 2); ctx.stroke(); ctx.setLineDash([]);
    }
    if (phase === 'aim' && !drag && shell.running) { ctx.fillStyle = 'rgba(18,6,48,.7)'; ctx.font = '600 13px Onest, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(roll ? 'Второй бросок' : 'Смахни шар вверх', L.x + L.w / 2, L.y + L.h * 0.74); }
    if (msg) { ctx.globalAlpha = Math.min(1, msg.life * 2); ctx.fillStyle = '#FF6B4A'; ctx.font = '800 24px Unbounded, "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.fillText(msg.text, L.x + L.w / 2, L.y + L.h * 0.5); ctx.globalAlpha = 1; }
  }
  function pos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointerdown', function (e) {
    if (phase !== 'aim' || !shell.running) return;
    var p = pos(e), s = surf();
    ball.x = P.clamp(p.x, s.a + br, s.b - br);
    drag = { sx: p.x, sy: p.y, x: p.x, y: p.y, t: performance.now(), pts: [{ x: p.x, y: p.y, t: performance.now() }] };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return; var p = pos(e), now = performance.now();
    drag.x = p.x; drag.y = p.y; drag.pts.push({ x: p.x, y: p.y, t: now });
    while (drag.pts.length > 2 && now - drag.pts[0].t > 160) drag.pts.shift();
  });
  canvas.addEventListener('pointerup', function () {
    if (!drag) return;
    var d = drag; drag = null;
    var a = d.pts[0], b = d.pts[d.pts.length - 1], dt = Math.max(0.03, (b.t - a.t) / 1000);
    if (d.y - d.sy > -30 || b.y >= a.y) return;
    launch((b.x - a.x) / dt, (b.y - a.y) / dt);
  });
  canvas.addEventListener('pointercancel', function () { drag = null; });
  P.arrows(function (dir) {
    if (phase !== 'aim' || !shell.running) return;
    var s = surf();
    if (dir === 'left') ball.x = Math.max(s.a + br, ball.x - L.w * 0.04);
    if (dir === 'right') ball.x = Math.min(s.b - br, ball.x + L.w * 0.04);
    if (dir === 'up') launch(0, -L.h * 1.6);
  });
})();
</script>
</body>
</html>
