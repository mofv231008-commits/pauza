<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · Отскок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>
.stage{background:var(--night)}
.heart{display:inline-block;width:12px;height:12px;background:var(--coral);transform:rotate(45deg);border-radius:2px 0 2px 2px;position:relative;margin-right:4px}
.heart::before,.heart::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--coral)}
.heart::before{left:-6px;top:0}
.heart::after{left:0;top:-6px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="game" aria-label="Отскок. Веди пальцем, чтобы двигать платформу"></canvas>
</div>

<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var COLS = 7, ROWS = 6, LIVES = 3;
  var BRICKS = ['кирпич', 'кирпича', 'кирпичей'];
  var ROW_COLORS = ['#FF6B4A', '#FF9A6B', '#FFD84D', '#3DF5B0', '#6FD3FF', '#B9A8F0'];

  var stage = document.getElementById('stage'), canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  var W = 1, H = 1, dpr = 1;
  var top = 0, brickW = 0, brickH = 0, padY = 0;

  var paddle = { x: 0.5, w: 0.24 }, target = 0.5;
  var ball = { x: 0, y: 0, vx: 0, vy: 0, stuck: true }, stuckT = 0;
  var bricks = [], broken = 0, lives = LIVES, level = 1, particles = [], flash = 0, over = false;

  var shell = P.shell({
    id: 'bounce',
    title: 'Отскок',
    tagline: 'Разбей все кирпичи мячом.',
    rulesHtml: '<p>Веди пальцем по экрану, и платформа поедет за ним. Мяч отскакивает под разными углами в зависимости от того, куда попал. Три жизни.</p>',
    overEyebrow: 'Мяч улетел',
    countdown: true,
    formatScore: function (n) { return String(n); },
    unit: function (n) { return P.plural(n, BRICKS); },
    kbdHint: 'На компьютере: стрелки или мышь, пробел — пауза',
    onReset: reset
  });

  function buildWall() {
    bricks = [];
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) bricks.push({ r: r, c: c, alive: true });
  }
  function ballR() { return Math.max(6, W * 0.022); }
  function baseSpeed() { return H * (0.62 + (level - 1) * 0.08); }
  function stick() { ball.stuck = true; stuckT = 0.6; ball.vx = 0; ball.vy = 0; }
  function sideHtml() {
    var s = '';
    for (var i = 0; i < lives; i++) s += '<span class="heart"></span>';
    return s || '0';
  }
  function reset() {
    buildWall(); broken = 0; lives = LIVES; level = 1; particles = []; flash = 0; over = false;
    paddle.x = 0.5; target = 0.5; paddle.w = 0.24;
    stick();
    shell.setScore('0');
    shell.setSide(sideHtml());
  }
  function demo() {
    buildWall();
    [2, 3, 9, 10, 11, 17, 24].forEach(function (i) { bricks[i].alive = false; });
    paddle.x = 0.42; ball.stuck = false; ball.x = W * 0.55; ball.y = H * 0.62;
  }
  function launch() {
    var a = (-0.35 + Math.random() * 0.7) - Math.PI / 2, v = baseSpeed();
    ball.vx = Math.cos(a) * v; ball.vy = Math.sin(a) * v; ball.stuck = false;
  }
  function burst(x, y, color) {
    if (P.reduceMotion) return;
    for (var i = 0; i < 8; i++) {
      var a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
      particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, c: color });
    }
  }
  function brickRect(b) {
    var gap = 4;
    return { x: b.c * brickW + gap / 2, y: top + b.r * brickH + gap / 2, w: brickW - gap, h: brickH - gap };
  }
  function finish() {
    over = true;
    shell.end({
      score: broken,
      delay: 600,
      haptic: 'crash',
      stats: 'уровень: ' + level,
      phrase: 'В «Отскоке» у меня ' + broken + ' ' + P.plural(broken, BRICKS) + '.'
    });
  }

  function update(dt) {
    var run = shell.running && !over;
    var pw = paddle.w * W;
    if (shell.state !== 'paused') {
      paddle.x += (target - paddle.x) * Math.min(1, dt * 18);
      paddle.x = P.clamp(paddle.x, paddle.w / 2, 1 - paddle.w / 2);
    }
    var px = paddle.x * W, r = ballR();
    if (ball.stuck) {
      ball.x = px; ball.y = padY - r - 1;
      if (run) { stuckT -= dt; if (stuckT <= 0) launch(); }
    } else if (run) {
      var steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / (r * 0.5)) || 1;
      var sdt = dt / steps;
      for (var s = 0; s < steps && !ball.stuck && !over; s++) moveBall(sdt, r, px, pw);
    }
    particles.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; });
    particles = particles.filter(function (p) { return p.life > 0; });
    if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
  }
  function moveBall(dt, r, px, pw) {
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    if (ball.x < r) { ball.x = r; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - r) { ball.x = W - r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < top * 0.55 + r) { ball.y = top * 0.55 + r; ball.vy = Math.abs(ball.vy); }
    /* Платформа: угол отскока зависит от точки попадания */
    if (ball.vy > 0 && ball.y + r >= padY && ball.y + r <= padY + 16 && Math.abs(ball.x - px) <= pw / 2 + r) {
      var off = P.clamp((ball.x - px) / (pw / 2), -1, 1);
      var ang = -Math.PI / 2 + off * 1.05;
      var v = Math.max(Math.hypot(ball.vx, ball.vy), baseSpeed());
      ball.vx = Math.cos(ang) * v; ball.vy = Math.sin(ang) * v;
      ball.y = padY - r;
      P.haptic('tap');
    }
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      var rc = brickRect(b);
      var nx = P.clamp(ball.x, rc.x, rc.x + rc.w), ny = P.clamp(ball.y, rc.y, rc.y + rc.h);
      var dx = ball.x - nx, dy = ball.y - ny;
      if (dx * dx + dy * dy > r * r) continue;
      b.alive = false; broken++;
      shell.setScore(String(broken));
      burst(rc.x + rc.w / 2, rc.y + rc.h / 2, ROW_COLORS[b.r]);
      P.haptic('coin');
      if (Math.abs(dx) > Math.abs(dy)) ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
      else ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
      var sp = Math.hypot(ball.vx, ball.vy) * 1.006;
      var k = sp / Math.hypot(ball.vx, ball.vy); ball.vx *= k; ball.vy *= k;
      if (bricks.every(function (x) { return !x.alive; })) {
        level++; buildWall(); paddle.w = Math.max(0.16, paddle.w - 0.02); stick();
        P.haptic('win'); shell.toast('Уровень ' + level);
      }
      break;
    }
    if (ball.y - r > H) {
      lives--; flash = 1;
      shell.setSide(sideHtml());
      P.haptic('crash');
      if (lives <= 0) finish(); else stick();
    }
  }

  function rr(x, y, w, h, rad) {
    rad = Math.max(0, Math.min(rad, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }
  function draw() {
    ctx.fillStyle = '#140734'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(185,168,240,0.05)';
    for (var gx = 0; gx < W; gx += 28) ctx.fillRect(gx, 0, 1, H);
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      var rc = brickRect(b);
      ctx.fillStyle = ROW_COLORS[b.r]; rr(rc.x, rc.y, rc.w, rc.h, 5); ctx.fill();
      ctx.fillStyle = 'rgba(18,6,48,0.18)'; ctx.fillRect(rc.x + 3, rc.y + rc.h - 4, rc.w - 6, 2);
    }
    particles.forEach(function (p) { ctx.globalAlpha = P.clamp(p.life * 2, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); });
    ctx.globalAlpha = 1;
    var pw = paddle.w * W, px = paddle.x * W;
    ctx.fillStyle = '#3DF5B0'; rr(px - pw / 2, padY, pw, 12, 6); ctx.fill();
    ctx.fillStyle = '#F4F1FF';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ballR(), 0, Math.PI * 2); ctx.fill();
    if (flash > 0) { ctx.fillStyle = 'rgba(255,107,74,' + (flash * 0.3).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    top = 96; brickW = W / COLS; brickH = Math.max(18, Math.min(30, H * 0.034));
    padY = H - Math.max(H * 0.1, 70);
    if (shell.state === 'start') demo();
    draw();
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  function aim(e) {
    if (shell.state !== 'running' && shell.state !== 'countdown') return;
    var rect = canvas.getBoundingClientRect();
    target = P.clamp((e.clientX - rect.left) / rect.width, 0, 1);
  }
  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); aim(e); });
  canvas.addEventListener('pointermove', aim);
  var keyDir = 0;
  window.addEventListener('keydown', function (e) {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keyDir = -1; e.preventDefault(); }
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') { keyDir = 1; e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && keyDir < 0) keyDir = 0;
    if ((e.code === 'ArrowRight' || e.code === 'KeyD') && keyDir > 0) keyDir = 0;
  });
  setInterval(function () { if (keyDir && shell.running) target = P.clamp(target + keyDir * 0.03, 0, 1); }, 16);

  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
