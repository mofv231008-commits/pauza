<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140734">
<meta name="color-scheme" content="dark">
<title>Пауза · На глаз</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/pauza.css?v=6">
<style>

</style>
</head>
<body>
<div class="stage" id="stage">
<canvas id="game" aria-label="На глаз. Выполняй задания без подсказок"></canvas>
</div>
<script src="../shared/pauza.js?v=6"></script>
<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var stage = document.getElementById('stage'), canvas = document.getElementById('game');
  var ROUNDS = 10, round = 0, total = 0, task = null, phase = 'task', res = null, S = 1, drawPts = [], holding = false, last = [];
  var shell = P.shell({
    id: 'estimate', title: 'На глаз', tagline: 'Десять заданий без линейки и секундомера.',
    rulesHtml: '<p>Останови время, поставь угол, отметь середину, залей часть полоски, нарисуй круг. За каждое задание до 100 очков — чем точнее, тем больше. Всего десять заданий.</p>',
    startLabel: 'Начать', countdown: false, overEyebrow: 'Твой глазомер',
    unit: function (n) { return P.plural(n, ['очко', 'очка', 'очков']); }, onReset: reset
  });
  var view = P.canvas(canvas, stage, function () { S = P.clamp(view.W / 390, 0.8, 1.3); });
  function reset() { round = 0; total = 0; last = []; shell.setScore('0'); next(); }
  function next() {
    round++; phase = 'task'; res = null; drawPts = []; holding = false;
    shell.setSide(round + '/' + ROUNDS);
    var kinds = ['time', 'angle', 'mid', 'frac', 'circle', 'center'], k = P.pick(kinds.filter(function (x) { return last.indexOf(x) < 0; }));
    last.push(k); if (last.length > 3) last.shift();
    var W = view.W, H = view.H;
    if (k === 'time') task = { k: k, goal: P.pick([2, 3, 4, 5]), t0: performance.now(), stopped: null, title: '' };
    else if (k === 'angle') task = { k: k, goal: 15 + P.rand(31) * 5, a: 0, title: '' };
    else if (k === 'mid') { var len = (160 + Math.random() * 120) * S, ang = (Math.random() - 0.5) * 1.2, cx = W / 2 + (Math.random() - 0.5) * 60, cy = H * 0.5; task = { k: k, x1: cx - Math.cos(ang) * len / 2, y1: cy - Math.sin(ang) * len / 2, x2: cx + Math.cos(ang) * len / 2, y2: cy + Math.sin(ang) * len / 2, mark: null }; }
    else if (k === 'frac') { var f = P.pick([[1, 2], [1, 3], [1, 4], [2, 3], [3, 4], [1, 5], [2, 5]]); task = { k: k, n: f[0], d: f[1], v: 0 }; }
    else if (k === 'circle') task = { k: k };
    else task = { k: k, x: W * (0.3 + Math.random() * 0.4), y: H * (0.38 + Math.random() * 0.25), r: (60 + Math.random() * 60) * S, mark: null };
  }
  function title() {
    if (!task) return '';
    return { time: 'Останови на ' + task.goal + ',00 с', angle: 'Поставь угол ' + task.goal + '°', mid: 'Отметь середину отрезка', frac: 'Залей ровно ' + task.n + '/' + task.d, circle: 'Нарисуй ровный круг', center: 'Попади в центр круга' }[task.k];
  }
  function hint() { return { time: 'нажми, когда пройдёт ровно столько', angle: 'крути пальцем и отпусти', mid: 'нажми на отрезок', frac: 'держи — заливается, отпусти — стоп', circle: 'веди пальцем одним движением', center: 'нажми в середину' }[task.k]; }
  function score(p, txt) { p = Math.max(0, Math.round(p)); total += p; shell.setScore(String(total)); res = { p: p, txt: txt }; phase = 'result'; P.haptic(p >= 80 ? 'win' : p >= 40 ? 'coin' : 'crash'); }
  function finishTask() {
    var t = task;
    if (t.k === 'time') { var el = (t.stopped - t.t0) / 1000, e = Math.abs(el - t.goal); score(100 - e * 120, 'вышло ' + el.toFixed(2).replace('.', ',') + ' с'); }
    else if (t.k === 'angle') { var deg = Math.round(t.a), e2 = Math.abs(deg - t.goal); score(100 - e2 * 3.3, 'вышло ' + deg + '°'); }
    else if (t.k === 'mid') { var L = Math.hypot(t.x2 - t.x1, t.y2 - t.y1), mx = (t.x1 + t.x2) / 2, my = (t.y1 + t.y2) / 2, e3 = Math.hypot(t.mark.x - mx, t.mark.y - my) / L; score(100 - e3 * 450, 'мимо на ' + Math.round(e3 * 100) + '% длины'); }
    else if (t.k === 'frac') { var goal = t.n / t.d, e4 = Math.abs(t.v - goal); score(100 - e4 * 420, 'залито ' + Math.round(t.v * 100) + '% из ' + Math.round(goal * 100) + '%'); }
    else if (t.k === 'circle') {
      var n = drawPts.length; if (n < 12) { score(0, 'слишком коротко'); return; }
      var cx = 0, cy = 0; drawPts.forEach(function (p) { cx += p.x; cy += p.y; }); cx /= n; cy /= n;
      var rs = drawPts.map(function (p) { return Math.hypot(p.x - cx, p.y - cy); }), mr = rs.reduce(function (a, b) { return a + b; }, 0) / n;
      var sd = Math.sqrt(rs.reduce(function (a, r) { return a + (r - mr) * (r - mr); }, 0) / n), cv = sd / mr;
      var sweep = 0; for (var i = 1; i < n; i++) { var a1 = Math.atan2(drawPts[i - 1].y - cy, drawPts[i - 1].x - cx), a2 = Math.atan2(drawPts[i].y - cy, drawPts[i].x - cx), d = a2 - a1; d = Math.atan2(Math.sin(d), Math.cos(d)); sweep += d; }
      var cover = Math.min(1, Math.abs(sweep) / (Math.PI * 2)), gap = Math.hypot(drawPts[0].x - drawPts[n - 1].x, drawPts[0].y - drawPts[n - 1].y) / mr;
      task.cx = cx; task.cy = cy; task.mr = mr;
      score((100 - cv * 380) * cover - Math.max(0, gap - 0.3) * 30, 'круглость ' + Math.max(0, Math.round((1 - cv * 3.8) * 100)) + '%');
    }
    else { var e5 = Math.hypot(t.mark.x - t.x, t.mark.y - t.y) / t.r; score(100 - e5 * 260, 'мимо на ' + Math.round(e5 * t.r / S) + ' пикс.'); }
  }
  function advance() {
    if (round >= ROUNDS) { phase = 'done'; shell.end({ score: total, delay: 200, stats: 'из 1000 возможных', phrase: 'Мой глазомер — ' + total + ' из 1000 в игре «На глаз». А твой?' }); return; }
    next();
  }
  P.loop(function (dt) {
    if (shell.running && task && task.k === 'frac' && holding && phase === 'task') { task.v = Math.min(1, task.v + dt * 0.42); if (task.v >= 1) { holding = false; finishTask(); } }
    draw();
  });
  function draw() {
    var c = view.ctx, W = view.W, H = view.H, t = task;
    c.fillStyle = '#22105A'; c.fillRect(0, 0, W, H);
    if (!t || !shell.running && phase !== 'result') { return; }
    c.textAlign = 'center'; c.fillStyle = '#F4F1FF'; c.font = '800 ' + Math.round(22 * S) + 'px Unbounded, Arial Black, sans-serif'; c.fillText(title(), W / 2, 130 * S);
    c.fillStyle = '#B9A8F0'; c.font = '500 ' + Math.round(14 * S) + 'px Onest, sans-serif'; c.fillText(phase === 'task' ? hint() : 'нажми, чтобы продолжить', W / 2, 156 * S);
    var cx = W / 2, cy = H * 0.52;
    c.lineCap = 'round';
    if (t.k === 'time') {
      var el = ((t.stopped || performance.now()) - t.t0) / 1000;
      c.font = '800 ' + Math.round(54 * S) + 'px Unbounded, Arial Black, sans-serif'; c.fillStyle = '#FFD84D';
      c.fillText(phase === 'result' || el < 1 ? el.toFixed(2).replace('.', ',') : '?,??', cx, cy);
    } else if (t.k === 'angle') {
      var L = 130 * S, ox = cx - 60 * S, oy = cy + 60 * S;
      c.strokeStyle = '#B9A8F0'; c.lineWidth = 5; c.beginPath(); c.moveTo(ox, oy); c.lineTo(ox + L * 1.3, oy); c.stroke();
      var a = -t.a * Math.PI / 180; c.strokeStyle = '#3DF5B0'; c.beginPath(); c.moveTo(ox, oy); c.lineTo(ox + Math.cos(a) * L, oy + Math.sin(a) * L); c.stroke();
      c.strokeStyle = '#FFD84D'; c.lineWidth = 3; c.beginPath(); c.arc(ox, oy, 40 * S, 0, a, true); c.stroke();
      if (phase === 'result') { var g = -t.goal * Math.PI / 180; c.strokeStyle = 'rgba(255,107,74,.8)'; c.setLineDash([6, 6]); c.beginPath(); c.moveTo(ox, oy); c.lineTo(ox + Math.cos(g) * L, oy + Math.sin(g) * L); c.stroke(); c.setLineDash([]); }
    } else if (t.k === 'mid') {
      c.strokeStyle = '#F4F1FF'; c.lineWidth = 6; c.beginPath(); c.moveTo(t.x1, t.y1); c.lineTo(t.x2, t.y2); c.stroke();
      if (t.mark) { c.fillStyle = '#3DF5B0'; c.beginPath(); c.arc(t.mark.x, t.mark.y, 8, 0, 7); c.fill(); }
      if (phase === 'result') { c.fillStyle = '#FF6B4A'; c.beginPath(); c.arc((t.x1 + t.x2) / 2, (t.y1 + t.y2) / 2, 6, 0, 7); c.fill(); }
    } else if (t.k === 'frac') {
      var bw = W - 60 * S, bh = 56 * S, bx = 30 * S, by = cy - bh / 2;
      c.fillStyle = '#140734'; c.fillRect(bx, by, bw, bh); c.fillStyle = '#FF8AD8'; c.fillRect(bx, by, bw * t.v, bh);
      c.strokeStyle = '#F4F1FF'; c.lineWidth = 3; c.strokeRect(bx, by, bw, bh);
      if (phase === 'result') { var gx = bx + bw * t.n / t.d; c.strokeStyle = '#FFD84D'; c.lineWidth = 4; c.beginPath(); c.moveTo(gx, by - 12); c.lineTo(gx, by + bh + 12); c.stroke(); }
    } else if (t.k === 'circle') {
      c.strokeStyle = '#3DF5B0'; c.lineWidth = 5; c.beginPath(); drawPts.forEach(function (p, i) { c[i ? 'lineTo' : 'moveTo'](p.x, p.y); }); c.stroke();
      if (phase === 'result' && t.mr) { c.strokeStyle = 'rgba(255,216,77,.7)'; c.setLineDash([6, 6]); c.lineWidth = 2; c.beginPath(); c.arc(t.cx, t.cy, t.mr, 0, 7); c.stroke(); c.setLineDash([]); }
    } else {
      c.strokeStyle = '#6FD3FF'; c.lineWidth = 5; c.beginPath(); c.arc(t.x, t.y, t.r, 0, 7); c.stroke();
      if (t.mark) { c.fillStyle = '#3DF5B0'; c.beginPath(); c.arc(t.mark.x, t.mark.y, 7, 0, 7); c.fill(); }
      if (phase === 'result') { c.fillStyle = '#FF6B4A'; c.beginPath(); c.arc(t.x, t.y, 5, 0, 7); c.fill(); }
    }
    if (phase === 'result' && res) {
      c.fillStyle = res.p >= 80 ? '#3DF5B0' : res.p >= 40 ? '#FFD84D' : '#FF6B4A'; c.font = '800 ' + Math.round(40 * S) + 'px Unbounded, Arial Black, sans-serif'; c.fillText('+' + res.p, cx, H - 150 * S);
      c.fillStyle = '#B9A8F0'; c.font = '500 ' + Math.round(15 * S) + 'px Onest, sans-serif'; c.fillText(res.txt, cx, H - 118 * S);
    }
  }
  function pos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointerdown', function (e) {
    if (!shell.running || !task) return;
    if (phase === 'result') { advance(); return; }
    if (phase !== 'task') return;
    var p = pos(e), t = task;
    if (t.k === 'time') { t.stopped = performance.now(); finishTask(); }
    else if (t.k === 'mid' || t.k === 'center') { t.mark = p; finishTask(); }
    else if (t.k === 'frac') holding = true;
    else if (t.k === 'circle') { drawPts = [p]; holding = true; }
    else if (t.k === 'angle') { holding = true; setAngle(p); }
    try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
  });
  function setAngle(p) { var ox = view.W / 2 - 60 * S, oy = view.H * 0.52 + 60 * S; var a = -Math.atan2(p.y - oy, p.x - ox) * 180 / Math.PI; task.a = P.clamp(a, 0, 180); }
  canvas.addEventListener('pointermove', function (e) {
    if (!holding || phase !== 'task') return;
    if (task.k === 'circle') { var p = pos(e), l = drawPts[drawPts.length - 1]; if (Math.hypot(p.x - l.x, p.y - l.y) > 4) drawPts.push(p); }
    else if (task.k === 'angle') setAngle(pos(e));
  });
  function up() { if (!holding || phase !== 'task') { holding = false; return; } holding = false; if (task.k === 'frac' || task.k === 'circle' || task.k === 'angle') finishTask(); }
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
})();
</script>
</body>
</html>
