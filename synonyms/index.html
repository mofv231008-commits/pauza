<script>
(function () {
  'use strict';
  var P = window.Pauza;
  var S = [
    ['большой', 'огромный'], ['маленький', 'крошечный'], ['быстрый', 'скорый'], ['красивый', 'прекрасный'], ['смелый', 'храбрый'], ['умный', 'сообразительный'],
    ['грустный', 'печальный'], ['весёлый', 'радостный'], ['холодный', 'студёный'], ['тихий', 'бесшумный'], ['старый', 'древний'], ['друг', 'приятель'],
    ['враг', 'противник'], ['дом', 'жилище'], ['путь', 'дорога'], ['работа', 'труд'], ['страх', 'ужас'], ['смех', 'хохот'], ['бежать', 'мчаться'],
    ['смотреть', 'глядеть'], ['думать', 'размышлять'], ['идти', 'шагать'], ['плакать', 'рыдать'], ['кричать', 'вопить'], ['прыгать', 'скакать'],
    ['ругать', 'бранить'], ['врать', 'лгать'], ['заканчивать', 'завершать'], ['торопиться', 'спешить'], ['ждать', 'ожидать'], ['ошибка', 'промах'],
    ['метель', 'вьюга'], ['бегемот', 'гиппопотам'], ['лошадь', 'конь'], ['доктор', 'врач'], ['шофёр', 'водитель'], ['азбука', 'алфавит'],
    ['крепкий', 'прочный'], ['мокрый', 'влажный'], ['жадный', 'скупой'], ['добрый', 'отзывчивый'], ['вежливый', 'учтивый'], ['честный', 'правдивый'],
    ['хитрый', 'лукавый'], ['тайна', 'секрет'], ['беседа', 'разговор'], ['подарок', 'презент'], ['богатый', 'состоятельный'], ['бедный', 'нищий'],
    ['глупый', 'бестолковый'], ['скучный', 'нудный'], ['чистый', 'опрятный'], ['грязный', 'чумазый'], ['сильный', 'мощный'], ['слабый', 'хилый'],
    ['интересный', 'увлекательный'], ['трудный', 'сложный'], ['огонь', 'пламя'], ['сражение', 'битва'], ['родина', 'отчизна'], ['взгляд', 'взор'],
    ['глаза', 'очи'], ['губы', 'уста'], ['лоб', 'чело'], ['конец', 'финал'], ['начало', 'старт'], ['ураган', 'буря'], ['кавардак', 'беспорядок'],
    ['отважный', 'бесстрашный'], ['усталый', 'утомлённый'], ['мигом', 'мгновенно'], ['вдруг', 'внезапно']
  ];
  var GROUPS = [['смелый', 'храбрый', 'отважный', 'бесстрашный'], ['вдруг', 'внезапно', 'мигом', 'мгновенно', 'быстрый', 'скорый'], ['ураган', 'буря', 'метель', 'вьюга'],
    ['конец', 'финал', 'заканчивать', 'завершать'], ['глаза', 'очи', 'взгляд', 'взор', 'смотреть', 'глядеть'], ['кричать', 'вопить', 'плакать', 'рыдать'], ['бежать', 'мчаться', 'торопиться', 'спешить'],
    ['грустный', 'печальный', 'скучный', 'нудный'], ['враг', 'противник', 'сражение', 'битва'], ['трудный', 'сложный', 'крепкий', 'прочный'], ['весёлый', 'радостный', 'смех', 'хохот']];
  function near(a, b) { return GROUPS.some(function (g) { return g.indexOf(a) >= 0 && g.indexOf(b) >= 0; }); }
  var order = [], pos = 0, all = [];
  S.forEach(function (p) { all.push(p[0], p[1]); });
  PauzaQuiz({
    id: 'synonyms', title: 'Синонимы', tagline: 'Слова-близнецы по смыслу.',
    rules: '<p>Дано слово — выбери из четырёх то, что ближе всего по смыслу. Ошибка отнимает 3 секунды. На всё 60 секунд.</p>',
    sub: 'Синоним к слову',
    onReset: function () { order = P.shuffle(S.map(function (_, i) { return i; })); pos = 0; },
    next: function () {
      if (!order.length || pos >= order.length) { order = P.shuffle(S.map(function (_, i) { return i; })); pos = 0; }
      var p = S[order[pos++]], flip = Math.random() < 0.4, w = flip ? p[1] : p[0], ans = flip ? p[0] : p[1];
      var wrong = P.shuffle(all.filter(function (x) { return x !== p[0] && x !== p[1] && !near(x, w) && !near(x, ans); })).slice(0, 3);
      var opts = P.shuffle([ans].concat(wrong));
      return { q: w, opts: opts, right: opts.indexOf(ans) };
    }
  });
})();
</script>
