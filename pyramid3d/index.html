<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E1D1B">
  <meta name="color-scheme" content="dark">
  <title>Пауза · Русский бильярд 3D</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../shared/pauza.css?v=7">
  <link rel="stylesheet" href="club.css?v=4">
</head>
<body>
  <main class="stage club">
    <div class="club-layout">
      <div class="club-table">
        <canvas id="table" tabindex="0" aria-label="Бильярдный стол. Коснись или проведи пальцем для прицела."></canvas>
      </div>
      <div class="club-console">
        <p id="status" role="status"></p>
        <div class="club-tools">
          <button type="button" id="camera" aria-pressed="false">Вид сверху</button>
          <button type="button" id="rotate-left" class="club-rotate" aria-label="Повернуть камеру влево" title="Повернуть камеру влево">↶</button>
          <button type="button" id="rotate-right" class="club-rotate" aria-label="Повернуть камеру вправо" title="Повернуть камеру вправо">↷</button>
          <button type="button" id="select" aria-label="Выбрать биток" aria-pressed="false">Биток</button>
        </div>
        <div class="club-shot">
          <label for="power">Сила <output id="power-value" for="power">70%</output></label>
          <input id="power" type="range" min="15" max="100" value="70">
          <button type="button" id="shoot">Удар</button>
        </div>
      </div>
    </div>
  </main>
  <script src="../shared/pauza.js?v=7"></script>
  <script src="physics.js?v=5"></script>
  <script src="scene.js?v=5"></script>
  <script src="club.js?v=5"></script>
</body>
</html>
